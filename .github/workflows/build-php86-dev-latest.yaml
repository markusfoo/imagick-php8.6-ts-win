name: Build PHP 8.6.0-dev TS Windows VS18 (x86 + x64)

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version string for artifact naming (placeholder: {{PHP_VERSION}} in release body)'
        required: false
        default: '8.6.0-dev'
      include_x86:
        description: 'Build x86 (32-bit) variant in addition to x64'
        required: false
        default: true
        type: boolean

env:
  PHP_VERSION: ${{ inputs.php_version }}

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, starter: phpsdk-vs18-x64.bat }
          - { arch: x86, starter: phpsdk-vs18-x86.bat }
    name: Build ${{ matrix.arch }}
    steps:
      - name: Skip x86 if disabled
        if: ${{ matrix.arch == 'x86' && !inputs.include_x86 }}
        run: echo "x86 build skipped (include_x86=false)" && exit 0

      - name: Checkout PHP source (master branch with latest commits)
        if: ${{ !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: master
          path: php-src
          fetch-depth: 1

      - name: Checkout PHP SDK binary tools
        if: ${{ !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: actions/checkout@v7
        with:
          repository: php/php-sdk-binary-tools
          ref: master
          path: php-sdk
          fetch-depth: 1

      - name: Setup Visual Studio 2024 (msbuild in PATH)
        if: ${{ !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: microsoft/setup-msbuild@v3

      - name: Build PHP TS (Thread Safe) with VS2024
        if: ${{ !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: cmd
        run: |
          REM Activate PHP SDK environment for VS2024 (vs18) - auto-discovers VS install
          REM This calls vcvarsall.bat to set up the MSVC environment
          call ${{ github.workspace }}\php-sdk\${{ matrix.starter }}

          REM Switch to PHP source directory
          cd ${{ github.workspace }}\php-src

          REM Generate build configuration
          call buildconf.bat

          REM Download pre-built dependencies (openssl, curl, sqlite, icu, etc.)
          REM Use full path because starter script may not add bin/ to PATH
          call ${{ github.workspace }}\php-sdk\bin\phpsdk_deps.bat --update --force --batch

          REM Configure Thread Safe build with standard extensions
          call configure.bat ^
            --enable-zts ^
            --enable-cli ^
            --enable-cgi ^
            --enable-mbstring ^
            --with-openssl ^
            --with-curl ^
            --with-mysqli ^
            --with-pdo-mysql ^
            --enable-opcache ^
            --enable-intl ^
            --with-libxml ^
            --with-zlib ^
            --enable-fileinfo ^
            --enable-bcmath ^
            --enable-exif ^
            --enable-ftp ^
            --enable-gd ^
            --with-gettext ^
            --enable-mbregex ^
            --enable-pdo ^
            --with-pdo-sqlite ^
            --enable-shmop ^
            --enable-soap ^
            --enable-sockets ^
            --enable-sysvmsg ^
            --enable-sysvsem ^
            --enable-sysvshm ^
            --enable-xsl

          REM Compile
          nmake

      - name: Package full distribution
        if: ${{ !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: cmd
        run: |
          set DIST_NAME=php-${{ env.PHP_VERSION }}-ts-Win32-vs18-${{ matrix.arch }}
          set DIST_DIR=${{ github.workspace }}\%DIST_NAME%

          set REL_DIR=${{ github.workspace }}\php-src\x64\Release_TS
          if "${{ matrix.arch }}"=="x86" set REL_DIR=${{ github.workspace }}\php-src\Release_TS

          mkdir "%DIST_DIR%"

          copy "%REL_DIR%\php.exe" "%DIST_DIR%\"
          copy "%REL_DIR%\php-cgi.exe" "%DIST_DIR%\"
          copy "%REL_DIR%\php8ts.dll" "%DIST_DIR%\"
          copy "%REL_DIR%\php8apache2_4.dll" "%DIST_DIR%\"
          copy "%REL_DIR%\php8ts.pdb" "%DIST_DIR%\"  2>nul
          copy "%REL_DIR%\php.pdb" "%DIST_DIR%\"  2>nul

          mkdir "%DIST_DIR%\ext"
          copy "%REL_DIR%\ext\*.dll" "%DIST_DIR%\ext\"

          copy "%REL_DIR%\libcrypto-*.dll" "%DIST_DIR%\"  2>nul
          copy "%REL_DIR%\libssl-*.dll" "%DIST_DIR%\"  2>nul
          copy "%REL_DIR%\icu*.dll" "%DIST_DIR%\"  2>nul
          copy "%REL_DIR%\lib*.dll" "%DIST_DIR%\"  2>nul

          copy "${{ github.workspace }}\php-src\php.ini-development" "%DIST_DIR%\"
          copy "${{ github.workspace }}\php-src\php.ini-production" "%DIST_DIR%\"
          copy "${{ github.workspace }}\php-src\LICENSE" "%DIST_DIR%\LICENSE.txt"  2>nul
          copy "${{ github.workspace }}\php-src\NEWS" "%DIST_DIR%\NEWS.txt"  2>nul
          copy "${{ github.workspace }}\php-src\README.md" "%DIST_DIR%\README.md"  2>nul

          cd ${{ github.workspace }}
          7z a -tzip "%DIST_NAME%.zip" "%DIST_NAME%" -mx9
          dir "%DIST_NAME%.zip"

      - name: Upload build artifact
        if: ${{ !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ env.PHP_VERSION }}-ts-Win32-vs18-${{ matrix.arch }}
          path: ${{ github.workspace }}/php-*.zip
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Consolidate zip files
        run: |
          mkdir -p release_assets
          find artifacts -name "php-*.zip" -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Generate release metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          BUILD_TIME=$(date -u +'%H:%M UTC')
          TAG="php-${{ inputs.php_version }}-${BUILD_DATE}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          PHP_COMMIT=$(curl -s https://api.github.com/repos/php/php-src/commits/master | grep -oE '"sha":"[a-f0-9]+"' | head -1 | cut -d'"' -f4)
          echo "php_commit=${PHP_COMMIT:0:12}" >> $GITHUB_OUTPUT
          echo "php_commit_full=${PHP_COMMIT}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: PHP ${{ inputs.php_version }} TS Windows VS18 - ${{ steps.meta.outputs.build_date }}
          body: |
            # PHP ${{ inputs.php_version }} - Thread Safe Windows Build (VS2024)

            | Field | Value |
            |---|---|
            | **Build date** | ${{ steps.meta.outputs.build_date }} ${{ steps.meta.outputs.build_time }} |
            | **PHP source commit** | [${{ steps.meta.outputs.php_commit }}](https://github.com/php/php-src/commit/${{ steps.meta.outputs.php_commit_full }}) |
            | **Compiler** | Visual Studio 2024 (VC18, vs18) |
            | **Build type** | Thread Safe (ZTS) - for Apache mod_php and XAMPP |
            | **Architectures** | x86, x64 |

            ## Downloads

            Each zip is a **complete PHP distribution** - ready to extract and use, no additional dependencies required.

            | Asset | Architecture | Use case |
            |---|---|---|
            | `php-{{PHP_VERSION}}-ts-Win32-vs18-x64.zip` | x64 (64-bit) | Modern Windows (10/11, Server 2016+) |
            | `php-{{PHP_VERSION}}-ts-Win32-vs18-x86.zip` | x86 (32-bit) | 32-bit Windows or legacy apps |

            > **Note:** `{{PHP_VERSION}}` is a placeholder automatically replaced at build time. Current build: **${{ inputs.php_version }}**

            ## Contents of each zip

            - `php.exe` - CLI binary
            - `php-cgi.exe` - FastCGI binary (for IIS / nginx FastCGI)
            - `php8ts.dll` - Thread Safe PHP engine (used by Apache mod_php)
            - `php8apache2_4.dll` - Apache 2.4 module (for XAMPP / Apache mod_php)
            - `ext/*.dll` - All standard extensions (mysqli, opcache, curl, gd, intl, mbstring, soap, sockets, etc.)
            - Dependency DLLs (`libcrypto-*.dll`, `libssl-*.dll`, `icu*.dll`, etc.)
            - `php.ini-development` and `php.ini-production` - configuration templates
            - `LICENSE.txt`, `NEWS.txt`, `README.md` - PHP documentation

            ## Installation

            ### For XAMPP / Apache mod_php (TS = Thread Safe)

            1. Download the zip matching your architecture (x64 for 64-bit Windows recommended)
            2. Extract to a folder, e.g. `C:\php\`
            3. Backup existing files:
               ```
               copy C:\xampp\php\php8ts.dll C:\xampp\php\php8ts.dll.backup
               copy C:\xampp\apache\modules\php8apache2_4.dll C:\xampp\apache\modules\php8apache2_4.dll.backup
               ```
            4. Stop Apache (via XAMPP Control Panel)
            5. Replace files:
               - `php8ts.dll` -> `C:\xampp\php\php8ts.dll`
               - `php8apache2_4.dll` -> `C:\xampp\apache\modules\php8apache2_4.dll`
               - `php.exe` -> `C:\xampp\php\php.exe`
               - `ext\*.dll` -> `C:\xampp\php\ext\`
            6. Start Apache
            7. Verify: `C:\xampp\php\php.exe -v`

            ### For IIS / Nginx FastCGI

            1. Extract to e.g. `C:\php\`
            2. Copy `php.ini-production` to `php.ini` and configure as needed
            3. Point your web server to `php-cgi.exe`

            ## Features included

            This build is based on the latest `master` branch of `php/php-src` and includes all PHP 8.6 features:

            - **Partial Function Application (PFA)** - `?` placeholder syntax (RFC passed 33-0)
            - **`clamp()`** - built-in function for constraining values
            - **Readonly Property Defaults** - `public readonly array $x = [];` now valid
            - **`SortDirection`** enum
            - **`grapheme_strrev()`**
            - **`#[\Override]` on class constants**
            - **`Time\Duration`** class
            - **`Io\Poll`** polling API
            - **Debuggable enums** (`__debugInfo`)
            - All deprecation notices and behavior changes from PHP 8.6

            ## Verification

            After installation, verify the build:

            ```
            php -v
            :: Should output: PHP 8.6.0-dev (cli) (built: <build date>) (ZTS Visual C++ 2024 x64)

            php -r "echo function_exists('clamp') ? 'clamp() exists' : 'clamp() missing';"
            :: Should output: clamp() exists

            php -r "class T { public readonly array $d = []; } $t = new T(); echo 'readonly+default OK';"
            :: Should output: readonly+default OK
            ```

            ## Source

            - Built from: https://github.com/php/php-src (master branch)
            - Commit: ${{ steps.meta.outputs.php_commit_full }}
            - PHP SDK: https://github.com/php/php-sdk-binary-tools
            - Compiler: Visual Studio 2024 (VS18, vs18) on windows-2025 runner

            ---

            *This is an automated build. The release was created by the workflow `build-php86-dev-latest.yaml`.*
          files: release_assets/*.zip
          generate_release_notes: false
          draft: false
          prerelease: true
