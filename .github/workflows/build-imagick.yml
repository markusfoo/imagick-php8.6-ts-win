name: Build Imagick for PHP 8.6

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  PHP_SDK_VERSION: "2.8.3"
  IMAGICK_VERSION: "3.8.1"
  IMAGEMAGICK_VERSION: "7.1.1-47"

jobs:

  build:
    name: Build Imagick PHP 8.6 ${{ matrix.mode }} x64
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: ts
            php_suffix: ""
            devel_suffix: ""
            zts_flag: "--enable-zts"

          - mode: nts
            php_suffix: "-nts"
            devel_suffix: "-nts"
            zts_flag: "--disable-zts"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # DOWNLOAD PHP BINARY
      # ============================================================

      - name: Download PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION$env:php_suffix-Win32-vs18-x64.zip"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Downloading PHP binary"
          Write-Host "========================================"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-bin.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-bin.zip")) {
            throw "PHP binary was not downloaded."
          }

          Write-Host "PHP binary downloaded."

        env:
          php_suffix: ${{ matrix.php_suffix }}

      # ============================================================
      # DOWNLOAD PHP DEVELOPMENT PACK
      # ============================================================

      - name: Download PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION$env:devel_suffix-Win32-vs18-x64.zip"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Downloading PHP development pack"
          Write-Host "========================================"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel.zip")) {
            throw "PHP development pack was not downloaded."
          }

          Write-Host "PHP development pack downloaded."

        env:
          devel_suffix: ${{ matrix.devel_suffix }}

      # ============================================================
      # DOWNLOAD IMAGE MAGICK
      # ============================================================

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Downloading ImageMagick"
          Write-Host "========================================"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "im.zip" `
            -UseBasicParsing

          if (-not (Test-Path "im.zip")) {
            throw "ImageMagick package was not downloaded."
          }

          Write-Host "ImageMagick downloaded."

      # ============================================================
      # DOWNLOAD PHP SDK
      # ============================================================

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Downloading PHP SDK"
          Write-Host "========================================"
          Write-Host $url

          $success = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Write-Host "Attempt $attempt / 5"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile "sdk.zip" `
                -UseBasicParsing `
                -TimeoutSec 120

              if (Test-Path "sdk.zip") {
                $success = $true
                break
              }
            }
            catch {
              Write-Host "Download failed: $($_.Exception.Message)"

              if ($attempt -lt 5) {
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }

          if (-not $success) {
            throw "PHP SDK download failed after 5 attempts."
          }

          Write-Host "PHP SDK downloaded."

      # ============================================================
      # DOWNLOAD IMAGICK SOURCE
      # ============================================================

      - name: Download Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $primaryUrl = "https://codeload.github.com/Imagick/imagick/zip/refs/tags/$env:IMAGICK_VERSION"
          $fallbackUrl = "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Downloading Imagick source"
          Write-Host "========================================"
          Write-Host "Primary:"
          Write-Host $primaryUrl

          $success = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Write-Host "Attempt $attempt / 5"

              Invoke-WebRequest `
                -Uri $primaryUrl `
                -OutFile "imagick.zip" `
                -UseBasicParsing `
                -TimeoutSec 120

              if ((Test-Path "imagick.zip") -and ((Get-Item "imagick.zip").Length -gt 100000)) {
                $success = $true
                break
              }
            }
            catch {
              Write-Host "Primary download failed: $($_.Exception.Message)"

              if (Test-Path "imagick.zip") {
                Remove-Item "imagick.zip" -Force
              }

              if ($attempt -lt 5) {
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }

          if (-not $success) {
            Write-Host ""
            Write-Host "Trying GitHub archive fallback:"
            Write-Host $fallbackUrl

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest `
                  -Uri $fallbackUrl `
                  -OutFile "imagick.zip" `
                  -UseBasicParsing `
                  -TimeoutSec 120

                if ((Test-Path "imagick.zip") -and ((Get-Item "imagick.zip").Length -gt 100000)) {
                  $success = $true
                  break
                }
              }
              catch {
                Write-Host "Fallback attempt $attempt failed: $($_.Exception.Message)"

                if (Test-Path "imagick.zip") {
                  Remove-Item "imagick.zip" -Force
                }

                if ($attempt -lt 3) {
                  Start-Sleep -Seconds (5 * $attempt)
                }
              }
            }
          }

          if (-not $success) {
            throw "Imagick $env:IMAGICK_VERSION source could not be downloaded."
          }

          Write-Host "Imagick source downloaded."

      # ============================================================
      # EXTRACT PHP BINARY
      # ============================================================

      - name: Extract PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-bin"
          $extract = "C:\php-bin-extract"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-bin.zip" `
            -DestinationPath $extract `
            -Force

          $php = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $php) {
            throw "php.exe was not found in PHP binary package."
          }

          Write-Host ""
          Write-Host "Found PHP:"
          Write-Host $php.FullName

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Copy-Item `
            -Path "$($php.Directory.FullName)\*" `
            -Destination $root `
            -Recurse `
            -Force

          if (-not (Test-Path "$root\php.exe")) {
            throw "Normalized PHP binary was not created."
          }

          Write-Host ""
          Write-Host "PHP executable:"
          Write-Host "$root\php.exe"

      # ============================================================
      # EXTRACT PHP DEVELOPMENT PACK
      # ============================================================

      - name: Extract PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-devel"
          $extract = "C:\php-devel-extract"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath $extract `
            -Force

          $phpize = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
            throw "phpize.bat was not found in PHP development package."
          }

          $actualRoot = $phpize.Directory.FullName

          Write-Host ""
          Write-Host "PHP development package root:"
          Write-Host $actualRoot

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Copy-Item `
            -Path "$actualRoot\*" `
            -Destination $root `
            -Recurse `
            -Force

          if (-not (Test-Path "$root\phpize.bat")) {
            throw "phpize.bat was not normalized."
          }

          Write-Host ""
          Write-Host "PHP development environment READY."

      # ============================================================
      # EXTRACT PHP SDK
      # ============================================================

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-sdk-extract"
          $sdkRoot = "C:\php-sdk"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $sdkRoot) {
            Remove-Item $sdkRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath $extract `
            -Force

          $starter = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -Filter "phpsdk-vs18-x64.bat" |
            Select-Object -First 1

          if (-not $starter) {
            Write-Host ""
            Write-Host "Available SDK scripts:"

            Get-ChildItem `
              -Path $extract `
              -Recurse `
              -Filter "*.bat" |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "phpsdk-vs18-x64.bat was not found."
          }

          $sdkActualRoot = $starter.Directory.FullName

          Write-Host ""
          Write-Host "PHP SDK root:"
          Write-Host $sdkActualRoot

          New-Item `
            -ItemType Directory `
            -Path $sdkRoot `
            -Force | Out-Null

          Copy-Item `
            -Path "$sdkActualRoot\*" `
            -Destination $sdkRoot `
            -Recurse `
            -Force

          if (-not (Test-Path "$sdkRoot\phpsdk-vs18-x64.bat")) {
            throw "PHP SDK was not normalized correctly."
          }

          Write-Host ""
          Write-Host "PHP SDK READY."

      # ============================================================
      # PREPARE IMAGEMAGICK
      # ============================================================

      - name: Prepare ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
            Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
            Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          if (-not $header) {
            throw "MagickWand.h was not found."
          }

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
            throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
            throw "CORE_RL_MagickCore_.lib was not found."
          }

          Write-Host ""
          Write-Host "ImageMagick header:"
          Write-Host $header.FullName

          Write-Host ""
          Write-Host "MagickWand library:"
          Write-Host $wandLib.FullName

          Write-Host ""
          Write-Host "MagickCore library:"
          Write-Host $coreLib.FullName

          $includeSource = $header.Directory.Parent.FullName

          $targetInclude = "$final\include\imagemagick"
          $targetLib = "$final\lib\imagemagick"
          $targetBin = "$final\bin"

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetLib `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetBin `
            -Force | Out-Null

          Copy-Item `
            -Path "$includeSource\*" `
            -Destination $targetInclude `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination $targetLib `
                -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination $targetBin `
                -Force
            }

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
            throw "Final ImageMagick header is missing."
          }

          if (-not (Test-Path $finalWand)) {
            throw "Final ImageMagick MagickWand library is missing."
          }

          if (-not (Test-Path $finalCore)) {
            throw "Final ImageMagick MagickCore library is missing."
          }

          Write-Host ""
          Write-Host "ImageMagick development files READY."

      # ============================================================
      # PREPARE IMAGICK SOURCE
      # ============================================================

      - name: Prepare Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\imagick-source"
          $target = "C:\php-devel\ext\imagick"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath $extract `
            -Force

          $sourceRoot = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $sourceRoot) {
            throw "Imagick source root was not found."
          }

          Copy-Item `
            -Path "$($sourceRoot.FullName)\*" `
            -Destination $target `
            -Recurse `
            -Force

          if (-not (Test-Path "$target\imagick_class.c")) {
            throw "imagick_class.c was not found."
          }

          if (-not (Test-Path "$target\config.w32")) {
            throw "config.w32 was not found."
          }

          Write-Host ""
          Write-Host "Imagick $env:IMAGICK_VERSION source READY."

      # ============================================================
      # APPLY ONLY PHP 8.6 FIX
      # ============================================================

      - name: Patch zend_is_callable for PHP 8.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\php-devel\ext\imagick\imagick_class.c"

          $old = 'if (!user_callback || !zend_is_callable(user_callback, 0, NULL TSRMLS_CC)) {'

          $new = 'if (!user_callback || !zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)) {'

          if (-not (Test-Path $file)) {
            throw "imagick_class.c does not exist."
          }

          $content = Get-Content `
            -Path $file `
            -Raw

          $count = ([regex]::Matches(
            $content,
            [regex]::Escape($old)
          )).Count

          Write-Host ""
          Write-Host "Original target occurrences: $count"

          if ($count -ne 1) {
            Write-Host ""
            Write-Host "Current zend_is_callable occurrences:"

            Select-String `
              -Path $file `
              -Pattern "zend_is_callable" |
              ForEach-Object {
                Write-Host "$($_.LineNumber): $($_.Line)"
              }

            throw "Expected exactly one target zend_is_callable call. Found: $count"
          }

          $content = $content.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            -Path $file `
            -Raw

          if (-not $verify.Contains($new)) {
            throw "PHP 8.6 patch was not applied."
          }

          if ($verify.Contains($old)) {
            throw "Old zend_is_callable call still exists."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PHP 8.6 FIX APPLIED"
          Write-Host "========================================"
          Write-Host $new

      # ============================================================
      # CREATE BUILD SCRIPT
      # ============================================================

      - name: Create build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          @echo off
          setlocal EnableExtensions

          echo ========================================
          echo PHP 8.6 Imagick 3.8.1
          echo BUILD MODE: ${{ matrix.mode }}
          echo ========================================
          echo.

          set PHP_DEV_PATH=C:\php-devel
          set IMAGEMAGICK_ROOT=C:\ImageMagick

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          if errorlevel 1 (
              echo ERROR: Cannot enter Imagick source directory.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHP VERSION
          echo ========================================

          C:\php-bin\php.exe -v

          if errorlevel 1 (
              echo ERROR: PHP executable failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================

          call "%PHP_DEV_PATH%\phpize.bat"

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================

          call "%PHP_DEV_PATH%\configure.bat" --with-imagick=shared --with-imagick-dir=C:\ImageMagick ${{ matrix.zts_flag }}

          if errorlevel 1 (
              echo ERROR: configure failed.

              if exist config.log (
                  echo.
                  echo ========================================
                  echo CONFIG.LOG
                  echo ========================================
                  type config.log
              )

              exit /b 1
          )

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================

          nmake /nologo

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo SEARCHING FOR PHP_IMAGICK.DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          echo.
          echo ========================================
          echo BUILD ARTIFACTS
          echo ========================================

          dir /s /b *.obj 2>nul
          dir /s /b *.lib 2>nul
          dir /s /b *.dll 2>nul

          echo.
          echo ========================================
          echo FINDING GENERATED DLL
          echo ========================================

          for /r %%F in (php_imagick.dll) do (
              echo FOUND:
              echo %%F
              copy /Y "%%F" "C:\php-devel\php_imagick-${{ matrix.mode }}.dll" >nul

              if errorlevel 1 (
                  echo ERROR: Could not copy generated DLL.
                  exit /b 1
              )

              echo DLL copied successfully.
              exit /b 0
          )

          echo ERROR: php_imagick.dll was not produced anywhere.
          exit /b 1
          '@

          $script = $script.Replace(
            '${{ matrix.mode }}',
            '${{ matrix.mode }}'
          )

          Set-Content `
            -Path "C:\build-imagick.bat" `
            -Value $script `
            -Encoding ASCII `
            -NoNewline

          Write-Host ""
          Write-Host "Build script created:"
          Write-Host "C:\build-imagick.bat"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Imagick
        shell: cmd
        run: |
          echo ========================================
          echo STARTING PHP SDK
          echo ========================================
          echo.

          if not exist "C:\php-sdk\phpsdk-vs18-x64.bat" (
              echo ERROR: PHP SDK starter does not exist.
              echo.
              echo Available SDK files:
              dir /s /b "C:\php-sdk\*.bat"
              exit /b 1
          )

          echo PHP SDK starter:
          echo C:\php-sdk\phpsdk-vs18-x64.bat
          echo.

          call "C:\php-sdk\phpsdk-vs18-x64.bat" -t "C:\build-imagick.bat"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: Imagick build failed
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo BUILD COMPLETED
          echo ========================================

      # ============================================================
      # COLLECT DLL
      # ============================================================

      - name: Collect DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $generated = "C:\php-devel\php_imagick-${{ matrix.mode }}.dll"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SEARCHING FINAL DLL"
          Write-Host "========================================"

          if (-not (Test-Path $generated)) {
            Write-Host "Expected generated DLL:"
            Write-Host $generated

            Write-Host ""
            Write-Host "All php_imagick.dll files:"

            Get-ChildItem `
              -Path "C:\php-devel\ext\imagick" `
              -Recurse `
              -Filter "php_imagick.dll" |
              ForEach-Object {
                Write-Host $_.FullName
              }

            Write-Host ""
            Write-Host "All DLL files:"

            Get-ChildItem `
              -Path "C:\php-devel\ext\imagick" `
              -Recurse `
              -Filter "*.dll" |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "${{ matrix.mode }} php_imagick.dll was not produced."
          }

          New-Item `
            -ItemType Directory `
            -Path "dist\${{ matrix.mode }}" `
            -Force | Out-Null

          Copy-Item `
            -Path $generated `
            -Destination "dist\${{ matrix.mode }}\php_imagick.dll" `
            -Force

          if (-not (Test-Path "dist\${{ matrix.mode }}\php_imagick.dll")) {
            throw "Failed to copy final DLL."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "${{ matrix.mode }} DLL READY"
          Write-Host "========================================"

          Get-Item "dist\${{ matrix.mode }}\php_imagick.dll" |
            Format-List FullName,Length

      # ============================================================
      # COPY IMAGEMAGICK RUNTIME DLLS
      # ============================================================

      - name: Copy ImageMagick runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $destination = "dist\${{ matrix.mode }}"

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination $destination `
                -Force
            }

          Write-Host ""
          Write-Host "ImageMagick runtime DLLs copied."

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify final DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "dist\${{ matrix.mode }}\php_imagick.dll"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL ARTIFACT"
          Write-Host "========================================"

          if (-not (Test-Path $dll)) {
            throw "Final DLL missing: $dll"
          }

          Get-Item $dll |
            Format-List FullName,Length

          Write-Host ""
          Write-Host "Build ${{ matrix.mode }} SUCCESS."

      # ============================================================
      # ZIP
      # ============================================================

      - name: Package DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "php_imagick-$env:IMAGICK_VERSION-8.6-${{ matrix.mode }}-vs18-x64.zip"

          Compress-Archive `
            -Path "dist\${{ matrix.mode }}\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            throw "ZIP package was not created."
          }

          Write-Host ""
