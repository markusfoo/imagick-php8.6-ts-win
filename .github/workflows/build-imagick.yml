name: Build Imagick PHP 8.6.0beta1 VS18 x64

# ============================================================================
# ROOT CAUSE (verified directly against php-src win32/build/confutils.js and
# imagick's own config.w32 -- not a guess):
#
#   imagick's config.w32 looks for ImageMagick in exactly two places:
#     1) <php-devel-pack>\include\imagemagick\MagickWand\MagickWand.h
#        <php-devel-pack>\lib\imagemagick\CORE_RL_MagickWand_.lib
#     2) <path passed to --with-imagick>\MagickWand\MagickWand.h   (directly!)
#        <path passed to --with-imagick>\lib\CORE_RL_MagickWand_.lib
#
#   Every previous version of this workflow built ImageMagick's dev tree as
#     C:\ImageMagick\include\imagemagick\MagickWand\MagickWand.h
#     C:\ImageMagick\lib\imagemagick\CORE_RL_MagickWand_.lib
#   ...which matches NEITHER of the two locations above. So config.w32 prints
#   "WARNING: imagick not enabled; libraries and headers not found", never
#   calls EXTENSION('imagick', ...), imagick never enters the Makefile, and
#   nmake "succeeds" because it has nothing to build. No compiler error is
#   ever produced -- that's why php_imagick.dll was always silently missing.
#
#   Fix: ImageMagick's headers now go directly under C:\ImageMagick\ (so
#   C:\ImageMagick\MagickWand\MagickWand.h exists) and libs go directly under
#   C:\ImageMagick\lib\ (so C:\ImageMagick\lib\CORE_RL_MagickWand_.lib
#   exists). --with-imagick="C:\ImageMagick" then matches location #2 above.
#
#   A hard fail-fast check right after configure.bat now greps its output
#   for "Enabling extension imagick" and aborts immediately with a clear
#   diagnostic if it's missing, instead of silently reaching nmake and only
#   discovering the problem minutes later when the DLL search comes up empty.
#
#   The zend_is_callable -> zend_is_callable_ex patch (required because PHP
#   8.6 made zend_is_callable a non-exported static inline function) is
#   already correctly applied in the vendored imagick source and is left
#   untouched. This was never the problem.
# ============================================================================
#
# BEFORE RUNNING THIS WORKFLOW, upload this ONE file into your repo:
#
#   vendor/imagick-php86-patched.zip   <- your already-patched imagick source (~570 KB)
#
# This is the exact file you already have locally. Using a vendored copy
# instead of re-cloning/re-patching from GitHub at runtime removes upstream
# repo changes and regex-patch drift as failure sources.
#
# The PHP SDK is NOT vendored (it's ~35 MB, over GitHub's 25 MB web-upload
# limit) -- it's downloaded fresh from github.com/php/php-sdk-binary-tools
# on every run instead, which has never failed in any prior run.

on:
  workflow_dispatch:
    inputs:
      build_ts:
        description: "Build Thread-Safe (TS) variant"
        type: boolean
        default: true
      build_nts:
        description: "Build Non-Thread-Safe (NTS) variant"
        type: boolean
        default: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  IMAGEMAGICK_VERSION: "7.1.1-47"

jobs:

  # ============================================================
  # BUILD THREAD SAFE
  # ============================================================

  build-ts:
    if: ${{ inputs.build_ts }}
    name: Build Imagick PHP 8.6 TS x64
    runs-on: windows-2025

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vendored imagick source is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = "vendor\imagick-php86-patched.zip"
          if (-not (Test-Path $f)) {
              throw "Missing required vendored file: $f -- upload it to the repo first (see comments at the top of this workflow)."
          }
          Write-Host "Found: $f"

      # --------------------------------------------------------
      # Downloads (PHP SDK from GitHub + PHP QA binary/devel pack +
      # ImageMagick deps from php.net). Retries + integrity checks
      # included since php.net QA downloads have been flaky.
      # --------------------------------------------------------

      - name: Download PHP 8.6 TS binary + devel pack + ImageMagick deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-FileWithRetry {
              param([string]$Url, [string]$OutFile, [int]$Retries = 5)

              for ($i = 1; $i -le $Retries; $i++) {
                  try {
                      Write-Host "[$i/$Retries] Downloading: $Url"
                      Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing -MaximumRedirection 10

                      if (-not (Test-Path $OutFile)) { throw "File was not written." }
                      $size = (Get-Item $OutFile).Length
                      if ($size -lt 10000) { throw "Downloaded file is suspiciously small ($size bytes) - likely an error page, not a real archive." }

                      # Confirm it is actually a valid zip before trusting it.
                      Add-Type -AssemblyName System.IO.Compression.FileSystem
                      $zip = [System.IO.Compression.ZipFile]::OpenRead($OutFile)
                      $zip.Dispose()

                      Write-Host "OK ($size bytes)."
                      return
                  }
                  catch {
                      Write-Host "Attempt $i failed: $($_.Exception.Message)"
                      if (Test-Path $OutFile) { Remove-Item $OutFile -Force }
                      if ($i -lt $Retries) { Start-Sleep -Seconds (5 * $i) }
                  }
              }
              throw "Failed to download a valid archive from $Url after $Retries attempts."
          }

          Get-FileWithRetry -Url "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-Win32-vs18-x64.zip" -OutFile "php-ts.zip"
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-Win32-vs18-x64.zip" -OutFile "php-devel.zip"
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip" -OutFile "imagemagick.zip"

      # --------------------------------------------------------
      # Download + extract PHP SDK from GitHub (reliable domain,
      # never failed in any prior run -- no need to vendor it)
      # --------------------------------------------------------

      - name: Download and extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 5; $i++) {
              try {
                  Write-Host "[$i/5] Downloading PHP SDK from GitHub..."
                  Invoke-WebRequest -Uri "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip" -OutFile "sdk.zip" -UseBasicParsing
                  break
              } catch {
                  Write-Host "Attempt $i failed: $($_.Exception.Message)"
                  if ($i -eq 5) { throw "Failed to download PHP SDK from GitHub after 5 attempts." }
                  Start-Sleep -Seconds (5 * $i)
              }
          }

          if (Test-Path "C:\php-sdk") { Remove-Item "C:\php-sdk" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\php-sdk-extract" -Force | Out-Null
          Expand-Archive -Path "sdk.zip" -DestinationPath "C:\php-sdk-extract" -Force

          $root = Get-ChildItem -Path "C:\php-sdk-extract" -Directory | Select-Object -First 1
          if (-not $root) { throw "PHP SDK archive root was not found." }
          Move-Item -Path $root.FullName -Destination "C:\php-sdk" -Force

          $starter = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "phpsdk-vs18-x64.bat" | Select-Object -First 1
          if (-not $starter) { throw "phpsdk-vs18-x64.bat not found in downloaded SDK." }

          $bison = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "bison.exe" | Select-Object -First 1
          if (-not $bison) { throw "bison.exe not found in downloaded SDK." }

          Write-Host "SDK starter: $($starter.FullName)"
          Write-Host "bison.exe:   $($bison.FullName)"

      # --------------------------------------------------------
      # Extract vendored, already-patched imagick source
      # --------------------------------------------------------

      - name: Extract imagick source (vendored, pre-patched) - TS copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\imagick-ts") { Remove-Item "C:\imagick-ts" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\imagick-ts-raw" -Force | Out-Null

          Expand-Archive -Path "vendor\imagick-php86-patched.zip" -DestinationPath "C:\imagick-ts-raw" -Force

          $configw32 = Get-ChildItem -Path "C:\imagick-ts-raw" -Recurse -Filter "config.w32" | Select-Object -First 1
          if (-not $configw32) { throw "config.w32 not found inside vendored imagick source zip." }

          Move-Item -Path $configw32.Directory.FullName -Destination "C:\imagick-ts" -Force

          Write-Host "imagick source root: C:\imagick-ts"

      - name: Verify PHP 8.6 compatibility patch is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "C:\imagick-ts\imagick_class.c"
          if (-not (Test-Path $source)) { throw "imagick_class.c not found." }

          $text = Get-Content -Path $source -Raw

          if ($text.Contains('zend_is_callable(user_callback, 0, NULL TSRMLS_CC)')) {
              throw "The OLD zend_is_callable() call is still present - this build will fail to link against PHP 8.6's php8ts.dll. The vendored zip is not actually patched."
          }

          if (-not $text.Contains('zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)')) {
              throw "The PHP 8.6 compatibility patch (zend_is_callable_ex) was not found. The vendored zip is not actually patched."
          }

          Write-Host "PHP 8.6 compatibility patch confirmed present."

      # --------------------------------------------------------
      # Extract PHP binary + devel pack
      # --------------------------------------------------------

      - name: Extract PHP TS binary + devel pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin")   { Remove-Item "C:\php-bin" -Recurse -Force }
          if (Test-Path "C:\php-devel") { Remove-Item "C:\php-devel" -Recurse -Force }

          New-Item -ItemType Directory -Path "C:\php-bin" -Force | Out-Null
          Expand-Archive -Path "php-ts.zip" -DestinationPath "C:\php-bin" -Force

          $php = "C:\php-bin\php.exe"
          if (-not (Test-Path $php)) { throw "php.exe not found after extracting PHP TS binary." }
          & $php -v

          New-Item -ItemType Directory -Path "C:\php-devel-extract" -Force | Out-Null
          Expand-Archive -Path "php-devel.zip" -DestinationPath "C:\php-devel-extract" -Force

          $phpize = Get-ChildItem -Path "C:\php-devel-extract" -Recurse -Filter "phpize.bat" | Select-Object -First 1
          if (-not $phpize) { throw "phpize.bat not found in the downloaded PHP devel pack." }

          Move-Item -Path $phpize.Directory.FullName -Destination "C:\php-devel" -Force

          Write-Host "PHP devel pack root: C:\php-devel"
          if (-not (Test-Path "C:\php-devel\include\main\php.h")) {
              throw "C:\php-devel\include\main\php.h missing - this devel pack is not laid out as expected."
          }
          Write-Host "PHP core headers confirmed at C:\php-devel\include\main\php.h"

      # --------------------------------------------------------
      # Prepare ImageMagick dev tree - THE ACTUAL FIX IS HERE
      # --------------------------------------------------------

      - name: Prepare ImageMagick development files (fixed layout)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw   = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw)   { Remove-Item $raw -Recurse -Force }
          if (Test-Path $final) { Remove-Item $final -Recurse -Force }

          New-Item -ItemType Directory -Path $raw -Force | Out-Null
          New-Item -ItemType Directory -Path $final -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\bin" -Force | Out-Null

          Expand-Archive -Path "imagemagick.zip" -DestinationPath $raw -Force

          $header = Get-ChildItem -Path $raw -Recurse -Filter "MagickWand.h" |
              Where-Object { $_.FullName -match "\\MagickWand\\MagickWand\.h$" } |
              Select-Object -First 1

          if (-not $header) {
              Write-Host "ImageMagick archive structure:"
              Get-ChildItem -Path $raw -Recurse -File | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
              throw "MagickWand.h was not found anywhere in the ImageMagick archive."
          }

          # The folder that DIRECTLY contains MagickWand\, MagickCore\, wand\, etc.
          $includeRoot = $header.Directory.Parent.FullName
          Write-Host "ImageMagick include root in archive: $includeRoot"

          # THE FIX: copy directly into C:\ImageMagick (no extra
          # "include\imagemagick" nesting). imagick's config.w32 looks for
          # "<--with-imagick path>\MagickWand\MagickWand.h" literally.
          Copy-Item -Path "$includeRoot\*" -Destination $final -Recurse -Force

          # THE FIX: libs go directly under C:\ImageMagick\lib (flat).
          # config.w32's CHECK_LIB automatically also probes a "lib"
          # subfolder of whatever path you pass to --with-imagick.
          Get-ChildItem -Path $raw -Recurse -Filter "*.lib" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\lib" -Force
          }

          # Runtime DLLs, needed later for php.exe -d extension=... testing
          # and for the final artifact. Irrelevant to configure/nmake.
          Get-ChildItem -Path $raw -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\bin" -Force
          }

          $finalHeader = "$final\MagickWand\MagickWand.h"
          $finalWand   = "$final\lib\CORE_RL_MagickWand_.lib"
          $finalCore   = "$final\lib\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) { throw "Final MagickWand.h is missing at $finalHeader" }
          if (-not (Test-Path $finalWand))   { throw "Final MagickWand import library is missing at $finalWand" }
          if (-not (Test-Path $finalCore))   { throw "Final MagickCore import library is missing at $finalCore" }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ImageMagick dev tree ready (fixed layout)"
          Write-Host "========================================"
          Write-Host "Header : $finalHeader"
          Write-Host "Lib    : $finalWand"
          Write-Host "Lib    : $finalCore"

      # --------------------------------------------------------
      # Build task
      # --------------------------------------------------------

      - name: Create TS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-ts"

          echo ========================================
          echo PHP 8.6 TS x64 / Imagick
          echo ========================================
          echo PHP_DEV:      %PHP_DEV%
          echo IMAGEMAGICK:  %IMAGEMAGICK%
          echo SOURCE:       %SOURCE%

          where cl    >nul || (echo ERROR: cl.exe not found & exit /b 1)
          where link  >nul || (echo ERROR: link.exe not found & exit /b 1)
          where nmake >nul || (echo ERROR: nmake.exe not found & exit /b 1)

          if not exist "%PHP_DEV%\phpize.bat" (echo ERROR: phpize.bat missing & exit /b 1)
          if not exist "%PHP_DEV%\include\main\php.h" (echo ERROR: PHP headers missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\MagickWand\MagickWand.h" (echo ERROR: ImageMagick header missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib" (echo ERROR: ImageMagick lib missing & exit /b 1)

          cd /d "%SOURCE%"
          if errorlevel 1 (echo ERROR: cannot cd into source & exit /b 1)

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================
          call "%PHP_DEV%\phpize.bat"
          if errorlevel 1 (echo PHPIZE FAILED & exit /b 1)

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================
          REM Do NOT append "=shared" (phpize forces shared automatically).
          REM Do NOT pass "--with-imagick-dir" (not a real option, silently
          REM ignored, and gives you a false sense that the path was used).
          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%" > configure-output.log 2>&1
          set "CONFIGURE_EXIT=%ERRORLEVEL%"
          type configure-output.log

          if not "%CONFIGURE_EXIT%"=="0" (
              echo.
              echo ========================================
              echo CONFIGURE FAILED
              echo ========================================
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK WAS ACTUALLY ENABLED
          echo ========================================
          REM config.w32 prints "Enabling extension <module-dir> [shared]"
          REM where <module-dir> is the CURRENT DIRECTORY PATH (e.g.
          REM "C:\imagick-ts"), not the literal word "imagick" -- so we
          REM can't match on that literal string. The "Enabled extensions"
          REM summary table it prints right after DOES use the real
          REM extension name though, e.g. "| imagick   | shared |". Check
          REM for a line containing both "imagick" and "shared" (the
          REM WARNING/failure message contains "imagick" but never
          REM "shared", so this correctly tells success from failure).
          findstr /C:"imagick" configure-output.log | findstr /C:"shared" >nul
          if errorlevel 1 (
              echo.
              echo ERROR: config.w32 did NOT enable imagick.
              echo This means MagickWand.h or CORE_RL_MagickWand_.lib were
              echo not found at the expected path. Expected:
              echo   %IMAGEMAGICK%\MagickWand\MagickWand.h
              echo   %IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib
              echo.
              if exist config.log type config.log
              exit /b 1
          )
          echo Confirmed: imagick was enabled by configure.

          if not exist Makefile (echo ERROR: Makefile was not generated & exit /b 1)

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================
          nmake /nologo > nmake-ts.log 2>&1
          set "NMAKE_EXIT=%ERRORLEVEL%"
          type nmake-ts.log

          if not "%NMAKE_EXIT%"=="0" (
              echo.
              echo NMAKE FAILED
              exit /b %NMAKE_EXIT%
          )

          echo.
          echo ========================================
          echo SEARCHING GENERATED DLL
          echo ========================================
          REM NOTE: "for /r DIR in (literal_name.dll) do" is a classic
          REM cmd.exe trap -- without a wildcard it does NOT check the
          REM file actually exists; it just fires on the FIRST directory
          REM visited (the root itself) with a fabricated, non-existent
          REM path, so the real nested build output is never reached.
          REM "dir /s /b" performs a real filesystem search instead.
          set "FOUND_DLL="
          for /f "delims=" %%F in ('dir /s /b /a-d "%SOURCE%\php_imagick.dll" 2^>nul') do (
              set "FOUND_DLL=%%F"
              goto :dll_found
          )
          :dll_found

          if not defined FOUND_DLL (
              echo ERROR: php_imagick.dll was not produced despite imagick being enabled.
              echo DLL / OBJ / LIB found under source tree:
              dir /s /b *.dll *.obj *.lib 2>nul
              exit /b 1
          )

          echo Found: !FOUND_DLL!
          if /I not "!FOUND_DLL!"=="%SOURCE%\php_imagick.dll" (
              copy /y "!FOUND_DLL!" "%SOURCE%\php_imagick.dll" >nul
          )

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: final TS DLL missing after copy
              exit /b 1
          )

          echo.
          echo TS DLL READY: %SOURCE%\php_imagick.dll
          endlocal
          exit /b 0
          '@

          Set-Content -Path "C:\build-imagick-ts.bat" -Value $build -Encoding ASCII
          Write-Host "TS build task created."

      - name: Build Imagick TS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-ts.bat
          if errorlevel 1 exit /b 1

      # --------------------------------------------------------
      # Validate, load-test, package
      # --------------------------------------------------------

      - name: Validate + load-test TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-ts\php_imagick.dll"
          if (-not (Test-Path $dll)) {
              Write-Host "Searching inside C:\imagick-ts only (not the whole C: drive):"
              Get-ChildItem -Path "C:\imagick-ts" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
              throw "TS php_imagick.dll was not produced."
          }

          Get-Item $dll | Format-List FullName, Length, LastWriteTime

          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              $dest = Join-Path "C:\php-bin" $_.Name
              if ([System.IO.Path]::GetFullPath($_.FullName) -ne [System.IO.Path]::GetFullPath($dest)) {
                  Copy-Item -Path $_.FullName -Destination $dest -Force
              }
          }
          Copy-Item -Path $dll -Destination "C:\php-bin\php_imagick.dll" -Force

          & "C:\php-bin\php.exe" -n -d "extension=C:\php-bin\php_imagick.dll" -r "echo 'PHP=',PHP_VERSION,PHP_EOL; echo 'ZTS=',(PHP_ZTS?'yes':'no'),PHP_EOL; echo 'Imagick=',(extension_loaded('imagick')?'OK':'FAILED'),PHP_EOL; echo 'ImageMagick=',Imagick::getVersion()['versionString'],PHP_EOL;"

          if ($LASTEXITCODE -ne 0) { throw "PHP TS failed to load php_imagick.dll." }
          Write-Host "TS VALIDATION SUCCESS."

      - name: Package TS artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "C:\artifact-ts" -Force | Out-Null
          Copy-Item -Path "C:\imagick-ts\php_imagick.dll" -Destination "C:\artifact-ts\php_imagick.dll" -Force
          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "C:\artifact-ts" -Force
          }
          Compress-Archive -Path "C:\artifact-ts\*" -DestinationPath "imagick-php8.6-vs18-x64-ts.zip" -Force

      - name: Upload TS artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagick-php8.6-vs18-x64-ts
          path: imagick-php8.6-vs18-x64-ts.zip
          if-no-files-found: error


  # ============================================================
  # BUILD NON-THREAD SAFE
  # ============================================================

  build-nts:
    if: ${{ inputs.build_nts }}
    name: Build Imagick PHP 8.6 NTS x64
    runs-on: windows-2025

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vendored imagick source is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = "vendor\imagick-php86-patched.zip"
          if (-not (Test-Path $f)) {
              throw "Missing required vendored file: $f -- upload it to the repo first (see comments at the top of this workflow)."
          }
          Write-Host "Found: $f"

      - name: Download PHP 8.6 NTS binary + devel pack + ImageMagick deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-FileWithRetry {
              param([string]$Url, [string]$OutFile, [int]$Retries = 5)

              for ($i = 1; $i -le $Retries; $i++) {
                  try {
                      Write-Host "[$i/$Retries] Downloading: $Url"
                      Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing -MaximumRedirection 10

                      if (-not (Test-Path $OutFile)) { throw "File was not written." }
                      $size = (Get-Item $OutFile).Length
                      if ($size -lt 10000) { throw "Downloaded file is suspiciously small ($size bytes) - likely an error page, not a real archive." }

                      Add-Type -AssemblyName System.IO.Compression.FileSystem
                      $zip = [System.IO.Compression.ZipFile]::OpenRead($OutFile)
                      $zip.Dispose()

                      Write-Host "OK ($size bytes)."
                      return
                  }
                  catch {
                      Write-Host "Attempt $i failed: $($_.Exception.Message)"
                      if (Test-Path $OutFile) { Remove-Item $OutFile -Force }
                      if ($i -lt $Retries) { Start-Sleep -Seconds (5 * $i) }
                  }
              }
              throw "Failed to download a valid archive from $Url after $Retries attempts."
          }

          Get-FileWithRetry -Url "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-nts-Win32-vs18-x64.zip" -OutFile "php-nts.zip"
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-nts-Win32-vs18-x64.zip" -OutFile "php-devel-nts.zip"
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip" -OutFile "imagemagick.zip"

      - name: Download and extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 5; $i++) {
              try {
                  Write-Host "[$i/5] Downloading PHP SDK from GitHub..."
                  Invoke-WebRequest -Uri "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip" -OutFile "sdk.zip" -UseBasicParsing
                  break
              } catch {
                  Write-Host "Attempt $i failed: $($_.Exception.Message)"
                  if ($i -eq 5) { throw "Failed to download PHP SDK from GitHub after 5 attempts." }
                  Start-Sleep -Seconds (5 * $i)
              }
          }

          if (Test-Path "C:\php-sdk") { Remove-Item "C:\php-sdk" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\php-sdk-extract" -Force | Out-Null
          Expand-Archive -Path "sdk.zip" -DestinationPath "C:\php-sdk-extract" -Force

          $root = Get-ChildItem -Path "C:\php-sdk-extract" -Directory | Select-Object -First 1
          if (-not $root) { throw "PHP SDK archive root was not found." }
          Move-Item -Path $root.FullName -Destination "C:\php-sdk" -Force

          $starter = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "phpsdk-vs18-x64.bat" | Select-Object -First 1
          if (-not $starter) { throw "phpsdk-vs18-x64.bat not found in downloaded SDK." }

          $bison = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "bison.exe" | Select-Object -First 1
          if (-not $bison) { throw "bison.exe not found in downloaded SDK." }

      - name: Extract imagick source (vendored, pre-patched) - NTS copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\imagick-nts") { Remove-Item "C:\imagick-nts" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\imagick-nts-raw" -Force | Out-Null

          Expand-Archive -Path "vendor\imagick-php86-patched.zip" -DestinationPath "C:\imagick-nts-raw" -Force

          $configw32 = Get-ChildItem -Path "C:\imagick-nts-raw" -Recurse -Filter "config.w32" | Select-Object -First 1
          if (-not $configw32) { throw "config.w32 not found inside vendored imagick source zip." }

          Move-Item -Path $configw32.Directory.FullName -Destination "C:\imagick-nts" -Force

      - name: Verify PHP 8.6 compatibility patch is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "C:\imagick-nts\imagick_class.c"
          if (-not (Test-Path $source)) { throw "imagick_class.c not found." }

          $text = Get-Content -Path $source -Raw

          if ($text.Contains('zend_is_callable(user_callback, 0, NULL TSRMLS_CC)')) {
              throw "The OLD zend_is_callable() call is still present - the vendored zip is not actually patched."
          }
          if (-not $text.Contains('zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)')) {
              throw "The PHP 8.6 compatibility patch (zend_is_callable_ex) was not found."
          }

          Write-Host "PHP 8.6 compatibility patch confirmed present."

      - name: Extract PHP NTS binary + devel pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin")   { Remove-Item "C:\php-bin" -Recurse -Force }
          if (Test-Path "C:\php-devel") { Remove-Item "C:\php-devel" -Recurse -Force }

          New-Item -ItemType Directory -Path "C:\php-bin" -Force | Out-Null
          Expand-Archive -Path "php-nts.zip" -DestinationPath "C:\php-bin" -Force

          $php = "C:\php-bin\php.exe"
          if (-not (Test-Path $php)) { throw "php.exe not found after extracting PHP NTS binary." }
          & $php -v

          New-Item -ItemType Directory -Path "C:\php-devel-extract" -Force | Out-Null
          Expand-Archive -Path "php-devel-nts.zip" -DestinationPath "C:\php-devel-extract" -Force

          $phpize = Get-ChildItem -Path "C:\php-devel-extract" -Recurse -Filter "phpize.bat" | Select-Object -First 1
          if (-not $phpize) { throw "phpize.bat not found in the downloaded PHP NTS devel pack." }

          Move-Item -Path $phpize.Directory.FullName -Destination "C:\php-devel" -Force

          if (-not (Test-Path "C:\php-devel\include\main\php.h")) {
              throw "C:\php-devel\include\main\php.h missing - this devel pack is not laid out as expected."
          }

      - name: Prepare ImageMagick development files (fixed layout)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw   = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw)   { Remove-Item $raw -Recurse -Force }
          if (Test-Path $final) { Remove-Item $final -Recurse -Force }

          New-Item -ItemType Directory -Path $raw -Force | Out-Null
          New-Item -ItemType Directory -Path $final -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\bin" -Force | Out-Null

          Expand-Archive -Path "imagemagick.zip" -DestinationPath $raw -Force

          $header = Get-ChildItem -Path $raw -Recurse -Filter "MagickWand.h" |
              Where-Object { $_.FullName -match "\\MagickWand\\MagickWand\.h$" } |
              Select-Object -First 1

          if (-not $header) {
              Get-ChildItem -Path $raw -Recurse -File | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
              throw "MagickWand.h was not found anywhere in the ImageMagick archive."
          }

          $includeRoot = $header.Directory.Parent.FullName

          Copy-Item -Path "$includeRoot\*" -Destination $final -Recurse -Force

          Get-ChildItem -Path $raw -Recurse -Filter "*.lib" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\lib" -Force
          }

          Get-ChildItem -Path $raw -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\bin" -Force
          }

          if (-not (Test-Path "$final\MagickWand\MagickWand.h")) { throw "Final MagickWand.h is missing." }
          if (-not (Test-Path "$final\lib\CORE_RL_MagickWand_.lib")) { throw "Final MagickWand import library is missing." }
          if (-not (Test-Path "$final\lib\CORE_RL_MagickCore_.lib")) { throw "Final MagickCore import library is missing." }

          Write-Host "ImageMagick dev tree ready (fixed layout)."

      - name: Create NTS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-nts"

          echo ========================================
          echo PHP 8.6 NTS x64 / Imagick
          echo ========================================

          where cl    >nul || (echo ERROR: cl.exe not found & exit /b 1)
          where link  >nul || (echo ERROR: link.exe not found & exit /b 1)
          where nmake >nul || (echo ERROR: nmake.exe not found & exit /b 1)

          if not exist "%PHP_DEV%\phpize.bat" (echo ERROR: phpize.bat missing & exit /b 1)
          if not exist "%PHP_DEV%\include\main\php.h" (echo ERROR: PHP headers missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\MagickWand\MagickWand.h" (echo ERROR: ImageMagick header missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib" (echo ERROR: ImageMagick lib missing & exit /b 1)

          cd /d "%SOURCE%"
          if errorlevel 1 (echo ERROR: cannot cd into source & exit /b 1)

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================
          call "%PHP_DEV%\phpize.bat"
          if errorlevel 1 (echo PHPIZE FAILED & exit /b 1)

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================
          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%" --disable-zts > configure-output.log 2>&1
          set "CONFIGURE_EXIT=%ERRORLEVEL%"
          type configure-output.log

          if not "%CONFIGURE_EXIT%"=="0" (
              echo CONFIGURE FAILED
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK WAS ACTUALLY ENABLED
          echo ========================================
          REM config.w32 prints "Enabling extension <module-dir> [shared]"
          REM where <module-dir> is the current directory path, not the
          REM literal word "imagick" -- match on the "Enabled extensions"
          REM summary table instead (a line containing both "imagick" and
          REM "shared"; the failure/WARNING message never contains "shared").
          findstr /C:"imagick" configure-output.log | findstr /C:"shared" >nul
          if errorlevel 1 (
              echo ERROR: config.w32 did NOT enable imagick.
              echo Expected:
              echo   %IMAGEMAGICK%\MagickWand\MagickWand.h
              echo   %IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib
              if exist config.log type config.log
              exit /b 1
          )
          echo Confirmed: imagick was enabled by configure.

          if not exist Makefile (echo ERROR: Makefile was not generated & exit /b 1)

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================
          nmake /nologo > nmake-nts.log 2>&1
          set "NMAKE_EXIT=%ERRORLEVEL%"
          type nmake-nts.log

          if not "%NMAKE_EXIT%"=="0" (
              echo NMAKE FAILED
              exit /b %NMAKE_EXIT%
          )

          echo.
          echo ========================================
          echo SEARCHING GENERATED DLL
          echo ========================================
          REM NOTE: "for /r DIR in (literal_name.dll) do" is a classic
          REM cmd.exe trap -- without a wildcard it does NOT check the
          REM file actually exists; it just fires on the FIRST directory
          REM visited (the root itself) with a fabricated, non-existent
          REM path, so the real nested build output is never reached.
          REM "dir /s /b" performs a real filesystem search instead.
          set "FOUND_DLL="
          for /f "delims=" %%F in ('dir /s /b /a-d "%SOURCE%\php_imagick.dll" 2^>nul') do (
              set "FOUND_DLL=%%F"
              goto :dll_found
          )
          :dll_found

          if not defined FOUND_DLL (
              echo ERROR: php_imagick.dll was not produced despite imagick being enabled.
              dir /s /b *.dll *.obj *.lib 2>nul
              exit /b 1
          )

          echo Found: !FOUND_DLL!
          if /I not "!FOUND_DLL!"=="%SOURCE%\php_imagick.dll" (
              copy /y "!FOUND_DLL!" "%SOURCE%\php_imagick.dll" >nul
          )

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: final NTS DLL missing after copy
              exit /b 1
          )

          echo.
          echo NTS DLL READY: %SOURCE%\php_imagick.dll
          endlocal
          exit /b 0
          '@

          Set-Content -Path "C:\build-imagick-nts.bat" -Value $build -Encoding ASCII

      - name: Build Imagick NTS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-nts.bat
          if errorlevel 1 exit /b 1

      - name: Validate + load-test NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-nts\php_imagick.dll"
          if (-not (Test-Path $dll)) {
              Write-Host "Searching inside C:\imagick-nts only:"
              Get-ChildItem -Path "C:\imagick-nts" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
              throw "NTS php_imagick.dll was not produced."
          }

          Get-Item $dll | Format-List FullName, Length, LastWriteTime

          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              $dest = Join-Path "C:\php-bin" $_.Name
              if ([System.IO.Path]::GetFullPath($_.FullName) -ne [System.IO.Path]::GetFullPath($dest)) {
                  Copy-Item -Path $_.FullName -Destination $dest -Force
              }
          }
          Copy-Item -Path $dll -Destination "C:\php-bin\php_imagick.dll" -Force

          & "C:\php-bin\php.exe" -n -d "extension=C:\php-bin\php_imagick.dll" -r "echo 'PHP=',PHP_VERSION,PHP_EOL; echo 'ZTS=',(PHP_ZTS?'yes':'no'),PHP_EOL; echo 'Imagick=',(extension_loaded('imagick')?'OK':'FAILED'),PHP_EOL; echo 'ImageMagick=',Imagick::getVersion()['versionString'],PHP_EOL;"

          if ($LASTEXITCODE -ne 0) { throw "PHP NTS failed to load php_imagick.dll." }
          Write-Host "NTS VALIDATION SUCCESS."

      - name: Package NTS artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "C:\artifact-nts" -Force | Out-Null
          Copy-Item -Path "C:\imagick-nts\php_imagick.dll" -Destination "C:\artifact-nts\php_imagick.dll" -Force
          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "C:\artifact-nts" -Force
          }
          Compress-Archive -Path "C:\artifact-nts\*" -DestinationPath "imagick-php8.6-vs18-x64-nts.zip" -Force

      - name: Upload NTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagick-php8.6-vs18-x64-nts
          path: imagick-php8.6-vs18-x64-nts.zip
          if-no-files-found: error
