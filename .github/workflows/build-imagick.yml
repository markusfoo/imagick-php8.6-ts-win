name: Build imagick.dll for PHP 8.6.0beta1 (x64, TS/NTS)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false

      matrix:
        include:
          - ts: ts
            bin_suffix: ""

          - ts: nts
            bin_suffix: "-nts"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Imagick 3.8.1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/3.8.1.zip"

          Write-Host "Downloading Imagick 3.8.1:"
          Write-Host $url

          $maxRetries = 5

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "imagick.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 120 `
                    -ErrorAction Stop

                  break
              }
              catch {
                  Write-Host "Download attempt $attempt failed: $($_.Exception.Message)"

                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

          if (-not (Test-Path "imagick.zip")) {
              throw "Imagick source archive was not downloaded."
          }

          if (Test-Path "C:\imagick-src") {
              Remove-Item "C:\imagick-src" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\imagick-src" `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath "C:\imagick-extracted" `
            -Force

          $sourceRoot = Get-ChildItem `
            "C:\imagick-extracted" `
            -Directory |
            Select-Object -First 1

          if (-not $sourceRoot) {
              throw "Imagick source directory was not found after extraction."
          }

          Copy-Item `
            -Path "$($sourceRoot.FullName)\*" `
            -Destination "C:\imagick-src" `
            -Recurse `
            -Force

          if (-not (Test-Path "C:\imagick-src\config.w32")) {
              throw "Imagick 3.8.1 config.w32 was not found."
          }

          if (-not (Test-Path "C:\imagick-src\imagick_class.c")) {
              throw "Imagick 3.8.1 imagick_class.c was not found."
          }

          Write-Host ""
          Write-Host "Imagick source:"
          Write-Host $sourceRoot.FullName
          Write-Host "Imagick 3.8.1 source prepared successfully."

      - name: Apply PHP 8.6 compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\imagick-src\imagick_class.c"

          if (-not (Test-Path $file)) {
              throw "imagick_class.c not found."
          }

          $content = Get-Content $file -Raw

          $old = 'zend_is_callable(user_callback, 0, NULL TSRMLS_CC)'
          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          $oldCount = ([regex]::Matches(
              $content,
              [regex]::Escape($old)
          )).Count

          $newCount = ([regex]::Matches(
              $content,
              [regex]::Escape($new)
          )).Count

          Write-Host "Old call count: $oldCount"
          Write-Host "New call count: $newCount"

          if ($oldCount -eq 1) {

              $content = $content.Replace($old, $new)

              Set-Content `
                -Path $file `
                -Value $content `
                -NoNewline `
                -Encoding UTF8

              Write-Host ""
              Write-Host "PHP 8.6 compatibility patch applied."

          }
          elseif ($oldCount -eq 0 -and $newCount -eq 1) {

              Write-Host ""
              Write-Host "PHP 8.6 compatibility patch is already present."

          }
          else {

              throw "Unexpected zend_is_callable() state. Refusing to continue."
          }

          $verify = Get-Content $file -Raw

          if ($verify.Contains($old)) {
              throw "ERROR: Old zend_is_callable() call is still present."
          }

          if (-not $verify.Contains($new)) {
              throw "ERROR: New zend_is_callable_ex() call was not found."
          }

          Write-Host ""
          Write-Host "Verified exact PHP 8.6 patch:"
          Write-Host $new

      - name: Download PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-8.6.0beta1${{ matrix.bin_suffix }}-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP binary:"
          Write-Host $url

          $maxRetries = 5

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "php-bin.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 180 `
                    -ErrorAction Stop

                  break
              }
              catch {
                  Write-Host "Download attempt $attempt failed: $($_.Exception.Message)"

                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

          if (-not (Test-Path "php-bin.zip")) {
              throw "PHP binary was not downloaded."
          }

      - name: Download PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-8.6.0beta1-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP development pack:"
          Write-Host $url

          $maxRetries = 5

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "php-devel.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 180 `
                    -ErrorAction Stop

                  break
              }
              catch {
                  Write-Host "Download attempt $attempt failed: $($_.Exception.Message)"

                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

          if (-not (Test-Path "php-devel.zip")) {
              throw "PHP development pack was not downloaded."
          }

      - name: Download ImageMagick dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-7.1.1-47-vs17-x64.zip"

          Write-Host "Downloading ImageMagick dependencies:"
          Write-Host $url

          $maxRetries = 5

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "im.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 180 `
                    -ErrorAction Stop

                  break
              }
              catch {
                  Write-Host "Download attempt $attempt failed: $($_.Exception.Message)"

                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

          if (-not (Test-Path "im.zip")) {
              throw "ImageMagick dependency archive was not downloaded."
          }

      - name: Download PHP SDK 2.8.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-2.8.3.zip"

          Write-Host "Downloading PHP SDK 2.8.3:"
          Write-Host $url

          $maxRetries = 8

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "sdk.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 180 `
                    -ErrorAction Stop

                  break
              }
              catch {
                  Write-Host "SDK download attempt $attempt failed: $($_.Exception.Message)"

                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Start-Sleep -Seconds (10 * $attempt)
              }
          }

          if (-not (Test-Path "sdk.zip")) {
              throw "PHP SDK 2.8.3 was not downloaded."
          }

      - name: Extract PHP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin") {
              Remove-Item "C:\php-bin" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-bin" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-bin.zip" `
            -DestinationPath "C:\php-bin" `
            -Force

          Write-Host "PHP extracted."

      - name: Extract PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel") {
              Remove-Item "C:\php-devel" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath "C:\php-devel" `
            -Force

          Write-Host "PHP development pack extracted."

          $phpdevDir = Get-ChildItem `
            "C:\php-devel" `
            -Directory |
            Select-Object -First 1

          if (-not $phpdevDir) {
              throw "PHP development directory was not found."
          }

          Write-Host "PHP development directory:"
          Write-Host $phpdevDir.FullName

      - name: Extract ImageMagick with normalized layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tempRoot = "C:\ImageMagick-extracted"
          $finalRoot = "C:\ImageMagick"

          if (Test-Path $tempRoot) {
              Remove-Item $tempRoot -Recurse -Force
          }

          if (Test-Path $finalRoot) {
              Remove-Item $finalRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $tempRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath $tempRoot `
            -Force

          Write-Host ""
          Write-Host "Searching ImageMagick package structure..."

          $header = Get-ChildItem `
            -Path $tempRoot `
            -Recurse `
            -Filter "MagickWand.h" |
            Where-Object {
                $_.FullName -match "\\include\\imagemagick\\MagickWand\\MagickWand\.h$"
            } |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found in the expected ImageMagick package structure."
          }

          Write-Host "Found header:"
          Write-Host $header.FullName

          $imageMagickRoot = $header.Directory.Parent.Parent.Parent.Parent.FullName

          Write-Host ""
          Write-Host "Detected ImageMagick root:"
          Write-Host $imageMagickRoot

          $expectedHeader = Join-Path `
            $imageMagickRoot `
            "include\imagemagick\MagickWand\MagickWand.h"

          $expectedWandLib = Join-Path `
            $imageMagickRoot `
            "lib\imagemagick\CORE_RL_MagickWand_.lib"

          $expectedCoreLib = Join-Path `
            $imageMagickRoot `
            "lib\imagemagick\CORE_RL_MagickCore_.lib"

          Write-Host ""
          Write-Host "Checking exact files..."
          Write-Host $expectedHeader
          Write-Host $expectedWandLib
          Write-Host $expectedCoreLib

          if (-not (Test-Path $expectedHeader)) {
              throw "ImageMagick header not found."
          }

          if (-not (Test-Path $expectedWandLib)) {
              throw "ImageMagick MagickWand import library not found."
          }

          if (-not (Test-Path $expectedCoreLib)) {
              throw "ImageMagick MagickCore import library not found."
          }

          New-Item `
            -ItemType Directory `
            -Path $finalRoot `
            -Force | Out-Null

          Copy-Item `
            -Path "$imageMagickRoot\*" `
            -Destination $finalRoot `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Final ImageMagick layout:"
          Write-Host "$finalRoot\include\imagemagick\MagickWand\MagickWand.h"
          Write-Host "$finalRoot\lib\imagemagick\CORE_RL_MagickWand_.lib"
          Write-Host "$finalRoot\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path "$finalRoot\include\imagemagick\MagickWand\MagickWand.h")) {
              throw "Normalized ImageMagick header path is invalid."
          }

          if (-not (Test-Path "$finalRoot\lib\imagemagick\CORE_RL_MagickWand_.lib")) {
              throw "Normalized ImageMagick MagickWand library path is invalid."
          }

          if (-not (Test-Path "$finalRoot\lib\imagemagick\CORE_RL_MagickCore_.lib")) {
              throw "Normalized ImageMagick MagickCore library path is invalid."
          }

          Write-Host ""
          Write-Host "ImageMagick dependency layout is READY."

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = "C:\php-sdk"

          if (Test-Path $sdkRoot) {
              Remove-Item $sdkRoot -Recurse -Force
          }

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath "C:\" `
            -Force

          $extractedSdk = "C:\php-sdk-binary-tools-php-sdk-2.8.3"

          if (-not (Test-Path $extractedSdk)) {
              throw "PHP SDK 2.8.3 directory was not found."
          }

          Rename-Item `
            -Path $extractedSdk `
            -NewName "php-sdk"

          Write-Host "PHP SDK installed at C:\php-sdk"

      - name: Verify PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdk = "C:\php-sdk"

          $starter = "$sdk\phpsdk-vs18-x64.bat"
          $bison = "$sdk\msys2\usr\bin\bison.exe"
          $re2c = "$sdk\msys2\usr\bin\re2c.exe"

          Write-Host "Checking PHP SDK..."

          if (-not (Test-Path $starter)) {
              throw "phpsdk-vs18-x64.bat not found."
          }

          if (-not (Test-Path $bison)) {
              throw "bison.exe not found."
          }

          if (-not (Test-Path $re2c)) {
              throw "re2c.exe not found."
          }

          Write-Host ""
          Write-Host "PHP SDK starter:"
          Write-Host $starter

          Write-Host ""
          Write-Host "Bison:"
          & $bison --version

          if ($LASTEXITCODE -ne 0) {
              throw "Bison failed."
          }

          Write-Host ""
          Write-Host "re2c:"
          & $re2c --version

          if ($LASTEXITCODE -ne 0) {
              throw "re2c failed."
          }

          Write-Host ""
          Write-Host "PHP SDK 2.8.3 VS18 x64 is READY."

      - name: Prepare PHP development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $phpdevDir = Get-ChildItem `
            "C:\php-devel" `
            -Directory |
            Select-Object -First 1

          if (-not $phpdevDir) {
              throw "PHP development directory not found."
          }

          $phpdevPath = $phpdevDir.FullName

          Write-Host "PHP development directory:"
          Write-Host $phpdevPath

          $imagickDir = "$phpdevPath\ext\imagick"

          New-Item `
            -ItemType Directory `
            -Path $imagickDir `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Copying patched Imagick 3.8.1 source..."

          Copy-Item `
            -Path "C:\imagick-src\*" `
            -Destination $imagickDir `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Copying PHP executable..."

          Copy-Item `
            -Path "C:\php-bin\php.exe" `
            -Destination "$phpdevPath\php.exe" `
            -Force

          Write-Host ""
          Write-Host "Copying PHP runtime DLL files..."

          Copy-Item `
            -Path "C:\php-bin\*.dll" `
            -Destination $phpdevPath `
            -Force

          Write-Host ""
          Write-Host "PHP development environment prepared."

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PHP_DEV_PATH=$phpdevPath"

      - name: Verify patched Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:PHP_DEV_PATH\ext\imagick\imagick_class.c"

          if (-not (Test-Path $file)) {
              throw "Imagick source file was not copied."
          }

          $content = Get-Content $file -Raw

          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          if (-not $content.Contains($new)) {
              throw "PHP 8.6 compatibility patch is missing from the build source."
          }

          if ($content.Contains('zend_is_callable(user_callback, 0, NULL TSRMLS_CC)')) {
              throw "Old zend_is_callable() call is still present."
          }

          Write-Host "Verified patched Imagick source."

      - name: Create SDK build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildScript = @"
          @echo off
          setlocal

          echo ========================================
          echo PHP 8.6.0beta1 Imagick build
          echo VS18 x64
          echo ========================================

          echo PHP_DEV_PATH=%PHP_DEV_PATH%
          echo.

          echo ========================================
          echo Verify build tools
          echo ========================================

          where cl
          if errorlevel 1 (
              echo ERROR: Visual C++ compiler not found.
              exit /b 1
          )

          where link
          if errorlevel 1 (
              echo ERROR: linker not found.
              exit /b 1
          )

          where nmake
          if errorlevel 1 (
              echo ERROR: nmake not found.
              exit /b 1
          )

          where bison
          if errorlevel 1 (
              echo ERROR: bison not found.
              exit /b 1
          )

          where re2c
          if errorlevel 1 (
              echo ERROR: re2c not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHP version
          echo ========================================

          cd /d "%PHP_DEV_PATH%"

          php.exe -v
          if errorlevel 1 (
              echo ERROR: PHP executable failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Enter Imagick source
          echo ========================================

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          if not exist "config.w32" (
              echo ERROR: config.w32 not found.
              exit /b 1
          )

          if not exist "imagick_class.c" (
              echo ERROR: imagick_class.c not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Verify ImageMagick files
          echo ========================================

          if not exist "C:\ImageMagick\include\imagemagick\MagickWand\MagickWand.h" (
              echo ERROR: MagickWand.h not found.
              exit /b 1
          )

          if not exist "C:\ImageMagick\lib\imagemagick\CORE_RL_MagickWand_.lib" (
              echo ERROR: CORE_RL_MagickWand_.lib not found.
              exit /b 1
          )

          if not exist "C:\ImageMagick\lib\imagemagick\CORE_RL_MagickCore_.lib" (
              echo ERROR: CORE_RL_MagickCore_.lib not found.
              exit /b 1
          )

          echo ImageMagick development files found.

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call phpize.bat

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure
          echo ========================================

          call configure.bat --with-imagick=shared --with-imagick-dir=C:\ImageMagick

          if errorlevel 1 (
              echo ERROR: configure failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Verify configure enabled Imagick
          echo ========================================

          if not exist "Makefile" (
              echo ERROR: Makefile was not generated.
              exit /b 1
          )

          findstr /i /c:"imagick" Makefile

          if errorlevel 1 (
              echo ERROR: Makefile does not contain Imagick.
              echo Imagick was NOT enabled by configure.
              exit /b 1
          )

          echo.
          echo ========================================
          echo nmake php_imagick.dll
          echo ========================================

          nmake php_imagick.dll

          if errorlevel 1 (
              echo ERROR: nmake php_imagick.dll failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Search build output
          echo ========================================

          if exist "php_imagick.dll" (
              echo FOUND:
              dir "php_imagick.dll"
              exit /b 0
          )

          if exist "Release_TS\php_imagick.dll" (
              echo FOUND:
              dir "Release_TS\php_imagick.dll"
              exit /b 0
          )

          if exist "Release\php_imagick.dll" (
              echo FOUND:
              dir "Release\php_imagick.dll"
              exit /b 0
          )

          echo ERROR: php_imagick.dll was not produced.
          echo.

          echo Searching for all Imagick build artifacts:
          dir /s /b *.dll 2>nul
          dir /s /b *.obj 2>nul
          dir /s /b *.lib 2>nul

          exit /b 1

          endlocal
          "@

          $buildScriptPath = "C:\build-imagick.bat"

          Set-Content `
            -Path $buildScriptPath `
            -Value $buildScript `
            -Encoding ASCII

          Write-Host "Build script created:"
          Write-Host $buildScriptPath

      - name: Build Imagick with PHP SDK VS18
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick.bat

          if errorlevel 1 (
              echo ERROR: Imagick build failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Imagick build completed successfully
          echo ========================================

      - name: Collect built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "out" `
            -Force | Out-Null

          Write-Host "Searching for php_imagick.dll..."

          $searchRoots = @(
              "$env:PHP_DEV_PATH",
              "$env:PHP_DEV_PATH\ext\imagick"
          )

          $dll = $null

          foreach ($root in $searchRoots) {

              if (-not (Test-Path $root)) {
                  continue
              }

              $dll = Get-ChildItem `
                -Path $root `
                -Recurse `
                -Filter "php_imagick.dll" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($dll) {
                  break
              }
          }

          if (-not $dll) {
              Write-Host ""
              Write-Host "ERROR: php_imagick.dll was not produced."
              Write-Host ""
              Write-Host "Searching build artifacts..."

              Get-ChildItem `
                -Path $env:PHP_DEV_PATH `
                -Recurse `
                -Include "*.dll","*.obj","*.lib" `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "php_imagick.dll was not produced."
          }

          Write-Host ""
          Write-Host "FOUND php_imagick.dll:"
          Write-Host $dll.FullName

          Copy-Item `
            -Path $dll.FullName `
            -Destination "out\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "Copied to:"
          Write-Host "out\php_imagick.dll"

      - name: Verify built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "out\php_imagick.dll"

          if (-not (Test-Path $dll)) {
              throw "Output DLL does not exist."
          }

          $file = Get-Item $dll

          Write-Host "========================================"
          Write-Host "Built DLL"
          Write-Host "========================================"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 10000) {
              throw "DLL is suspiciously small."
          }

          Write-Host ""
          Write-Host "DLL verification passed."

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-3.8.1-8.6.0beta1-x64-${{ matrix.ts }}
          path: out\php_imagick.dll
          if-no-files-found: error
