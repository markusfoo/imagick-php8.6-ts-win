name: Build patched Imagick for PHP 8.6.0beta1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  IMAGICK_VERSION: "3.8.1"
  IMAGEMAGICK_VERSION: "7.1.1-47"
  PHP_SDK_VERSION: "2.7.1"

jobs:
  build:
    name: PHP 8.6.0beta1 / Imagick 3.8.1 / x64
    runs-on: windows-2025

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # DOWNLOAD PHP SOURCE
      # ============================================================

      - name: Download PHP source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-src.zip"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-src.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-src.zip")) {
              throw "PHP source archive was not downloaded."
          }

          Write-Host "PHP source downloaded."

      # ============================================================
      # DOWNLOAD IMAGICK
      # ============================================================

      - name: Download Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagick.zip" `
            -UseBasicParsing

          if (-not (Test-Path "imagick.zip")) {
              throw "Imagick archive was not downloaded."
          }

          Write-Host "Imagick source downloaded."

      # ============================================================
      # DOWNLOAD IMAGEMAGICK
      # ============================================================

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagemagick.zip" `
            -UseBasicParsing

          if (-not (Test-Path "imagemagick.zip")) {
              throw "ImageMagick archive was not downloaded."
          }

          Write-Host "ImageMagick downloaded."

      # ============================================================
      # DOWNLOAD PHP SDK
      # ============================================================

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-sdk.zip")) {
              throw "PHP SDK archive was not downloaded."
          }

          Write-Host "PHP SDK downloaded."

      # ============================================================
      # EXTRACT SDK
      # ============================================================

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-sdk-extract"
          $sdk = "C:\php-sdk"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $sdk) {
              Remove-Item $sdk -Recurse -Force
          }

          Expand-Archive `
            -Path "php-sdk.zip" `
            -DestinationPath $extract `
            -Force

          $root = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "PHP SDK root was not found."
          }

          Move-Item `
            -Path $root.FullName `
            -Destination $sdk `
            -Force

          $starter = Join-Path $sdk "phpsdk-vs18-x64.bat"

          if (-not (Test-Path $starter)) {
              Write-Host "PHP SDK contents:"
              Get-ChildItem $sdk -Recurse -Depth 2 |
                Select-Object FullName

              throw "phpsdk-vs18-x64.bat not found."
          }

          Write-Host "PHP SDK ready:"
          Write-Host $starter

      # ============================================================
      # PREPARE IMAGEMAGICK
      # ============================================================

      - name: Prepare ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          Expand-Archive `
            -Path "imagemagick.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          $wand = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $core = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h not found."
          }

          if (-not $wand) {
              throw "CORE_RL_MagickWand_.lib not found."
          }

          if (-not $core) {
              throw "CORE_RL_MagickCore_.lib not found."
          }

          Write-Host "Header:"
          Write-Host $header.FullName

          Write-Host "Wand library:"
          Write-Host $wand.FullName

          Write-Host "Core library:"
          Write-Host $core.FullName

          $includeSource = $header.Directory.Parent.FullName

          New-Item `
            -ItemType Directory `
            -Path "$final\include\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\lib\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\bin" `
            -Force | Out-Null

          Copy-Item `
            "$includeSource\*" `
            "$final\include\imagemagick" `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
                Copy-Item `
                  $_.FullName `
                  "$final\lib\imagemagick" `
                  -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
                Copy-Item `
                  $_.FullName `
                  "$final\bin" `
                  -Force
            }

          if (-not (Test-Path "$final\include\imagemagick\MagickWand\MagickWand.h")) {
              throw "Normalized MagickWand.h missing."
          }

          if (-not (Test-Path "$final\lib\imagemagick\CORE_RL_MagickWand_.lib")) {
              throw "Normalized MagickWand library missing."
          }

          if (-not (Test-Path "$final\lib\imagemagick\CORE_RL_MagickCore_.lib")) {
              throw "Normalized MagickCore library missing."
          }

          Write-Host ""
          Write-Host "ImageMagick READY."

      # ============================================================
      # EXTRACT PHP SOURCE
      # ============================================================

      - name: Prepare PHP source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-source"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          Expand-Archive `
            -Path "php-src.zip" `
            -DestinationPath $extract `
            -Force

          $phpRoot = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $phpRoot) {
              throw "PHP source root not found."
          }

          $buildRoot = "C:\php-build"

          if (Test-Path $buildRoot) {
              Remove-Item $buildRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force | Out-Null

          Copy-Item `
            $phpRoot.FullName `
            "$buildRoot\php-src-ts" `
            -Recurse `
            -Force

          Copy-Item `
            $phpRoot.FullName `
            "$buildRoot\php-src-nts" `
            -Recurse `
            -Force

          Write-Host "TS:"
          Write-Host "$buildRoot\php-src-ts"

          Write-Host "NTS:"
          Write-Host "$buildRoot\php-src-nts"

      # ============================================================
      # ADD IMAGICK
      # ============================================================

      - name: Add Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\imagick-source"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath $extract `
            -Force

          $root = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "Imagick root not found."
          }

          Copy-Item `
            "$($root.FullName)\*" `
            "C:\php-build\php-src-ts\ext\imagick" `
            -Recurse `
            -Force

          Copy-Item `
            "$($root.FullName)\*" `
            "C:\php-build\php-src-nts\ext\imagick" `
            -Recurse `
            -Force

          Write-Host "Imagick 3.8.1 installed."

      # ============================================================
      # THE ONLY SOURCE PATCH
      # ============================================================

      - name: Apply PHP 8.6 zend_is_callable patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $old = "zend_is_callable(user_callback, 0, NULL TSRMLS_CC)"
          $new = "zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)"

          $files = @(
            "C:\php-build\php-src-ts\ext\imagick\imagick_class.c",
            "C:\php-build\php-src-nts\ext\imagick\imagick_class.c"
          )

          foreach ($file in $files) {

              $text = Get-Content `
                -Path $file `
                -Raw

              $matches = ([regex]::Matches(
                $text,
                [regex]::Escape($old)
              )).Count

              Write-Host "$file"
              Write-Host "Old API occurrences: $matches"

              if ($matches -ne 1) {
                  throw "Expected exactly one old zend_is_callable call."
              }

              $text = $text.Replace($old, $new)

              Set-Content `
                -Path $file `
                -Value $text `
                -NoNewline

              $check = Get-Content `
                -Path $file `
                -Raw

              if (-not $check.Contains($new)) {
                  throw "New PHP 8.6 API was not written."
              }

              if ($check.Contains($old)) {
                  throw "Old API still exists."
              }

              Write-Host "Patch OK."
          }

      # ============================================================
      # CREATE TS BUILD SCRIPT
      # ============================================================

      - name: Create TS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @'
          @echo off
          setlocal

          echo ========================================
          echo BUILDING IMAGICK TS
          echo ========================================

          cd /d C:\php-build\php-src-ts

          echo Current directory:
          cd

          echo.
          echo ========================================
          echo TOOLCHAIN
          echo ========================================

          where cl
          if errorlevel 1 exit /b 1

          where nmake
          if errorlevel 1 exit /b 1

          where bison
          if errorlevel 1 exit /b 1

          where re2c
          if errorlevel 1 exit /b 1

          echo.
          echo ========================================
          echo BUILD CONF
          echo ========================================

          call buildconf --force
          if errorlevel 1 (
              echo BUILDCONF FAILED
              exit /b 1
          )

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================

          call configure --disable-all --enable-cli --with-imagick=shared --with-php-build=C:\ImageMagick

          if errorlevel 1 (
              echo CONFIGURE FAILED
              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK CONFIGURATION
          echo ========================================

          findstr /I "IMAGICK" Makefile
          findstr /I "php_imagick" Makefile

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================

          nmake

          if errorlevel 1 (
              echo NMAKE FAILED
              exit /b 1
          )

          echo.
          echo ========================================
          echo SEARCHING FOR PHP_IMAGICK.DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          if errorlevel 1 (
              echo PHP_IMAGICK.DLL NOT FOUND
              exit /b 1
          )

          echo.
          echo ========================================
          echo TS BUILD COMPLETE
          echo ========================================

          endlocal
          exit /b 0
          '@ | Set-Content `
            -Path "C:\build-ts.bat" `
            -Encoding ASCII

      # ============================================================
      # BUILD TS
      # ============================================================

      - name: Build TS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-ts.bat

          if errorlevel 1 (
              echo TS BUILD FAILED
              exit /b 1
          )

      # ============================================================
      # CREATE NTS BUILD SCRIPT
      # ============================================================

      - name: Create NTS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @'
          @echo off
          setlocal

          echo ========================================
          echo BUILDING IMAGICK NTS
          echo ========================================

          cd /d C:\php-build\php-src-nts

          echo Current directory:
          cd

          echo.
          echo ========================================
          echo TOOLCHAIN
          echo ========================================

          where cl
          if errorlevel 1 exit /b 1

          where nmake
          if errorlevel 1 exit /b 1

          where bison
          if errorlevel 1 exit /b 1

          where re2c
          if errorlevel 1 exit /b 1

          echo.
          echo ========================================
          echo BUILD CONF
          echo ========================================

          call buildconf --force
          if errorlevel 1 (
              echo BUILDCONF FAILED
              exit /b 1
          )

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================

          call configure --disable-all --disable-zts --enable-cli --with-imagick=shared --with-php-build=C:\ImageMagick

          if errorlevel 1 (
              echo CONFIGURE FAILED
              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK CONFIGURATION
          echo ========================================

          findstr /I "IMAGICK" Makefile
          findstr /I "php_imagick" Makefile

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================

          nmake

          if errorlevel 1 (
              echo NMAKE FAILED
              exit /b 1
          )

          echo.
          echo ========================================
          echo SEARCHING FOR PHP_IMAGICK.DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          if errorlevel 1 (
              echo PHP_IMAGICK.DLL NOT FOUND
              exit /b 1
          )

          echo.
          echo ========================================
          echo NTS BUILD COMPLETE
          echo ========================================

          endlocal
          exit /b 0
          '@ | Set-Content `
            -Path "C:\build-nts.bat" `
            -Encoding ASCII

      # ============================================================
      # BUILD NTS
      # ============================================================

      - name: Build NTS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-nts.bat

          if errorlevel 1 (
              echo NTS BUILD FAILED
              exit /b 1
          )

      # ============================================================
      # FIND DLLS — NO HARD-CODED PATH
      # ============================================================

      - name: Locate built DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SEARCHING ENTIRE BUILD TREE"
          Write-Host "========================================"

          $tsDlls = Get-ChildItem `
            -Path "C:\php-build\php-src-ts" `
            -Recurse `
            -Filter "php_imagick.dll" `
            -ErrorAction SilentlyContinue

          $ntsDlls = Get-ChildItem `
            -Path "C:\php-build\php-src-nts" `
            -Recurse `
            -Filter "php_imagick.dll" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "TS DLL candidates:"
          $tsDlls | ForEach-Object {
              Write-Host $_.FullName
          }

          Write-Host ""
          Write-Host "NTS DLL candidates:"
          $ntsDlls | ForEach-Object {
              Write-Host $_.FullName
          }

          if ($tsDlls.Count -eq 0) {
              Write-Host ""
              Write-Host "TS DLL DOES NOT EXIST."
              Write-Host ""
              Write-Host "TS build directories:"
              Get-ChildItem `
                "C:\php-build\php-src-ts" `
                -Directory `
                -Recurse |
                Where-Object {
                    $_.Name -match "Release|Debug|x64"
                } |
                Select-Object FullName

              throw "TS php_imagick.dll was not produced."
          }

          if ($ntsDlls.Count -eq 0) {
              throw "NTS php_imagick.dll was not produced."
          }

          if ($tsDlls.Count -gt 1) {
              throw "Multiple TS php_imagick.dll files found."
          }

          if ($ntsDlls.Count -gt 1) {
              throw "Multiple NTS php_imagick.dll files found."
          }

          $ts = $tsDlls[0].FullName
          $nts = $ntsDlls[0].FullName

          Write-Host ""
          Write-Host "TS DLL:"
          Write-Host $ts

          Write-Host ""
          Write-Host "NTS DLL:"
          Write-Host $nts

          Copy-Item `
            $ts `
            "php_imagick-ts-x64.dll" `
            -Force

          Copy-Item `
            $nts `
            "php_imagick-nts-x64.dll" `
            -Force

          Write-Host ""
          Write-Host "FINAL DLL FILES:"
          Get-ChildItem `
            "php_imagick-*-x64.dll" |
            Select-Object Name, Length, LastWriteTime

      # ============================================================
      # UPLOAD ONLY DLLS
      # ============================================================

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: imagick-3.8.1-php-8.6.0beta1-x64
          path: |
            php_imagick-ts-x64.dll
            php_imagick-nts-x64.dll
          if-no-files-found: error
