name: Build imagick.dll for PHP 8.6.0beta1 (x64, TS)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    env:
      PHP_BIN_ZIP: "https://downloads.php.net/~windows/qa/php-8.6.0beta1-Win32-vs18-x64.zip"
      PHP_DEVEL_ZIP: "https://downloads.php.net/~windows/qa/php-devel-pack-8.6.0beta1-Win32-vs18-x64.zip"
      IMAGEMAGICK_URL: "https://downloads.php.net/~windows/pecl/deps/ImageMagick-7.1.1-47-vs17-x64.zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone upstream imagick source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Imagick/imagick.git C:\imagick-src

      - name: Apply zend_is_callable_ex patch
        shell: pwsh
        run: |
          $file = "C:\imagick-src\imagick_class.c"
          (Get-Content $file) -replace 'zend_is_callable\(user_callback, 0, NULL TSRMLS_CC\)', 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)' | Set-Content $file
          Write-Host "Patch applied successfully."

      - name: Download dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "${{ env.PHP_BIN_ZIP }}" -OutFile php-bin.zip -UseBasicParsing
          Invoke-WebRequest -Uri "${{ env.PHP_DEVEL_ZIP }}" -OutFile php-devel.zip -UseBasicParsing
          Invoke-WebRequest -Uri "${{ env.IMAGEMAGICK_URL }}" -OutFile im.zip -UseBasicParsing
          Invoke-WebRequest -Uri "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip" -OutFile sdk.zip -UseBasicParsing

      - name: Extract dependencies
        shell: pwsh
        run: |
          Expand-Archive php-bin.zip -DestinationPath C:\php-bin
          Expand-Archive php-devel.zip -DestinationPath C:\php-devel
          Expand-Archive im.zip -DestinationPath C:\ImageMagick
          Expand-Archive sdk.zip -DestinationPath C:\
          Rename-Item "C:\php-sdk-binary-tools-master" "C:\php-sdk"

      - name: Set up build directories
        shell: pwsh
        run: |
          $phpdevDir = Get-ChildItem "C:\php-devel" -Directory | Select-Object -First 1
          $imagickDir = "$($phpdevDir.FullName)\ext\imagick"
          New-Item -ItemType Directory -Force -Path $imagickDir
          Copy-Item -Recurse -Force "C:\imagick-src\*" $imagickDir

      - name: Build with phpize / configure / nmake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PHP_SDK_DIR=C:\php-sdk
          set IMAGICK_DIR=C:\ImageMagick
          cd /d C:\php-devel\php-8.6.0beta1-devel-vs18-x64\ext\imagick
          call phpize.bat
          call configure.bat --with-imagick=shared --with-imagick-dir=C:\ImageMagick
          nmake

      - name: Collect built DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out
          $dll = Get-ChildItem -Recurse -Filter "php_imagick.dll" | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName -Destination out\
          } else {
            exit 1
          }

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-8.6.0beta1-x64-TS
          path: out\php_imagick.dll
