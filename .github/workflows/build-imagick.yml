name: Build imagick.dll for PHP 8.6.0beta1 (x64, TS/NTS)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - ts: ts
            bin_suffix: ""
          - ts: nts
            bin_suffix: "-nts"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone upstream imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone --depth 1 https://github.com/Imagick/imagick.git C:\imagick-src

          if (-not (Test-Path "C:\imagick-src\config.w32")) {
              Write-Host "ERROR: imagick source was not downloaded correctly."
              exit 1
          }

          Write-Host "Imagick source downloaded successfully."

      - name: Apply PHP 8.6 compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\imagick-src\imagick_class.c"

          if (-not (Test-Path $file)) {
              Write-Host "ERROR: imagick_class.c not found."
              exit 1
          }

          $content = Get-Content $file -Raw

          $old = 'zend_is_callable\(user_callback, 0, NULL TSRMLS_CC\)'
          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          if ($content -match $old) {
              $content = $content -replace $old, $new
              Set-Content -Path $file -Value $content -NoNewline
              Write-Host "PHP 8.6 compatibility patch applied."
          }
          elseif ($content -match "zend_is_callable_ex") {
              Write-Host "Source already contains zend_is_callable_ex."
          }
          else {
              Write-Host "ERROR: Expected zend_is_callable() code was not found."
              exit 1
          }

      - name: Download PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-8.6.0beta1${{ matrix.bin_suffix }}-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP binary:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-bin.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-bin.zip")) {
              Write-Host "ERROR: PHP binary download failed."
              exit 1
          }

      - name: Download PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-8.6.0beta1-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP development pack:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel.zip")) {
              Write-Host "ERROR: PHP development pack download failed."
              exit 1
          }

      - name: Download ImageMagick dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-7.1.1-47-vs17-x64.zip"

          Write-Host "Downloading ImageMagick dependencies:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "im.zip" `
            -UseBasicParsing

          if (-not (Test-Path "im.zip")) {
              Write-Host "ERROR: ImageMagick dependency download failed."
              exit 1
          }

      - name: Download PHP SDK 2.8.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-2.8.3.zip"

          Write-Host "Downloading PHP SDK 2.8.3:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "sdk.zip")) {
              Write-Host "ERROR: PHP SDK download failed."
              exit 1
          }

          Write-Host "PHP SDK 2.8.3 downloaded successfully."

      - name: Extract PHP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Expand-Archive `
            -Path "php-bin.zip" `
            -DestinationPath "C:\php-bin" `
            -Force

          Write-Host "PHP extracted."

      - name: Extract PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath "C:\php-devel" `
            -Force

          Write-Host "PHP development pack extracted."

      - name: Extract ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath "C:\ImageMagick" `
            -Force

          Write-Host "ImageMagick dependencies extracted."

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath "C:\" `
            -Force

          $sdkRoot = "C:\php-sdk-binary-tools-php-sdk-2.8.3"

          if (-not (Test-Path $sdkRoot)) {
              Write-Host "ERROR: PHP SDK 2.8.3 directory not found."
              Get-ChildItem "C:\" -Directory | ForEach-Object {
                  Write-Host $_.FullName
              }
              exit 1
          }

          if (Test-Path "C:\php-sdk") {
              Remove-Item "C:\php-sdk" -Recurse -Force
          }

          Rename-Item `
            -Path $sdkRoot `
            -NewName "php-sdk"

          Write-Host "PHP SDK installed at C:\php-sdk"

      - name: Verify PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdk = "C:\php-sdk"
          $starter = "$sdk\phpsdk-vs18-x64.bat"
          $bison = "$sdk\msys2\usr\bin\bison.exe"
          $re2c = "$sdk\msys2\usr\bin\re2c.exe"

          Write-Host "Checking PHP SDK..."

          if (-not (Test-Path $starter)) {
              Write-Host "ERROR: phpsdk-vs18-x64.bat not found."
              exit 1
          }

          if (-not (Test-Path $bison)) {
              Write-Host "ERROR: bison.exe not found."
              exit 1
          }

          if (-not (Test-Path $re2c)) {
              Write-Host "ERROR: re2c.exe not found."
              exit 1
          }

          Write-Host ""
          Write-Host "PHP SDK starter:"
          Write-Host $starter

          Write-Host ""
          Write-Host "Bison:"
          & $bison --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Bison failed."
              exit 1
          }

          Write-Host ""
          Write-Host "re2c:"
          & $re2c --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: re2c failed."
              exit 1
          }

          Write-Host ""
          Write-Host "PHP SDK 2.8.3 VS18 x64 is ready."

      - name: Prepare PHP development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $phpdevDir = Get-ChildItem "C:\php-devel" -Directory |
            Select-Object -First 1

          if (-not $phpdevDir) {
              Write-Host "ERROR: PHP development directory not found."
              exit 1
          }

          $phpdevPath = $phpdevDir.FullName

          Write-Host "PHP development directory:"
          Write-Host $phpdevPath

          $imagickDir = "$phpdevPath\ext\imagick"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $imagickDir | Out-Null

          Write-Host "Copying imagick source..."

          Copy-Item `
            -Path "C:\imagick-src\*" `
            -Destination $imagickDir `
            -Recurse `
            -Force

          Write-Host "Copying PHP executable..."

          Copy-Item `
            -Path "C:\php-bin\php.exe" `
            -Destination "$phpdevPath\php.exe" `
            -Force

          Write-Host "Copying PHP DLL files..."

          Copy-Item `
            -Path "C:\php-bin\*.dll" `
            -Destination $phpdevPath `
            -Force

          Write-Host "PHP development environment prepared."

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PHP_DEV_PATH=$phpdevPath"

      - name: Create SDK build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildScript = @"
          @echo off
          setlocal

          echo ========================================
          echo PHP SDK VS18 x64
          echo ========================================

          echo PHP_DEV_PATH=%PHP_DEV_PATH%

          echo.
          echo ========================================
          echo Verify build tools
          echo ========================================

          where cl
          if errorlevel 1 (
              echo ERROR: Visual C++ compiler not found.
              exit /b 1
          )

          where nmake
          if errorlevel 1 (
              echo ERROR: nmake not found.
              exit /b 1
          )

          where bison
          if errorlevel 1 (
              echo ERROR: bison not found.
              exit /b 1
          )

          where re2c
          if errorlevel 1 (
              echo ERROR: re2c not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Bison version
          echo ========================================

          bison --version

          echo.
          echo ========================================
          echo re2c version
          echo ========================================

          re2c --version

          echo.
          echo ========================================
          echo PHP version
          echo ========================================

          cd /d "%PHP_DEV_PATH%"

          php.exe -v

          if errorlevel 1 (
              echo ERROR: PHP executable failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Enter imagick source
          echo ========================================

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          if not exist "config.w32" (
              echo ERROR: config.w32 not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call phpize.bat

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure
          echo ========================================

          call configure.bat --with-imagick=shared --with-imagick-dir=C:\ImageMagick

          if errorlevel 1 (
              echo ERROR: configure failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo nmake
          echo ========================================

          nmake

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo BUILD SUCCESS
          echo ========================================

          endlocal
          exit /b 0
          "@

          $buildScriptPath = "C:\build-imagick.bat"

          Set-Content `
            -Path $buildScriptPath `
            -Value $buildScript `
            -Encoding ASCII

          Write-Host "SDK build task created:"
          Write-Host $buildScriptPath

      - name: Build imagick with PHP SDK VS18
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick.bat

          if errorlevel 1 (
              echo ERROR: imagick build failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo imagick build completed successfully
          echo ========================================

      - name: Collect built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "out" | Out-Null

          Write-Host "Searching for php_imagick.dll..."

          $dll = Get-ChildItem `
            -Path "C:\php-devel" `
            -Recurse `
            -Filter "php_imagick.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $dll) {
              Write-Host "ERROR: php_imagick.dll was not produced."

              Write-Host ""
              Write-Host "Searching all DLL files..."

              Get-ChildItem `
                -Path "C:\php-devel" `
                -Recurse `
                -Filter "*.dll" `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              exit 1
          }

          Write-Host "Found php_imagick.dll:"
          Write-Host $dll.FullName

          Copy-Item `
            -Path $dll.FullName `
            -Destination "out\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "DLL copied to:"
          Write-Host "out\php_imagick.dll"

      - name: Verify built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "out\php_imagick.dll"

          if (-not (Test-Path $dll)) {
              Write-Host "ERROR: Output DLL does not exist."
              exit 1
          }

          $file = Get-Item $dll

          Write-Host "========================================"
          Write-Host "Built DLL"
          Write-Host "========================================"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 10000) {
              Write-Host "ERROR: DLL is suspiciously small."
              exit 1
          }

          Write-Host "DLL verification passed."

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-8.6.0beta1-x64-${{ matrix.ts }}
          path: out\php_imagick.dll
          if-no-files-found: error
