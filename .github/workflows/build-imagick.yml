name: Build imagick.dll for PHP 8.6.0 (Windows x64, TS/NTS)

on:
  workflow_dispatch:

env:
  PHP_VERSION: "8.6.0beta1"
  PHP_SDK_VERSION: "2.8.3"
  IMAGEMAGICK_VERSION: "7.1.1-47"

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: TS
            php_suffix: ""
            configure_flag: "--enable-snapshot-ts"

          - variant: NTS
            php_suffix: "-nts"
            configure_flag: "--disable-zts"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DOWNLOAD IMAGICK 3.8.1
      # ============================================================

      - name: Download Imagick 3.8.1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/3.8.1.zip"

          Write-Host "Downloading Imagick 3.8.1..."
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagick.zip" `
            -TimeoutSec 600

          if (-not (Test-Path "imagick.zip")) {
              throw "Imagick source download failed."
          }

          Write-Host "Imagick source downloaded."


      # ============================================================
      # EXTRACT IMAGICK
      # ============================================================

      - name: Extract Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\imagick-src") {
              Remove-Item "C:\imagick-src" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\imagick-src" `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath "C:\imagick-extract" `
            -Force

          $root = Get-ChildItem `
            -Path "C:\imagick-extract" `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "Imagick archive root was not found."
          }

          Copy-Item `
            -Path "$($root.FullName)\*" `
            -Destination "C:\imagick-src" `
            -Recurse `
            -Force

          if (-not (Test-Path "C:\imagick-src\config.w32")) {
              throw "config.w32 was not found."
          }

          if (-not (Test-Path "C:\imagick-src\imagick_class.c")) {
              throw "imagick_class.c was not found."
          }

          Write-Host "Imagick 3.8.1 source extracted successfully."


      # ============================================================
      # PHP 8.6 COMPATIBILITY PATCH
      #
      # ONLY CHANGE:
      #
      # zend_is_callable(...)
      # ->
      # zend_is_callable_ex(...)
      # ============================================================

      - name: Patch Imagick for PHP 8.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\imagick-src\imagick_class.c"

          $content = Get-Content `
            -Path $file `
            -Raw

          $old = "zend_is_callable(user_callback, 0, NULL TSRMLS_CC)"
          $new = "zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)"

          if ($content.Contains($old)) {

              Write-Host "Applying PHP 8.6 compatibility patch..."

              $content = $content.Replace($old, $new)

              Set-Content `
                -Path $file `
                -Value $content `
                -NoNewline `
                -Encoding UTF8

          }
          elseif ($content.Contains("zend_is_callable_ex(user_callback")) {

              Write-Host "PHP 8.6 compatibility patch already present."

          }
          else {

              throw "Expected zend_is_callable() call was not found."

          }

          $patched = Select-String `
            -Path $file `
            -Pattern "zend_is_callable_ex(user_callback" `
            -SimpleMatch

          if (-not $patched) {
              throw "PHP 8.6 compatibility patch verification failed."
          }

          Write-Host ""
          Write-Host "PHP 8.6 compatibility patch:"
          Write-Host $patched


      # ============================================================
      # DOWNLOAD PHP BINARY
      # ============================================================

      - name: Download PHP ${{ matrix.variant }} binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $suffix = "${{ matrix.php_suffix }}"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION${suffix}-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP binary:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-bin.zip" `
            -TimeoutSec 600

          if (-not (Test-Path "php-bin.zip")) {
              throw "PHP binary download failed."
          }

          Write-Host "PHP binary downloaded."


      # ============================================================
      # DOWNLOAD PHP DEVELOPMENT PACK
      # ============================================================

      - name: Download PHP development pack ${{ matrix.variant }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $suffix = "${{ matrix.php_suffix }}"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION${suffix}-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP development pack:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel.zip" `
            -TimeoutSec 600

          if (-not (Test-Path "php-devel.zip")) {
              throw "PHP development pack download failed."
          }

          Write-Host "PHP development pack downloaded."


      # ============================================================
      # DOWNLOAD IMAGEMAGICK
      # ============================================================

      - name: Download ImageMagick ${{ env.IMAGEMAGICK_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "im.zip" `
            -TimeoutSec 600

          if (-not (Test-Path "im.zip")) {
              throw "ImageMagick download failed."
          }

          Write-Host "ImageMagick downloaded."


      # ============================================================
      # DOWNLOAD PHP SDK
      # ============================================================

      - name: Download PHP SDK ${{ env.PHP_SDK_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "sdk.zip" `
            -TimeoutSec 600

          if (-not (Test-Path "sdk.zip")) {
              throw "PHP SDK download failed."
          }

          Write-Host "PHP SDK downloaded."


      # ============================================================
      # EXTRACT PHP
      # ============================================================

      - name: Extract PHP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin") {
              Remove-Item "C:\php-bin" -Recurse -Force
          }

          Expand-Archive `
            -Path "php-bin.zip" `
            -DestinationPath "C:\php-bin" `
            -Force

          $phpExe = Get-ChildItem `
            -Path "C:\php-bin" `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $phpExe) {
              throw "php.exe was not found."
          }

          Write-Host "PHP executable:"
          Write-Host $phpExe.FullName


      # ============================================================
      # EXTRACT PHP DEVELOPMENT PACK
      # ============================================================

      - name: Extract PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel") {
              Remove-Item "C:\php-devel" -Recurse -Force
          }

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath "C:\php-devel" `
            -Force

          $phpize = Get-ChildItem `
            -Path "C:\php-devel" `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "phpize.bat was not found."
          }

          $phpDevPath = $phpize.Directory.Parent.FullName

          Write-Host "PHP development path:"
          Write-Host $phpDevPath

          "PHP_DEV_PATH=$phpDevPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8


      # ============================================================
      # EXTRACT IMAGEMAGICK
      #
      # The actual PHP ImageMagick package layout is:
      #
      # include\MagickWand\MagickWand.h
      # lib\CORE_RL_MagickWand_.lib
      # lib\CORE_RL_MagickCore_.lib
      #
      # Imagick config.w32 expects:
      #
      # include\imagemagick\...
      # lib\imagemagick\...
      # ============================================================

      - name: Prepare ImageMagick development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found in ImageMagick package."
          }

          Write-Host "Found ImageMagick header:"
          Write-Host $header.FullName

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          $includeSource = $header.Directory.Parent.FullName
          $libSource = $wandLib.Directory.FullName

          $targetInclude = "$final\include\imagemagick"
          $targetLib = "$final\lib\imagemagick"
          $targetBin = "$final\bin"

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetLib `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetBin `
            -Force | Out-Null

          Copy-Item `
            -Path "$includeSource\*" `
            -Destination $targetInclude `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            Copy-Item `
              -Destination $targetLib `
              -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            Copy-Item `
              -Destination $targetBin `
              -Force

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
              throw "Final ImageMagick header is missing."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Final ImageMagick MagickWand library is missing."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Final ImageMagick MagickCore library is missing."
          }

          Write-Host ""
          Write-Host "ImageMagick development files READY."
          Write-Host $finalHeader
          Write-Host $finalWand
          Write-Host $finalCore


      # ============================================================
      # INSTALL PHP DEVELOPMENT ENVIRONMENT
      # ============================================================

      - name: Prepare PHP development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $phpDevPath = $env:PHP_DEV_PATH

          if (-not (Test-Path $phpDevPath)) {
              throw "PHP development path does not exist."
          }

          $imagickDir = "$phpDevPath\ext\imagick"

          New-Item `
            -ItemType Directory `
            -Path $imagickDir `
            -Force | Out-Null

          Copy-Item `
            -Path "C:\imagick-src\*" `
            -Destination $imagickDir `
            -Recurse `
            -Force

          $phpExe = Get-ChildItem `
            -Path "C:\php-bin" `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $phpExe) {
              throw "PHP executable was not found."
          }

          Copy-Item `
            -Path $phpExe.FullName `
            -Destination "$phpDevPath\php.exe" `
            -Force

          Get-ChildItem `
            -Path "C:\php-bin" `
            -Recurse `
            -Filter "*.dll" |
            Copy-Item `
              -Destination $phpDevPath `
              -Force

          Write-Host "PHP development environment READY."


      # ============================================================
      # CREATE BUILD SCRIPT
      # ============================================================

      - name: Create Imagick build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildScript = @"
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          echo ========================================
          echo Building Imagick ${{ matrix.variant }}
          echo PHP 8.6.0beta1
          echo Visual Studio 2026 / VS18
          echo x64
          echo ========================================
          echo.

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          if errorlevel 1 (
              echo ERROR: Cannot enter Imagick source directory.
              exit /b 1
          )

          if not exist "config.w32" (
              echo ERROR: config.w32 not found.
              exit /b 1
          )

          if not exist "imagick_class.c" (
              echo ERROR: imagick_class.c not found.
              exit /b 1
          )

          echo ========================================
          echo PHP
          echo ========================================

          php.exe -v

          if errorlevel 1 (
              echo ERROR: PHP failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================

          call phpize.bat

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================

          call configure.bat --with-imagick=C:\ImageMagick ${{ matrix.configure_flag }}

          if errorlevel 1 (
              echo ERROR: configure failed.
              exit /b 1
          )

          if not exist "Makefile" (
              echo ERROR: Makefile was not generated.
              exit /b 1
          )

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================

          nmake

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo SEARCHING FOR DLL
          echo ========================================

          set "FOUND_DLL="

          for /r %%F in (php_imagick.dll) do (
              set "FOUND_DLL=%%F"
          )

          if not defined FOUND_DLL (
              echo ERROR: nmake completed but php_imagick.dll was not created.
              echo.
              echo Build directory:
              dir /s /b *.obj 2^>nul
              dir /s /b *.lib 2^>nul
              dir /s /b *.exp 2^>nul
              exit /b 1
          )

          echo.
          echo FOUND:
          echo !FOUND_DLL!

          copy /Y "!FOUND_DLL!" "%GITHUB_WORKSPACE%\out\php_imagick.dll"

          if errorlevel 1 (
              echo ERROR: Failed to copy DLL.
              exit /b 1
          )

          echo.
          echo ========================================
          echo BUILD SUCCESS
          echo ========================================

          exit /b 0
          "@

          Set-Content `
            -Path "C:\build-imagick.bat" `
            -Value $buildScript `
            -Encoding ASCII

          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\out" `
            -Force | Out-Null

          Write-Host "Build script created."


      # ============================================================
      # BUILD USING PHP SDK VS18
      #
      # IMPORTANT:
      # windows-2025-vs2026 contains VS18.
      # phpsdk-vs18-x64.bat therefore works here.
      # ============================================================

      - name: Build Imagick ${{ matrix.variant }}
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64
          echo ========================================
          echo.

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick.bat

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: Imagick build failed
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo Imagick build completed
          echo ========================================


      # ============================================================
      # VERIFY RESULT
      # ============================================================

      - name: Verify compiled DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = Join-Path `
            $env:GITHUB_WORKSPACE `
            "out\php_imagick.dll"

          if (-not (Test-Path $dll)) {
              throw "php_imagick.dll was not created."
          }

          $size = (Get-Item $dll).Length

          if ($size -lt 10000) {
              throw "php_imagick.dll looks invalid or empty."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SUCCESS"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Variant: ${{ matrix.variant }}"
          Write-Host "DLL:"
          Write-Host $dll
          Write-Host ""
          Write-Host "Size: $size bytes"


      # ============================================================
      # UPLOAD ONLY THE PHP EXTENSION DLL
      # ============================================================

      - name: Upload php_imagick.dll
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-3.8.1-8.6.0beta1-${{ matrix.variant }}-vs18-x64
          path: out/php_imagick.dll
          if-no-files-found: error
