name: Build Imagick PHP 8.6 VS18 x64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  IMAGICK_VERSION: "3.8.1"
  IMAGEMAGICK_VERSION: "7.1.1-47"
  PHP_SDK_VERSION: "2.7.1"

jobs:

  # ============================================================
  # BUILD THREAD SAFE
  # ============================================================

  build-ts:
    name: Build Imagick PHP 8.6 TS x64
    runs-on: windows-2025

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # DOWNLOAD PHP TS
      # ==========================================================

      - name: Download PHP 8.6 TS x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP TS:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-ts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-ts.zip")) {
              throw "PHP TS archive was not downloaded."
          }

          Write-Host "PHP TS downloaded."

      # ==========================================================
      # DOWNLOAD PHP DEVELOPMENT PACKAGE
      # ==========================================================

      - name: Download PHP TS development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP development package:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel.zip")) {
              throw "PHP development package was not downloaded."
          }

          Write-Host "PHP development package downloaded."

      # ==========================================================
      # DOWNLOAD IMAGEMAGICK
      # ==========================================================

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagemagick.zip" `
            -UseBasicParsing

          if (-not (Test-Path "imagemagick.zip")) {
              throw "ImageMagick archive was not downloaded."
          }

          Write-Host "ImageMagick downloaded."

      # ==========================================================
      # DOWNLOAD PHP SDK
      # ==========================================================

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-sdk.zip")) {
              throw "PHP SDK archive was not downloaded."
          }

          Write-Host "PHP SDK downloaded."

      # ==========================================================
      # EXTRACT PHP RUNTIME
      # ==========================================================

      - name: Extract PHP runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-bin"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-ts.zip" `
            -DestinationPath $root `
            -Force

          $php = Join-Path $root "php.exe"

          if (-not (Test-Path $php)) {
              throw "PHP executable was not found at $php"
          }

          Write-Host "PHP executable:"
          Write-Host $php

          & $php -v

      # ==========================================================
      # EXTRACT PHP DEVELOPMENT PACKAGE
      # ==========================================================

      - name: Extract PHP development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-devel"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath $root `
            -Force

          Write-Host ""
          Write-Host "PHP development package contents:"
          
          Get-ChildItem `
            -Path $root `
            -Recurse `
            -File |
            Select-Object -First 100 |
            ForEach-Object {
              Write-Host $_.FullName
            }

          $phpize = Get-ChildItem `
            -Path $root `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "phpize.bat was not found in PHP development package."
          }

          Write-Host ""
          Write-Host "phpize.bat:"
          Write-Host $phpize.FullName

      # ==========================================================
      # EXTRACT PHP SDK
      # ==========================================================

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-sdk-extract"
          $sdk = "C:\php-sdk"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $sdk) {
              Remove-Item $sdk -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-sdk.zip" `
            -DestinationPath $extract `
            -Force

          $root = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "PHP SDK archive root was not found."
          }

          Move-Item `
            -Path $root.FullName `
            -Destination $sdk `
            -Force

          Write-Host ""
          Write-Host "PHP SDK root:"
          Write-Host $sdk

          Write-Host ""
          Write-Host "Searching VS18 x64 starter..."

          $starter = Get-ChildItem `
            -Path $sdk `
            -Recurse `
            -Filter "phpsdk-vs18-x64.bat" |
            Select-Object -First 1

          if (-not $starter) {
              throw "Official PHP SDK VS18 x64 starter was not found."
          }

          Write-Host "VS18 x64 starter:"
          Write-Host $starter.FullName

      # ==========================================================
      # PREPARE IMAGEMAGICK
      # ==========================================================

      - name: Prepare ImageMagick development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\include\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\lib\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\bin" `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagemagick.zip" `
            -DestinationPath $raw `
            -Force

          Write-Host ""
          Write-Host "Searching ImageMagick headers..."

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Where-Object {
              $_.FullName -match "\\MagickWand\\MagickWand\.h$"
            } |
            Select-Object -First 1

          if (-not $header) {
              Write-Host ""
              Write-Host "ImageMagick archive structure:"

              Get-ChildItem `
                -Path $raw `
                -Recurse `
                -File |
                Select-Object -First 200 |
                ForEach-Object {
                  Write-Host $_.FullName
                }

              throw "MagickWand.h was not found."
          }

          Write-Host "Found header:"
          Write-Host $header.FullName

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          Write-Host ""
          Write-Host "MagickWand library:"
          Write-Host $wandLib.FullName

          Write-Host ""
          Write-Host "MagickCore library:"
          Write-Host $coreLib.FullName

          $includeRoot = $header.Directory.Parent.FullName

          Copy-Item `
            -Path "$includeRoot\*" `
            -Destination "$final\include\imagemagick" `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "$final\lib\imagemagick" `
                -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "$final\bin" `
                -Force
            }

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
              throw "Final MagickWand.h is missing."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Final MagickWand import library is missing."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Final MagickCore import library is missing."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ImageMagick development environment READY"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Header:"
          Write-Host $finalHeader

          Write-Host ""
          Write-Host "Libraries:"
          Get-ChildItem `
            -Path "$final\lib\imagemagick" `
            -Filter "*.lib" |
            ForEach-Object {
              Write-Host $_.FullName
            }

      # ==========================================================
      # DOWNLOAD + PREPARE IMAGICK SOURCE
      # ==========================================================

      - name: Prepare Imagick 3.8.1 TS source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip"

          Write-Host "Downloading Imagick:"
          Write-Host $url

          $archive = "imagick-ts.zip"

          $success = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {

              try {
                  Write-Host ""
                  Write-Host "Download attempt $attempt / 5"

                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile $archive `
                    -UseBasicParsing `
                    -MaximumRedirection 10

                  if (Test-Path $archive) {
                      $size = (Get-Item $archive).Length

                      if ($size -gt 10000) {
                          $success = $true
                          break
                      }
                  }
              }
              catch {
                  Write-Host "Download failed:"
                  Write-Host $_.Exception.Message
              }

              if ($attempt -lt 5) {
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

          if (-not $success) {
              throw "Imagick source archive could not be downloaded after 5 attempts."
          }

          if (Test-Path "C:\imagick-ts") {
              Remove-Item "C:\imagick-ts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\imagick-ts" `
            -Force | Out-Null

          Expand-Archive `
            -Path $archive `
            -DestinationPath "C:\imagick-ts" `
            -Force

          $sourceRoot = Get-ChildItem `
            -Path "C:\imagick-ts" `
            -Directory |
            Select-Object -First 1

          if (-not $sourceRoot) {
              throw "Imagick source root was not found."
          }

          Write-Host "Imagick source root:"
          Write-Host $sourceRoot.FullName

          $source = Join-Path $sourceRoot.FullName "imagick_class.c"

          if (-not (Test-Path $source)) {
              throw "imagick_class.c was not found."
          }

          $old = 'zend_is_callable(user_callback, 0, NULL TSRMLS_CC)'
          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          $text = Get-Content `
            -Path $source `
            -Raw

          $count = ([regex]::Matches(
            $text,
            [regex]::Escape($old)
          )).Count

          Write-Host "Occurrences of old API: $count"

          if ($count -eq 1) {

              $text = $text.Replace($old, $new)

              Set-Content `
                -Path $source `
                -Value $text `
                -Encoding UTF8 `
                -NoNewline

              Write-Host "PHP 8.6 compatibility patch applied."

          }
          elseif ($text.Contains($new)) {

              Write-Host "PHP 8.6 compatibility patch already present."

          }
          else {

              throw "Expected zend_is_callable compatibility code was not found."

          }

          $verify = Get-Content `
            -Path $source `
            -Raw

          if ($verify.Contains($old)) {
              throw "Old zend_is_callable call is still present."
          }

          if (-not $verify.Contains($new)) {
              throw "New zend_is_callable_ex call was not inserted."
          }

          Write-Host ""
          Write-Host "Patched source:"
          
          Select-String `
            -Path $source `
            -Pattern "zend_is_callable" `
            -Context 2,2

      # ==========================================================
      # CREATE TS BUILD SCRIPT
      # ==========================================================

      - name: Create TS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = @"
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          echo ========================================
          echo PHP 8.6 TS x64 / Imagick 3.8.1
          echo ========================================
          echo.

          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-ts"

          echo PHP development package:
          echo %PHP_DEV%
          echo.

          echo ImageMagick:
          echo %IMAGEMAGICK%
          echo.

          echo Imagick source:
          echo %SOURCE%
          echo.

          echo ========================================
          echo TOOLCHAIN
          echo ========================================

          where cl
          if errorlevel 1 (
              echo ERROR: cl.exe not found.
              exit /b 1
          )

          where link
          if errorlevel 1 (
              echo ERROR: link.exe not found.
              exit /b 1
          )

          where nmake
          if errorlevel 1 (
              echo ERROR: nmake.exe not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHP DEVELOPMENT PACKAGE
          echo ========================================

          if not exist "%PHP_DEV%\phpize.bat" (
              echo ERROR: phpize.bat missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\include\php\main\php.h" (
              echo ERROR: PHP headers missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\php8ts.lib" (
              echo ERROR: php8ts.lib missing.
              echo.
              dir /s /b "%PHP_DEV%\*.lib"
              exit /b 1
          )

          echo PHP TS development package OK.

          echo.
          echo ========================================
          echo IMAGEMAGICK DEVELOPMENT FILES
          echo ========================================

          if not exist "%IMAGEMAGICK%\include\imagemagick\MagickWand\MagickWand.h" (
              echo ERROR: MagickWand.h missing.
              exit /b 1
          )

          if not exist "%IMAGEMAGICK%\lib\imagemagick\CORE_RL_MagickWand_.lib" (
              echo ERROR: CORE_RL_MagickWand_.lib missing.
              exit /b 1
          )

          if not exist "%IMAGEMAGICK%\lib\imagemagick\CORE_RL_MagickCore_.lib" (
              echo ERROR: CORE_RL_MagickCore_.lib missing.
              exit /b 1
          )

          echo ImageMagick development files OK.

          echo.
          echo ========================================
          echo SOURCE
          echo ========================================

          cd /d "%SOURCE%"
          if errorlevel 1 (
              echo ERROR: Cannot enter Imagick source directory.
              exit /b 1
          )

          echo Current directory:
          cd

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================

          call "%PHP_DEV%\phpize.bat"

          if errorlevel 1 (
              echo.
              echo PHPIZE FAILED
              exit /b 1
          )

          echo.
          echo PHPIZE SUCCESS

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================

          REM IMPORTANT:
          REM Do NOT use --with-imagick=shared.
          REM --with-imagick expects the ImageMagick path.

          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo CONFIGURE FAILED
              echo ========================================

              if exist config.log (
                  echo.
                  echo CONFIG.LOG
                  echo ========================================
                  type config.log
              )

              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK CONFIGURATION
          echo ========================================

          if not exist Makefile (
              echo ERROR: Makefile was not generated.
              exit /b 1
          )

          echo Makefile found.

          findstr /i "php_imagick" Makefile >nul

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: IMAGICK WAS NOT ENABLED
              echo ========================================
              echo.
              echo configure did not add php_imagick to Makefile.
              echo.
              echo PHP_DEV:
              echo %PHP_DEV%
              echo.
              echo IMAGEMAGICK:
              echo %IMAGEMAGICK%
              echo.
              echo Header:
              dir /s /b "%IMAGEMAGICK%\include\imagemagick\MagickWand\MagickWand.h" 2>nul
              echo.
              echo Libraries:
              dir /s /b "%IMAGEMAGICK%\lib\imagemagick\*.lib" 2>nul
              echo.
              if exist config.log type config.log
              exit /b 1
          )

          echo Imagick successfully enabled in Makefile.

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================

          nmake /nologo > nmake-ts.log 2>&1

          if errorlevel 1 (
              echo.
              echo ========================================
              echo NMAKE FAILED
              echo ========================================
              echo.
              type nmake-ts.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo NMAKE SUCCESS
          echo ========================================

          echo.
          echo ========================================
          echo SEARCHING GENERATED DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          set "FOUND_DLL="

          for /r %%F in (php_imagick.dll) do (
              set "FOUND_DLL=%%F"
              goto :dll_found
          )

          :dll_found

          if not defined FOUND_DLL (
              echo.
              echo ERROR: php_imagick.dll was not produced.
              echo.
              echo DLL:
              dir /s /b *.dll 2>nul
              echo.
              echo OBJ:
              dir /s /b *.obj 2>nul
              echo.
              echo LIB:
              dir /s /b *.lib 2>nul
              exit /b 1
          )

          echo.
          echo Generated DLL:
          echo !FOUND_DLL!

          copy /y "!FOUND_DLL!" "%SOURCE%\php_imagick.dll"

          if errorlevel 1 (
              echo ERROR: Failed to copy generated DLL.
              exit /b 1
          )

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: Final TS DLL does not exist.
              exit /b 1
          )

          echo.
          echo ========================================
          echo TS DLL FOUND
          echo ========================================
          echo %SOURCE%\php_imagick.dll

          endlocal
          exit /b 0
          "@

          Set-Content `
            -Path "C:\build-imagick-ts.bat" `
            -Value $build `
            -Encoding ASCII

          Write-Host "TS build task created."

      # ==========================================================
      # BUILD TS
      # ==========================================================

      - name: Build Imagick TS
        shell: cmd
        run: |
          echo ========================================
          echo STARTING PHP SDK VS18 X64
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-ts.bat

          if errorlevel 1 (
              echo.
              echo ========================================
              echo TS BUILD FAILED
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo TS BUILD COMPLETED
          echo ========================================

      # ==========================================================
      # VALIDATE TS DLL
      # ==========================================================

      - name: Validate TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-ts\php_imagick.dll"

          Write-Host "========================================"
          Write-Host "VALIDATING TS DLL"
          Write-Host "========================================"

          if (-not (Test-Path $dll)) {
              Write-Host ""
              Write-Host "DLL was not found."
              Write-Host ""
              Write-Host "Searching entire C:\ drive..."

              Get-ChildItem `
                -Path "C:\" `
                -Recurse `
                -Filter "php_imagick.dll" `
                -File `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host $_.FullName
                }

              throw "TS php_imagick.dll was not produced."
          }

          Write-Host "TS DLL:"
          Write-Host $dll

          Get-Item $dll |
            Format-List FullName,Length,LastWriteTime

          Write-Host ""
          Write-Host "Copying ImageMagick runtime DLLs..."

          $runtimeDlls = Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File

          foreach ($file in $runtimeDlls) {

              $destination = Join-Path "C:\php-bin" $file.Name

              if (([System.IO.Path]::GetFullPath($file.FullName)) -ne
                  ([System.IO.Path]::GetFullPath($destination))) {

                  Copy-Item `
                    -Path $file.FullName `
                    -Destination $destination `
                    -Force

              }
          }

          Copy-Item `
            -Path $dll `
            -Destination "C:\php-bin\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "Testing PHP TS extension..."

          & "C:\php-bin\php.exe" `
            -n `
            -d "extension=C:\php-bin\php_imagick.dll" `
            -r "echo PHP_VERSION, PHP_EOL; echo PHP_ZTS ? 'TS' : 'NTS', PHP_EOL; echo extension_loaded('imagick') ? 'Imagick OK' : 'Imagick FAILED', PHP_EOL;"

          if ($LASTEXITCODE -ne 0) {
              throw "PHP TS failed to load php_imagick.dll."
          }

          Write-Host ""
          Write-Host "TS VALIDATION SUCCESS."

      # ==========================================================
      # PACKAGE TS
      # ==========================================================

      - name: Package TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\artifact-ts" `
            -Force | Out-Null

          Copy-Item `
            -Path "C:\imagick-ts\php_imagick.dll" `
            -Destination "C:\artifact-ts\php_imagick.dll" `
            -Force

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "C:\artifact-ts" `
                -Force
            }

          Compress-Archive `
            -Path "C:\artifact-ts\*" `
            -DestinationPath "imagick-3.8.1-php8.6-vs18-x64-ts.zip" `
            -Force

      # ==========================================================
      # UPLOAD TS
      # ==========================================================

      - name: Upload TS artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagick-3.8.1-php8.6-vs18-x64-ts
          path: imagick-3.8.1-php8.6-vs18-x64-ts.zip
          if-no-files-found: error


  # ============================================================
  # BUILD NON THREAD SAFE
  # ============================================================

  build-nts:
    name: Build Imagick PHP 8.6 NTS x64
    runs-on: windows-2025

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # DOWNLOAD PHP NTS
      # ==========================================================

      - name: Download PHP 8.6 NTS x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-nts-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP NTS:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-nts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-nts.zip")) {
              throw "PHP NTS archive was not downloaded."
          }

          Write-Host "PHP NTS downloaded."

      # ==========================================================
      # DOWNLOAD PHP NTS DEVELOPMENT PACKAGE
      # ==========================================================

      - name: Download PHP NTS development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-nts-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP NTS development package:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel-nts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel-nts.zip")) {
              throw "PHP NTS development package was not downloaded."
          }

          Write-Host "PHP NTS development package downloaded."

      # ==========================================================
      # DOWNLOAD IMAGEMAGICK
      # ==========================================================

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagemagick.zip" `
            -UseBasicParsing

          if (-not (Test-Path "imagemagick.zip")) {
              throw "ImageMagick archive was not downloaded."
          }

          Write-Host "ImageMagick downloaded."

      # ==========================================================
      # DOWNLOAD PHP SDK
      # ==========================================================

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-sdk.zip")) {
              throw "PHP SDK archive was not downloaded."
          }

          Write-Host "PHP SDK downloaded."

      # ==========================================================
      # EXTRACT PHP RUNTIME
      # ==========================================================

      - name: Extract PHP runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-bin"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-nts.zip" `
            -DestinationPath $root `
            -Force

          $php = Join-Path $root "php.exe"

          if (-not (Test-Path $php)) {
              throw "PHP NTS executable was not found."
          }

          Write-Host "PHP executable:"
          Write-Host $php

          & $php -v

      # ==========================================================
      # EXTRACT PHP DEVELOPMENT PACKAGE
      # ==========================================================

      - name: Extract PHP development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-devel"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel-nts.zip" `
            -DestinationPath $root `
            -Force

          $phpize = Get-ChildItem `
            -Path $root `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "phpize.bat was not found in NTS development package."
          }

          Write-Host "NTS phpize:"
          Write-Host $phpize.FullName

      # ==========================================================
      # EXTRACT PHP SDK
      # ==========================================================

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-sdk-extract"
          $sdk = "C:\php-sdk"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $sdk) {
              Remove-Item $sdk -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-sdk.zip" `
            -DestinationPath $extract `
            -Force

          $root = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "PHP SDK archive root was not found."
          }

          Move-Item `
            -Path $root.FullName `
            -Destination $sdk `
            -Force

          Write-Host ""
          Write-Host "PHP SDK root:"
          Write-Host $sdk

          $starter = Get-ChildItem `
            -Path $sdk `
            -Recurse `
            -Filter "phpsdk-vs18-x64.bat" |
            Select-Object -First 1

          if (-not $starter) {
              throw "Official PHP SDK VS18 x64 starter was not found."
          }

          Write-Host "VS18 x64 starter:"
          Write-Host $starter.FullName

      # ==========================================================
      # PREPARE IMAGEMAGICK
      # ==========================================================

      - name: Prepare ImageMagick development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\include\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\lib\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\bin" `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagemagick.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Where-Object {
              $_.FullName -match "\\MagickWand\\MagickWand\.h$"
            } |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found."
          }

          $wand = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $core = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wand) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $core) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          Copy-Item `
            -Path "$($header.Directory.Parent.FullName)\*" `
            -Destination "$final\include\imagemagick" `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "$final\lib\imagemagick" `
                -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "$final\bin" `
                -Force
            }

          if (-not (Test-Path "$final\include\imagemagick\MagickWand\MagickWand.h")) {
              throw "Final MagickWand.h is missing."
          }

          if (-not (Test-Path "$final\lib\imagemagick\CORE_RL_MagickWand_.lib")) {
              throw "Final MagickWand library is missing."
          }

          if (-not (Test-Path "$final\lib\imagemagick\CORE_RL_MagickCore_.lib")) {
              throw "Final MagickCore library is missing."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ImageMagick development environment READY"
          Write-Host "========================================"

      # ==========================================================
      # PREPARE IMAGICK SOURCE
      # ==========================================================

      - name: Prepare Imagick 3.8.1 NTS source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip"

          Write-Host "Downloading Imagick:"
          Write-Host $url

          $archive = "imagick-nts.zip"

          $success = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {

              try {
                  Write-Host ""
                  Write-Host "Download attempt $attempt / 5"

                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile $archive `
                    -UseBasicParsing `
                    -MaximumRedirection 10

                  if (Test-Path $archive) {
                      $size = (Get-Item $archive).Length

                      if ($size -gt 10000) {
                          $success = $true
                          break
                      }
                  }
              }
              catch {
                  Write-Host "Download failed:"
                  Write-Host $_.Exception.Message
              }

              if ($attempt -lt 5) {
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

          if (-not $success) {
              throw "Imagick source archive could not be downloaded after 5 attempts."
          }

          if (Test-Path "C:\imagick-nts") {
              Remove-Item "C:\imagick-nts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\imagick-nts" `
            -Force | Out-Null

          Expand-Archive `
            -Path $archive `
            -DestinationPath "C:\imagick-nts" `
            -Force

          $root = Get-ChildItem `
            -Path "C:\imagick-nts" `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "Imagick source root was not found."
          }

          $source = Join-Path $root.FullName "imagick_class.c"

          if (-not (Test-Path $source)) {
              throw "imagick_class.c was not found."
          }

          $old = 'zend_is_callable(user_callback, 0, NULL TSRMLS_CC)'
          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          $text = Get-Content `
            -Path $source `
            -Raw

          $count = ([regex]::Matches(
            $text,
            [regex]::Escape($old)
          )).Count

          if ($count -eq 1) {

              $text = $text.Replace($old, $new)

              Set-Content `
                -Path $source `
                -Value $text `
                -Encoding UTF8 `
                -NoNewline

              Write-Host "PHP 8.6 compatibility patch applied."

          }
          elseif ($text.Contains($new)) {

              Write-Host "PHP 8.6 compatibility patch already present."

          }
          else {

              throw "Expected zend_is_callable compatibility code was not found."

          }

          $verify = Get-Content `
            -Path $source `
            -Raw

          if ($verify.Contains($old)) {
              throw "Old zend_is_callable call remains."
          }

          if (-not $verify.Contains($new)) {
              throw "zend_is_callable_ex patch was not applied."
          }

          Select-String `
            -Path $source `
            -Pattern "zend_is_callable" `
            -Context 2,2

      # ==========================================================
      # CREATE NTS BUILD SCRIPT
      # ==========================================================

      - name: Create NTS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = @"
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          echo ========================================
          echo PHP 8.6 NTS x64 / Imagick 3.8.1
          echo ========================================

          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-nts"

          echo.
          echo ========================================
          echo TOOLCHAIN
          echo ========================================

          where cl
          if errorlevel 1 (
              echo ERROR: cl.exe not found.
              exit /b 1
          )

          where link
          if errorlevel 1 (
              echo ERROR: link.exe not found.
              exit /b 1
          )

          where nmake
          if errorlevel 1 (
              echo ERROR: nmake.exe not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHP DEVELOPMENT PACKAGE
          echo ========================================

          if not exist "%PHP_DEV%\phpize.bat" (
              echo ERROR: phpize.bat missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\include\php\main\php.h" (
              echo ERROR: PHP headers missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\php8.lib" (
              if not exist "%PHP_DEV%\php8nts.lib" (
                  echo ERROR: PHP NTS import library not found.
                  echo.
                  dir /s /b "%PHP_DEV%\*.lib"
                  exit /b 1
              )
          )

          echo PHP NTS development package OK.

          echo.
          echo ========================================
          echo IMAGEMAGICK DEVELOPMENT FILES
          echo ========================================

          if not exist "%IMAGEMAGICK%\include\imagemagick\MagickWand\MagickWand.h" (
              echo ERROR: MagickWand.h missing.
              exit /b 1
          )

          if not exist "%IMAGEMAGICK%\lib\imagemagick\CORE_RL_MagickWand_.lib" (
              echo ERROR: CORE_RL_MagickWand_.lib missing.
              exit /b 1
          )

          if not exist "%IMAGEMAGICK%\lib\imagemagick\CORE_RL_MagickCore_.lib" (
              echo ERROR: CORE_RL_MagickCore_.lib missing.
              exit /b 1
          )

          echo ImageMagick development files OK.

          echo.
          echo ========================================
          echo SOURCE
          echo ========================================

          cd /d "%SOURCE%"
          if errorlevel 1 (
              echo ERROR: Cannot enter Imagick source directory.
              exit /b 1
          )

          echo Current directory:
          cd

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================

          call "%PHP_DEV%\phpize.bat"

          if errorlevel 1 (
              echo PHPIZE FAILED
              exit /b 1
          )

          echo PHPIZE SUCCESS

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================

          REM IMPORTANT:
          REM Do NOT use --with-imagick=shared.
          REM --with-imagick expects the ImageMagick path.

          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo CONFIGURE FAILED
              echo ========================================

              if exist config.log type config.log

              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK CONFIGURATION
          echo ========================================

          if not exist Makefile (
              echo ERROR: Makefile was not generated.
              exit /b 1
          )

          findstr /i "php_imagick" Makefile >nul

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: IMAGICK WAS NOT ENABLED
              echo ========================================

              echo.
              echo PHP_DEV:
              echo %PHP_DEV%

              echo.
              echo IMAGEMAGICK:
              echo %IMAGEMAGICK%

              echo.
              echo Header:
              dir /s /b "%IMAGEMAGICK%\include\imagemagick\MagickWand\MagickWand.h" 2>nul

              echo.
              echo Libraries:
              dir /s /b "%IMAGEMAGICK%\lib\imagemagick\*.lib" 2>nul

              echo.
              if exist config.log type config.log

              exit /b 1
          )

          echo Imagick successfully enabled in Makefile.

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================

          nmake /nologo > nmake-nts.log 2>&1

          if errorlevel 1 (
              echo.
              echo ========================================
              echo NMAKE FAILED
              echo ========================================
              echo.
              type nmake-nts.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo NMAKE SUCCESS
          echo ========================================

          echo.
          echo ========================================
          echo SEARCHING GENERATED DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          set "FOUND_DLL="

          for /r %%F in (php_imagick.dll) do (
              set "FOUND_DLL=%%F"
              goto :dll_found
          )

          :dll_found

          if not defined FOUND_DLL (
              echo.
              echo ERROR: php_imagick.dll was not produced.
              echo.
              echo DLL:
              dir /s /b *.dll 2>nul
              echo.
              echo OBJ:
              dir /s /b *.obj 2>nul
              echo.
              echo LIB:
              dir /s /b *.lib 2>nul
              exit /b 1
          )

          echo.
          echo Generated DLL:
          echo !FOUND_DLL!

          copy /y "!FOUND_DLL!" "%SOURCE%\php_imagick.dll"

          if errorlevel 1 (
              echo ERROR: Failed to copy generated DLL.
              exit /b 1
          )

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: Final NTS DLL does not exist.
              exit /b 1
          )

          echo.
          echo ========================================
          echo NTS DLL FOUND
          echo ========================================
          echo %SOURCE%\php_imagick.dll

          endlocal
          exit /b 0
          "@

          Set-Content `
            -Path "C:\build-imagick-nts.bat" `
            -Value $build `
            -Encoding ASCII

          Write-Host "NTS build task created."

      # ==========================================================
      # BUILD NTS
      # ==========================================================

      - name: Build Imagick NTS
        shell: cmd
        run: |
          echo ========================================
          echo STARTING PHP SDK VS18 X64
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-nts.bat

          if errorlevel 1 (
              echo.
              echo ========================================
              echo NTS BUILD FAILED
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo NTS BUILD COMPLETED
          echo ========================================

      # ==========================================================
      # VALIDATE NTS DLL
      # ==========================================================

      - name: Validate NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-nts\php_imagick.dll"

          Write-Host "========================================"
          Write-Host "VALIDATING NTS DLL"
          Write-Host "========================================"

          if (-not (Test-Path $dll)) {

              Write-Host ""
              Write-Host "DLL was not found."

              Write-Host ""
              Write-Host "Searching entire C:\ drive..."

              Get-ChildItem `
                -Path "C:\" `
                -Recurse `
                -Filter "php_imagick.dll" `
                -File `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host $_.FullName
                }

              throw "NTS php_imagick.dll was not produced."
          }

          Write-Host "NTS DLL:"
          Write-Host $dll

          Get-Item $dll |
            Format-List FullName,Length,LastWriteTime

          Write-Host ""
          Write-Host "Copying ImageMagick runtime DLLs..."

          $runtimeDlls = Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File

          foreach ($file in $runtimeDlls) {

              $destination = Join-Path "C:\php-bin" $file.Name

              if (([System.IO.Path]::GetFullPath($file.FullName)) -ne
                  ([System.IO.Path]::GetFullPath($destination))) {

                  Copy-Item `
                    -Path $file.FullName `
                    -Destination $destination `
                    -Force

              }
          }

          Copy-Item `
            -Path $dll `
            -Destination "C:\php-bin\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "Testing PHP NTS extension..."

          & "C:\php-bin\php.exe" `
            -n `
            -d "extension=C:\php-bin\php_imagick.dll" `
            -r "echo PHP_VERSION, PHP_EOL; echo PHP_ZTS ? 'TS' : 'NTS', PHP_EOL; echo extension_loaded('imagick') ? 'Imagick OK' : 'Imagick FAILED', PHP_EOL;"

          if ($LASTEXITCODE -ne 0) {
              throw "PHP NTS failed to load php_imagick.dll."
          }

          Write-Host ""
          Write-Host "NTS VALIDATION SUCCESS."

      # ==========================================================
      # PACKAGE NTS
      # ==========================================================

      - name: Package NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\artifact-nts" `
            -Force | Out-Null

          Copy-Item `
            -Path "C:\imagick-nts\php_imagick.dll" `
            -Destination "C:\artifact-nts\php_imagick.dll" `
            -Force

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "C:\artifact-nts" `
                -Force
            }

          Compress-Archive `
            -Path "C:\artifact-nts\*" `
            -DestinationPath "imagick-3.8.1-php8.6-vs18-x64-nts.zip" `
            -Force

      # ==========================================================
      # UPLOAD NTS
      # ==========================================================

      - name: Upload NTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagick-3.8.1-php8.6-vs18-x64-nts
          path: imagick-3.8.1-php8.6-vs18-x64-nts.zip
          if-no-files-found: error
