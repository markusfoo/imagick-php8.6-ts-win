name: Build Imagick for PHP 8.6 Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  PHP_SDK_VERSION: "2.8.3"
  IMAGEMAGICK_VERSION: "7.1.1-47"
  IMAGICK_VERSION: "3.8.1"
  PHP_DEV_PATH: "C:\php-devel"
  PHP_BIN_PATH: "C:\php-bin"
  PHP_SDK_PATH: "C:\php-sdk"
  IMAGEMAGICK_PATH: "C:\ImageMagick"

jobs:

  build-ts:
    name: Build Imagick PHP 8.6 TS x64
    runs-on: windows-2025

    steps:

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
              "C:\php-bin",
              "C:\php-devel",
              "C:\php-sdk",
              "C:\ImageMagick",
              "C:\ImageMagickRaw",
              "C:\imagick-source",
              "C:\build-imagick.bat"
          )

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  Write-Host "Removing $path"
                  Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

          Write-Host "Clean completed."

      # ============================================================
      # DOWNLOAD PHP
      # ============================================================

      - name: Download PHP 8.6 TS x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-8.6.0beta1-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php.zip" `
            -UseBasicParsing

          Write-Host "PHP downloaded."

      # ============================================================
      # EXTRACT PHP
      # ============================================================

      - name: Extract PHP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\php-bin" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php.zip" `
            -DestinationPath "C:\php-bin" `
            -Force

          if (-not (Test-Path "C:\php-bin\php.exe")) {
              throw "php.exe was not found."
          }

          Write-Host "PHP executable:"
          Write-Host "C:\php-bin\php.exe"

      # ============================================================
      # DOWNLOAD PHP DEVELOPMENT PACKAGE
      # ============================================================

      - name: Download PHP development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-8.6.0beta1-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP development pack:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel.zip" `
            -UseBasicParsing

          Write-Host "PHP development pack downloaded."

      # ============================================================
      # EXTRACT PHP DEVELOPMENT PACKAGE
      # ============================================================

      - name: Extract PHP development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath "C:\php-devel" `
            -Force

          $config = Get-ChildItem `
            -Path "C:\php-devel" `
            -Recurse `
            -Filter "config.w32" |
            Select-Object -First 1

          if (-not $config) {
              throw "PHP development package does not contain config.w32."
          }

          Write-Host "PHP development environment:"
          Write-Host $config.FullName

      # ============================================================
      # DOWNLOAD IMAGEMAGICK
      # ============================================================

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-7.1.1-47-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "im.zip" `
            -UseBasicParsing

          Write-Host "ImageMagick downloaded."

      # ============================================================
      # PREPARE IMAGEMAGICK
      # ============================================================

      - name: Prepare ImageMagick development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found in ImageMagick package."
          }

          Write-Host "Found ImageMagick header:"
          Write-Host $header.FullName

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          $includeSource = $header.Directory.Parent.FullName

          $targetInclude = "$final\include\imagemagick"
          $targetLib = "$final\lib\imagemagick"
          $targetBin = "$final\bin"

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetLib `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetBin `
            -Force | Out-Null

          Copy-Item `
            -Path "$includeSource\*" `
            -Destination $targetInclude `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            Copy-Item `
              -Destination $targetLib `
              -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            Copy-Item `
              -Destination $targetBin `
              -Force

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
              throw "Final ImageMagick header is missing."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Final ImageMagick MagickWand library is missing."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Final ImageMagick MagickCore library is missing."
          }

          Write-Host ""
          Write-Host "ImageMagick development files READY."
          Write-Host $finalHeader
          Write-Host $finalWand
          Write-Host $finalCore

      # ============================================================
      # DOWNLOAD PHP SDK
      # ============================================================

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-2.8.3.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "sdk.zip" `
            -UseBasicParsing

          Write-Host "PHP SDK downloaded."

      # ============================================================
      # EXTRACT PHP SDK
      # ============================================================

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-sdk-extract"
          $final = "C:\php-sdk"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath $extract `
            -Force

          $sdkRoot = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $sdkRoot) {
              throw "PHP SDK root directory was not found."
          }

          New-Item `
            -ItemType Directory `
            -Path $final `
            -Force | Out-Null

          Copy-Item `
            -Path "$($sdkRoot.FullName)\*" `
            -Destination $final `
            -Recurse `
            -Force

          $sdkBat = Get-ChildItem `
            -Path $final `
            -Recurse `
            -Filter "phpsdk-vs18-x64.bat" |
            Select-Object -First 1

          if (-not $sdkBat) {
              Write-Host "PHP SDK contents:"
              Get-ChildItem $final -Recurse | Select-Object -First 100

              throw "phpsdk-vs18-x64.bat was not found."
          }

          Write-Host "PHP SDK ready:"
          Write-Host $sdkBat.FullName

      # ============================================================
      # DOWNLOAD IMAGICK SOURCE WITH RETRIES
      # ============================================================

      - name: Download Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $urls = @(
              "https://github.com/Imagick/imagick/archive/refs/tags/3.8.1.zip",
              "https://codeload.github.com/Imagick/imagick/zip/refs/tags/3.8.1"
          )

          $output = "imagick.zip"
          $success = $false

          foreach ($url in $urls) {

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "Downloading Imagick source"
              Write-Host $url
              Write-Host "============================================================"

              for ($attempt = 1; $attempt -le 5; $attempt++) {

                  try {

                      if (Test-Path $output) {
                          Remove-Item $output -Force
                      }

                      Write-Host "Attempt $attempt / 5"

                      Invoke-WebRequest `
                        -Uri $url `
                        -OutFile $output `
                        -UseBasicParsing `
                        -TimeoutSec 120

                      if (-not (Test-Path $output)) {
                          throw "Imagick archive was not created."
                      }

                      $size = (Get-Item $output).Length

                      if ($size -lt 100000) {
                          throw "Downloaded Imagick archive is suspiciously small: $size bytes."
                      }

                      Write-Host "Imagick source downloaded successfully."
                      Write-Host "Size: $size bytes"

                      $success = $true
                      break

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Download attempt failed:"
                      Write-Host $_.Exception.Message

                      if ($attempt -lt 5) {
                          $delay = $attempt * 5

                          Write-Host "Waiting $delay seconds before retry..."
                          Start-Sleep -Seconds $delay
                      }
                  }
              }

              if ($success) {
                  break
              }

              Write-Host ""
              Write-Host "Source URL failed. Trying next source..."
          }

          if (-not $success) {
              throw "Unable to download Imagick 3.8.1 from GitHub after all retries."
          }

      # ============================================================
      # EXTRACT IMAGICK SOURCE
      # ============================================================

      - name: Extract Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\imagick-source"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath $extract `
            -Force

          $imagickRoot = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $imagickRoot) {
              throw "Imagick source root was not found."
          }

          $sourceFile = Join-Path `
            $imagickRoot.FullName `
            "imagick_class.c"

          if (-not (Test-Path $sourceFile)) {
              throw "imagick_class.c was not found."
          }

          Write-Host "Imagick source:"
          Write-Host $imagickRoot.FullName

      # ============================================================
      # APPLY ONLY PHP 8.6 FIX
      # ============================================================

      - name: Apply PHP 8.6 zend_is_callable fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Recurse `
            -Filter "imagick_class.c" |
            Select-Object -First 1

          if (-not $source) {
              throw "imagick_class.c was not found."
          }

          Write-Host "Patching:"
          Write-Host $source.FullName

          $content = Get-Content `
            -Path $source.FullName `
            -Raw

          $old = 'if (!user_callback || !zend_is_callable(user_callback, 0, NULL TSRMLS_CC)) {'

          $new = 'if (!user_callback || !zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)) {'

          $oldCount = ([regex]::Matches(
              $content,
              [regex]::Escape($old)
          )).Count

          Write-Host "Occurrences of old code: $oldCount"

          if ($oldCount -ne 1) {
              Write-Host ""
              Write-Host "Searching for zend_is_callable occurrences:"
              Select-String `
                -Path $source.FullName `
                -Pattern "zend_is_callable" `
                -SimpleMatch

              throw "Expected exactly one old zend_is_callable call."
          }

          $content = $content.Replace($old, $new)

          Set-Content `
            -Path $source.FullName `
            -Value $content `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            -Path $source.FullName `
            -Raw

          if (-not $verify.Contains($new)) {
              throw "PHP 8.6 zend_is_callable_ex patch was not applied."
          }

          if ($verify.Contains($old)) {
              throw "Old zend_is_callable call still exists."
          }

          Write-Host ""
          Write-Host "PHP 8.6 Imagick patch applied successfully."

      # ============================================================
      # PREPARE PHP DEVELOPMENT TREE
      # ============================================================

      - name: Prepare PHP development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "PHP executable:"
          Write-Host "C:\php-bin\php.exe"

          $phpDev = "C:\php-devel"
          $phpBin = "C:\php-bin"

          $php8ts = Get-ChildItem `
            -Path $phpDev `
            -Recurse `
            -Filter "php8ts.lib" |
            Select-Object -First 1

          if (-not $php8ts) {
              throw "php8ts.lib was not found in PHP development package."
          }

          Write-Host "PHP import library:"
          Write-Host $php8ts.FullName

          # DO NOT copy the complete dev tree over PHP installation.
          # PHP 8.6 development package already contains the correct
          # libraries required for extension compilation.

          $phpConfig = Get-ChildItem `
            -Path $phpDev `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpConfig) {
              throw "phpize.bat was not found in PHP development package."
          }

          Write-Host "phpize:"
          Write-Host $phpConfig.FullName

          Write-Host ""
          Write-Host "PHP development environment READY."

      # ============================================================
      # CREATE BUILD SCRIPT
      # ============================================================

      - name: Create Imagick build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Directory |
            Select-Object -First 1

          if (-not $source) {
              throw "Imagick source root was not found."
          }

          $buildScript = @"
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          echo ========================================
          echo PHP 8.6 Imagick Build
          echo TS x64
          echo ========================================
          echo.

          set PHP_DEV_PATH=C:\php-devel
          set PHP_BIN_PATH=C:\php-bin
          set IMAGEMAGICK_PATH=C:\ImageMagick
          set IMAGICK_SOURCE=$($source.FullName)

          echo PHP_DEV_PATH=%PHP_DEV_PATH%
          echo PHP_BIN_PATH=%PHP_BIN_PATH%
          echo IMAGEMAGICK_PATH=%IMAGEMAGICK_PATH%
          echo IMAGICK_SOURCE=%IMAGICK_SOURCE%
          echo.

          if not exist "%PHP_BIN_PATH%\php.exe" (
              echo ERROR: php.exe not found.
              exit /b 1
          )

          if not exist "%PHP_DEV_PATH%" (
              echo ERROR: PHP development directory not found.
              exit /b 1
          )

          if not exist "%IMAGEMAGICK_PATH%\include\imagemagick\MagickWand\MagickWand.h" (
              echo ERROR: ImageMagick headers not found.
              exit /b 1
          )

          if not exist "%IMAGEMAGICK_PATH%\lib\imagemagick\CORE_RL_MagickWand_.lib" (
              echo ERROR: MagickWand library not found.
              exit /b 1
          )

          if not exist "%IMAGEMAGICK_PATH%\lib\imagemagick\CORE_RL_MagickCore_.lib" (
              echo ERROR: MagickCore library not found.
              exit /b 1
          )

          cd /d "%IMAGICK_SOURCE%"

          echo.
          echo ========================================
          echo Running phpize
          echo ========================================
          echo.

          call "%PHP_DEV_PATH%\phpize.bat"

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Running configure
          echo ========================================
          echo.

          call configure.bat --with-imagick=shared --with-imagick-dir="C:\ImageMagick"

          if errorlevel 1 (
              echo ERROR: configure failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Running nmake
          echo ========================================
          echo.

          nmake

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Searching for php_imagick.dll
          echo ========================================
          echo.

          dir /s /b php_imagick.dll 2>nul

          if exist "modules\php_imagick.dll" (
              echo FOUND:
              echo %CD%\modules\php_imagick.dll
              exit /b 0
          )

          if exist "Release\php_imagick.dll" (
              echo FOUND:
              echo %CD%\Release\php_imagick.dll
              exit /b 0
          )

          dir /s /b *.dll 2>nul

          echo ERROR: php_imagick.dll was not produced.
          exit /b 1

          endlocal
          "@

          Set-Content `
            -Path "C:\build-imagick.bat" `
            -Value $buildScript `
            -Encoding ASCII

          Write-Host "Build script created."

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Imagick
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64
          echo ========================================
          echo.

          call "C:\php-sdk\phpsdk-vs18-x64.bat" -t "C:\build-imagick.bat"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: Imagick build failed
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo Imagick build completed
          echo ========================================

      # ============================================================
      # COLLECT DLL
      # ============================================================

      - name: Collect php_imagick.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching for compiled php_imagick.dll..."

          $dll = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Recurse `
            -Filter "php_imagick.dll" |
            Select-Object -First 1

          if (-not $dll) {

              Write-Host ""
              Write-Host "Searching all DLL files:"
              Get-ChildItem `
                -Path "C:\imagick-source" `
                -Recurse `
                -Filter "*.dll" |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "TS php_imagick.dll was not produced."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FOUND php_imagick.dll"
          Write-Host "========================================"
          Write-Host $dll.FullName

          Copy-Item `
            -Path $dll.FullName `
            -Destination "php_imagick.dll" `
            -Force

          $size = (Get-Item "php_imagick.dll").Length

          Write-Host "DLL size: $size bytes"

          if ($size -lt 10000) {
              throw "php_imagick.dll is unexpectedly small."
          }

      # ============================================================
      # VERIFY DLL
      # ============================================================

      - name: Verify php_imagick.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "php_imagick.dll")) {
              throw "php_imagick.dll does not exist."
          }

          Write-Host "Compiled DLL:"
          Get-Item "php_imagick.dll" |
            Format-List FullName,Length,LastWriteTime

          Write-Host ""
          Write-Host "Imagick DLL successfully compiled for:"
          Write-Host "PHP 8.6.0beta1"
          Write-Host "Windows x64"
          Write-Host "VS18"
          Write-Host "Thread Safe"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload php_imagick.dll
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-3.8.1-8.6-ts-vs18-x64
          path: php_imagick.dll
          if-no-files-found: error
