name: Build Imagick PHP 8.6 VS18 x64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  IMAGICK_VERSION: "3.8.1"
  IMAGEMAGICK_VERSION: "7.1.1-47"
  PHP_SDK_VERSION: "2.7.1"

jobs:

  # ============================================================
  # BUILD THREAD SAFE
  # ============================================================

  build-ts:
    name: Build Imagick PHP 8.6 TS x64
    runs-on: windows-2025

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Download PHP TS
      # ----------------------------------------------------------

      - name: Download PHP 8.6 TS x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP TS:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-ts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-ts.zip")) {
              throw "PHP TS archive was not downloaded."
          }

          Write-Host "PHP TS downloaded."

      # ----------------------------------------------------------
      # Download PHP TS development package
      # ----------------------------------------------------------

      - name: Download PHP TS development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP development package:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel.zip")) {
              throw "PHP development package was not downloaded."
          }

          Write-Host "PHP development package downloaded."

      # ----------------------------------------------------------
      # Download ImageMagick
      # ----------------------------------------------------------

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagemagick.zip" `
            -UseBasicParsing

          if (-not (Test-Path "imagemagick.zip")) {
              throw "ImageMagick archive was not downloaded."
          }

          Write-Host "ImageMagick downloaded."

      # ----------------------------------------------------------
      # Download PHP SDK
      # ----------------------------------------------------------

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-sdk.zip")) {
              throw "PHP SDK archive was not downloaded."
          }

          Write-Host "PHP SDK downloaded."

      # ----------------------------------------------------------
      # Extract PHP runtime
      # ----------------------------------------------------------

      - name: Extract PHP runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-bin"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-ts.zip" `
            -DestinationPath $root `
            -Force

          $php = Join-Path $root "php.exe"

          if (-not (Test-Path $php)) {
              throw "PHP executable was not found at $php"
          }

          Write-Host "PHP executable:"
          Write-Host $php

          & $php -v

      # ----------------------------------------------------------
      # Extract PHP development package
      # ----------------------------------------------------------

      - name: Extract PHP development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-devel"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath $root `
            -Force

          Write-Host "PHP development package contents:"

          Get-ChildItem `
            -Path $root `
            -Recurse `
            -File |
            Select-Object -First 100 |
            ForEach-Object {
              Write-Host $_.FullName
            }

          $phpize = Get-ChildItem `
            -Path $root `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "phpize.bat was not found in PHP development package."
          }

          Write-Host ""
          Write-Host "phpize.bat:"
          Write-Host $phpize.FullName

      # ----------------------------------------------------------
      # Extract PHP SDK
      # ----------------------------------------------------------

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-sdk-extract"
          $sdk = "C:\php-sdk"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $sdk) {
              Remove-Item $sdk -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-sdk.zip" `
            -DestinationPath $extract `
            -Force

          $root = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "PHP SDK archive root was not found."
          }

          Move-Item `
            -Path $root.FullName `
            -Destination $sdk `
            -Force

          $starter = Join-Path $sdk "phpsdk-vs18-x64.bat"

          if (-not (Test-Path $starter)) {
              throw "Official PHP SDK VS18 x64 starter was not found: $starter"
          }

          Write-Host "PHP SDK:"
          Write-Host $sdk

          Write-Host ""
          Write-Host "VS18 x64 starter:"
          Write-Host $starter

      # ----------------------------------------------------------
      # Extract ImageMagick
      # ----------------------------------------------------------

      - name: Prepare ImageMagick development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $final `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagemagick.zip" `
            -DestinationPath $raw `
            -Force

          Write-Host ""
          Write-Host "Searching ImageMagick headers..."

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Where-Object {
              $_.FullName -match "\\MagickWand\\MagickWand\.h$"
            } |
            Select-Object -First 1

          if (-not $header) {
              Write-Host ""
              Write-Host "ImageMagick archive structure:"
              Get-ChildItem `
                -Path $raw `
                -Recurse `
                -File |
                Select-Object -First 200 |
                ForEach-Object {
                  Write-Host $_.FullName
                }

              throw "MagickWand.h was not found."
          }

          Write-Host "Found header:"
          Write-Host $header.FullName

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          Write-Host ""
          Write-Host "MagickWand library:"
          Write-Host $wandLib.FullName

          Write-Host ""
          Write-Host "MagickCore library:"
          Write-Host $coreLib.FullName

          $includeRoot = $header.Directory.Parent.FullName
          $libRoot = $wandLib.Directory.FullName

          New-Item `
            -ItemType Directory `
            -Path "$final\include\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\lib\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\bin" `
            -Force | Out-Null

          Copy-Item `
            -Path "$includeRoot\*" `
            -Destination "$final\include\imagemagick" `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "$final\lib\imagemagick" `
                -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination "$final\bin" `
                -Force
            }

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
              throw "Final MagickWand.h is missing."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Final MagickWand import library is missing."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Final MagickCore import library is missing."
          }

          Write-Host ""
          Write-Host "ImageMagick development environment READY."

      # ----------------------------------------------------------
      # Prepare TS source
      # ----------------------------------------------------------

      - name: Prepare Imagick 3.8.1 TS source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip"

          Write-Host "Downloading Imagick:"
          Write-Host $url

          $archive = "imagick-ts.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $archive `
            -UseBasicParsing `
            -MaximumRedirection 10

          if (-not (Test-Path $archive)) {
              throw "Imagick source archive was not downloaded."
          }

          if (Test-Path "C:\imagick-ts") {
              Remove-Item "C:\imagick-ts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\imagick-ts" `
            -Force | Out-Null

          Expand-Archive `
            -Path $archive `
            -DestinationPath "C:\imagick-ts" `
            -Force

          $sourceRoot = Get-ChildItem `
            -Path "C:\imagick-ts" `
            -Directory |
            Select-Object -First 1

          if (-not $sourceRoot) {
              throw "Imagick source root was not found."
          }

          Write-Host "Imagick source root:"
          Write-Host $sourceRoot.FullName

          $source = Join-Path $sourceRoot.FullName "imagick_class.c"

          if (-not (Test-Path $source)) {
              throw "imagick_class.c was not found."
          }

          $old = 'zend_is_callable(user_callback, 0, NULL TSRMLS_CC)'
          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          $text = Get-Content `
            -Path $source `
            -Raw

          $count = ([regex]::Matches(
            $text,
            [regex]::Escape($old)
          )).Count

          Write-Host "Occurrences of old API: $count"

          if ($count -ne 1) {
              throw "Expected exactly one old zend_is_callable occurrence, found $count."
          }

          $text = $text.Replace($old, $new)

          Set-Content `
            -Path $source `
            -Value $text `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            -Path $source `
            -Raw

          if ($verify.Contains($old)) {
              throw "Old zend_is_callable call is still present."
          }

          if (-not $verify.Contains($new)) {
              throw "New zend_is_callable_ex call was not inserted."
          }

          Write-Host ""
          Write-Host "PHP 8.6 compatibility patch applied:"
          Write-Host "zend_is_callable -> zend_is_callable_ex"

          Write-Host ""
          Write-Host "Patched source:"
          Select-String `
            -Path $source `
            -Pattern "zend_is_callable" `
            -Context 2,2

      # ----------------------------------------------------------
      # Create TS build task
      # ----------------------------------------------------------

      - name: Create TS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $phpize = Get-ChildItem `
            -Path "C:\php-devel" `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "phpize.bat was not found."
          }

          $build = @"
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          echo ========================================
          echo PHP 8.6 TS x64 / Imagick 3.8.1
          echo ========================================
          echo.

          set "PHP_DEV=%~dp0"
          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-ts"

          echo PHP development package:
          echo %PHP_DEV%
          echo.

          echo ImageMagick:
          echo %IMAGEMAGICK%
          echo.

          echo Imagick source:
          echo %SOURCE%
          echo.

          where cl
          if errorlevel 1 (
              echo ERROR: cl.exe not found.
              exit /b 1
          )

          where link
          if errorlevel 1 (
              echo ERROR: link.exe not found.
              exit /b 1
          )

          where nmake
          if errorlevel 1 (
              echo ERROR: nmake.exe not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHP development package verification
          echo ========================================

          if not exist "%PHP_DEV%\phpize.bat" (
              echo ERROR: phpize.bat missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\include\php\main\php.h" (
              echo ERROR: PHP headers missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\php8ts.lib" (
              echo ERROR: php8ts.lib missing.
              exit /b 1
          )

          echo PHP TS development package OK.
          echo.

          cd /d "%SOURCE%"
          if errorlevel 1 (
              echo ERROR: Cannot enter Imagick source directory.
              exit /b 1
          )

          echo ========================================
          echo Running phpize
          echo ========================================
          call "%PHP_DEV%\phpize.bat"
          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Running configure
          echo ========================================

          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%" --with-imagick=shared

          if errorlevel 1 (
              echo ERROR: configure failed.
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo Build configuration
          echo ========================================

          if exist Makefile (
              echo Makefile exists.
          ) else (
              echo ERROR: Makefile was not generated.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Running nmake
          echo ========================================

          nmake /nologo > nmake-ts.log 2>&1

          if errorlevel 1 (
              echo.
              echo ========================================
              echo NMAKE FAILED
              echo ========================================
              type nmake-ts.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo NMAKE SUCCESS
          echo ========================================

          echo Searching for generated DLL...

          dir /s /b php_imagick.dll 2>nul

          if not exist "php_imagick.dll" (
              for /r %%F in (php_imagick.dll) do (
                  copy /y "%%F" "%SOURCE%\php_imagick.dll" >nul
                  goto :dll_found
              )
          )

          :dll_found

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: php_imagick.dll was not produced.
              echo.
              echo Build tree:
              dir /s /b *.dll 2>nul
              echo.
              echo Object files:
              dir /s /b *.obj 2>nul
              echo.
              echo Libraries:
              dir /s /b *.lib 2>nul
              exit /b 1
          )

          echo.
          echo ========================================
          echo TS DLL FOUND
          echo ========================================
          echo %SOURCE%\php_imagick.dll

          endlocal
          exit /b 0
          "@

          Set-Content `
            -Path "C:\build-imagick-ts.bat" `
            -Value $build `
            -Encoding ASCII

          Write-Host "TS build task created."

      # ----------------------------------------------------------
      # Build TS
      # ----------------------------------------------------------

      - name: Build Imagick TS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-ts.bat

          if errorlevel 1 (
              echo ========================================
              echo TS BUILD FAILED
              echo ========================================
              exit /b 1
          )

      # ----------------------------------------------------------
      # Validate TS DLL
      # ----------------------------------------------------------

      - name: Validate TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-ts\php_imagick.dll"

          if (-not (Test-Path $dll)) {
              throw "TS php_imagick.dll was not produced."
          }

          Write-Host "TS DLL:"
          Write-Host $dll

          Get-Item $dll | Format-List FullName,Length,LastWriteTime

          $runtimeDlls = Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File

          foreach ($file in $runtimeDlls) {
              Copy-Item `
                -Path $file.FullName `
                -Destination "C:\php-bin" `
                -Force
          }

          Copy-Item `
            -Path $dll `
            -Destination "C:\php-bin\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "Testing PHP TS extension..."

          & "C:\php-bin\php.exe" `
            -n `
            -d "extension=C:\php-bin\php_imagick.dll" `
            -r "echo PHP_VERSION, PHP_EOL; echo PHP_ZTS ? 'TS' : 'NTS', PHP_EOL; echo extension_loaded('imagick') ? 'Imagick OK' : 'Imagick FAILED', PHP_EOL;"

          if ($LASTEXITCODE -ne 0) {
              throw "PHP TS failed to load php_imagick.dll."
          }

      # ----------------------------------------------------------
      # Package TS
      # ----------------------------------------------------------

      - name: Package TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\artifact-ts" `
            -Force | Out-Null

          Copy-Item `
            -Path "C:\imagick-ts\php_imagick.dll" `
            -Destination "C:\artifact-ts\php_imagick.dll" `
            -Force

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File |
            Copy-Item `
              -Destination "C:\artifact-ts" `
              -Force

          Compress-Archive `
            -Path "C:\artifact-ts\*" `
            -DestinationPath "imagick-3.8.1-php8.6-vs18-x64-ts.zip" `
            -Force

      # ----------------------------------------------------------
      # Upload TS artifact
      # ----------------------------------------------------------

      - name: Upload TS artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagick-3.8.1-php8.6-vs18-x64-ts
          path: imagick-3.8.1-php8.6-vs18-x64-ts.zip
          if-no-files-found: error


  # ============================================================
  # BUILD NON THREAD SAFE
  # ============================================================

  build-nts:
    name: Build Imagick PHP 8.6 NTS x64
    runs-on: windows-2025

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Download PHP NTS
      # ----------------------------------------------------------

      - name: Download PHP 8.6 NTS x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-nts-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP NTS:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-nts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-nts.zip")) {
              throw "PHP NTS archive was not downloaded."
          }

      # ----------------------------------------------------------
      # Download PHP NTS development package
      # ----------------------------------------------------------

      - name: Download PHP NTS development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-nts-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP NTS development package:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel-nts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel-nts.zip")) {
              throw "PHP NTS development package was not downloaded."
          }

      # ----------------------------------------------------------
      # Download ImageMagick
      # ----------------------------------------------------------

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagemagick.zip" `
            -UseBasicParsing

          if (-not (Test-Path "imagemagick.zip")) {
              throw "ImageMagick archive was not downloaded."
          }

      # ----------------------------------------------------------
      # Download PHP SDK
      # ----------------------------------------------------------

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-sdk.zip")) {
              throw "PHP SDK archive was not downloaded."
          }

      # ----------------------------------------------------------
      # Extract PHP runtime
      # ----------------------------------------------------------

      - name: Extract PHP runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-bin"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-nts.zip" `
            -DestinationPath $root `
            -Force

          if (-not (Test-Path "$root\php.exe")) {
              throw "PHP NTS executable was not found."
          }

          & "$root\php.exe" -v

      # ----------------------------------------------------------
      # Extract PHP development package
      # ----------------------------------------------------------

      - name: Extract PHP development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\php-devel"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel-nts.zip" `
            -DestinationPath $root `
            -Force

          $phpize = Get-ChildItem `
            -Path $root `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "phpize.bat was not found in NTS development package."
          }

          Write-Host "NTS phpize:"
          Write-Host $phpize.FullName

      # ----------------------------------------------------------
      # Extract PHP SDK
      # ----------------------------------------------------------

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extract = "C:\php-sdk-extract"
          $sdk = "C:\php-sdk"

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $sdk) {
              Remove-Item $sdk -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-sdk.zip" `
            -DestinationPath $extract `
            -Force

          $root = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "PHP SDK root was not found."
          }

          Move-Item `
            -Path $root.FullName `
            -Destination $sdk `
            -Force

          if (-not (Test-Path "$sdk\phpsdk-vs18-x64.bat")) {
              throw "Official PHP SDK VS18 x64 starter was not found."
          }

      # ----------------------------------------------------------
      # Prepare ImageMagick
      # ----------------------------------------------------------

      - name: Prepare ImageMagick development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\include\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\lib\imagemagick" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$final\bin" `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagemagick.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Where-Object {
              $_.FullName -match "\\MagickWand\\MagickWand\.h$"
            } |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found."
          }

          $wand = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $core = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wand) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $core) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          Copy-Item `
            -Path "$($header.Directory.Parent.FullName)\*" `
            -Destination "$final\include\imagemagick" `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
              Copy-Item `
                $_.FullName `
                "$final\lib\imagemagick" `
                -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
              Copy-Item `
                $_.FullName `
                "$final\bin" `
                -Force
            }

          if (-not (Test-Path "$final\include\imagemagick\MagickWand\MagickWand.h")) {
              throw "Final MagickWand.h is missing."
          }

          if (-not (Test-Path "$final\lib\imagemagick\CORE_RL_MagickWand_.lib")) {
              throw "Final MagickWand library is missing."
          }

          if (-not (Test-Path "$final\lib\imagemagick\CORE_RL_MagickCore_.lib")) {
              throw "Final MagickCore library is missing."
          }

      # ----------------------------------------------------------
      # Prepare NTS source + patch
      # ----------------------------------------------------------

      - name: Prepare Imagick 3.8.1 NTS source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "imagick-nts.zip" `
            -UseBasicParsing `
            -MaximumRedirection 10

          if (-not (Test-Path "imagick-nts.zip")) {
              throw "Imagick source archive was not downloaded."
          }

          if (Test-Path "C:\imagick-nts") {
              Remove-Item "C:\imagick-nts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\imagick-nts" `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagick-nts.zip" `
            -DestinationPath "C:\imagick-nts" `
            -Force

          $root = Get-ChildItem `
            -Path "C:\imagick-nts" `
            -Directory |
            Select-Object -First 1

          if (-not $root) {
              throw "Imagick source root was not found."
          }

          $source = Join-Path $root.FullName "imagick_class.c"

          if (-not (Test-Path $source)) {
              throw "imagick_class.c was not found."
          }

          $old = 'zend_is_callable(user_callback, 0, NULL TSRMLS_CC)'
          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          $text = Get-Content `
            $source `
            -Raw

          $count = ([regex]::Matches(
            $text,
            [regex]::Escape($old)
          )).Count

          if ($count -ne 1) {
              throw "Expected exactly one old zend_is_callable occurrence, found $count."
          }

          $text = $text.Replace($old, $new)

          Set-Content `
            -Path $source `
            -Value $text `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            $source `
            -Raw

          if ($verify.Contains($old)) {
              throw "Old zend_is_callable call remains."
          }

          if (-not $verify.Contains($new)) {
              throw "zend_is_callable_ex patch was not applied."
          }

          Select-String `
            -Path $source `
            -Pattern "zend_is_callable" `
            -Context 2,2

      # ----------------------------------------------------------
      # Create NTS build task
      # ----------------------------------------------------------

      - name: Create NTS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = @"
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          echo ========================================
          echo PHP 8.6 NTS x64 / Imagick 3.8.1
          echo ========================================

          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-nts"

          where cl
          if errorlevel 1 exit /b 1

          where link
          if errorlevel 1 exit /b 1

          where nmake
          if errorlevel 1 exit /b 1

          if not exist "%PHP_DEV%\phpize.bat" (
              echo ERROR: phpize.bat missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\include\php\main\php.h" (
              echo ERROR: PHP headers missing.
              exit /b 1
          )

          if not exist "%PHP_DEV%\php8.lib" (
              if not exist "%PHP_DEV%\php8nts.lib" (
                  echo ERROR: PHP NTS import library not found.
                  dir /s /b "%PHP_DEV%\*.lib"
                  exit /b 1
              )
          )

          cd /d "%SOURCE%"
          if errorlevel 1 exit /b 1

          echo ========================================
          echo PHPIZE
          echo ========================================

          call "%PHP_DEV%\phpize.bat"
          if errorlevel 1 (
              echo PHPIZE FAILED
              exit /b 1
          )

          echo ========================================
          echo CONFIGURE
          echo ========================================

          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%" --with-imagick=shared

          if errorlevel 1 (
              echo CONFIGURE FAILED
              if exist config.log type config.log
              exit /b 1
          )

          if not exist Makefile (
              echo ERROR: Makefile missing.
              exit /b 1
          )

          echo ========================================
          echo NMAKE
          echo ========================================

          nmake /nologo > nmake-nts.log 2>&1

          if errorlevel 1 (
              echo ========================================
              echo NMAKE FAILED
              echo ========================================
              type nmake-nts.log
              exit /b 1
          )

          echo ========================================
          echo SEARCHING GENERATED DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          for /r %%F in (php_imagick.dll) do (
              copy /y "%%F" "%SOURCE%\php_imagick.dll" >nul
              goto :dll_found
          )

          :dll_found

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: php_imagick.dll was not produced.
              echo.
              echo DLL:
              dir /s /b *.dll 2>nul
              echo.
              echo OBJ:
              dir /s /b *.obj 2>nul
              echo.
              echo LIB:
              dir /s /b *.lib 2>nul
              exit /b 1
          )

          echo ========================================
          echo NTS DLL FOUND
          echo ========================================
          echo %SOURCE%\php_imagick.dll

          endlocal
          exit /b 0
          "@

          Set-Content `
            -Path "C:\build-imagick-nts.bat" `
            -Value $build `
            -Encoding ASCII

      # ----------------------------------------------------------
      # Build NTS
      # ----------------------------------------------------------

      - name: Build Imagick NTS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-nts.bat

          if errorlevel 1 (
              echo ========================================
              echo NTS BUILD FAILED
              echo ========================================
              exit /b 1
          )

      # ----------------------------------------------------------
      # Validate NTS
      # ----------------------------------------------------------

      - name: Validate NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-nts\php_imagick.dll"

          if (-not (Test-Path $dll)) {
              throw "NTS php_imagick.dll was not produced."
          }

          Write-Host "NTS DLL:"
          Write-Host $dll

          Get-Item $dll | Format-List FullName,Length,LastWriteTime

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File |
            Copy-Item `
              -Destination "C:\php-bin" `
              -Force

          Copy-Item `
            -Path $dll `
            -Destination "C:\php-bin\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "Testing PHP NTS extension..."

          & "C:\php-bin\php.exe" `
            -n `
            -d "extension=C:\php-bin\php_imagick.dll" `
            -r "echo PHP_VERSION, PHP_EOL; echo PHP_ZTS ? 'TS' : 'NTS', PHP_EOL; echo extension_loaded('imagick') ? 'Imagick OK' : 'Imagick FAILED', PHP_EOL;"

          if ($LASTEXITCODE -ne 0) {
              throw "PHP NTS failed to load php_imagick.dll."
          }

      # ----------------------------------------------------------
      # Package NTS
      # ----------------------------------------------------------

      - name: Package NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\artifact-nts" `
            -Force | Out-Null

          Copy-Item `
            -Path "C:\imagick-nts\php_imagick.dll" `
            -Destination "C:\artifact-nts\php_imagick.dll" `
            -Force

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" `
            -File |
            Copy-Item `
              -Destination "C:\artifact-nts" `
              -Force

          Compress-Archive `
            -Path "C:\artifact-nts\*" `
            -DestinationPath "imagick-3.8.1-php8.6-vs18-x64-nts.zip" `
            -Force

      # ----------------------------------------------------------
      # Upload NTS artifact
      # ----------------------------------------------------------

      - name: Upload NTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagick-3.8.1-php8.6-vs18-x64-nts
          path: imagick-3.8.1-php8.6-vs18-x64-nts.zip
          if-no-files-found: error
