name: Build imagick.dll for PHP 8.6.0beta1 (x64, TS/NTS)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false

      matrix:
        include:
          - ts: ts
            bin_suffix: ""
          - ts: nts
            bin_suffix: "-nts"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # IMAGICK SOURCE
      # ============================================================

      - name: Clone upstream imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone --depth 1 https://github.com/Imagick/imagick.git C:\imagick-src

          if (-not (Test-Path "C:\imagick-src\config.w32")) {
              Write-Host "ERROR: imagick source was not downloaded correctly."
              exit 1
          }

          Write-Host "Imagick source downloaded successfully."


      # ============================================================
      # PHP 8.6 COMPATIBILITY PATCH
      # ============================================================

      - name: Apply PHP 8.6 compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\imagick-src\imagick_class.c"

          if (-not (Test-Path $file)) {
              Write-Host "ERROR: imagick_class.c not found."
              exit 1
          }

          $content = Get-Content $file -Raw

          $old = 'zend_is_callable(user_callback, 0, NULL TSRMLS_CC)'
          $new = 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)'

          if ($content.Contains($old)) {

              $content = $content.Replace($old, $new)

              Set-Content `
                -Path $file `
                -Value $content `
                -Encoding utf8NoBOM

              Write-Host "PHP 8.6 compatibility patch applied."

          }
          elseif ($content.Contains($new)) {

              Write-Host "PHP 8.6 compatibility patch already present."

          }
          else {

              Write-Host "ERROR: Expected zend_is_callable() code was not found."
              exit 1
          }


      # ============================================================
      # DOWNLOAD DEPENDENCIES
      # ============================================================

      - name: Download PHP and build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          function Download-File {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Url,

                  [Parameter(Mandatory = $true)]
                  [string]$OutFile
              )

              $maxRetries = 6

              for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {

                  try {

                      Write-Host ""
                      Write-Host "Downloading:"
                      Write-Host $Url
                      Write-Host "Attempt $attempt/$maxRetries"

                      Invoke-WebRequest `
                        -Uri $Url `
                        -OutFile $OutFile `
                        -UseBasicParsing `
                        -TimeoutSec 300

                      if ((Test-Path $OutFile) -and ((Get-Item $OutFile).Length -gt 0)) {
                          Write-Host "Download successful."
                          return
                      }

                      throw "Downloaded file is missing or empty."

                  }
                  catch {

                      Write-Host "Download failed:"
                      Write-Host $_.Exception.Message

                      if ($attempt -eq $maxRetries) {
                          throw "Failed to download $Url after $maxRetries attempts."
                      }

                      $delay = 10 * $attempt

                      Write-Host "Waiting $delay seconds before retry..."
                      Start-Sleep -Seconds $delay
                  }
              }
          }

          # ----------------------------------------------------------
          # PHP 8.6.0beta1
          # ----------------------------------------------------------

          $phpUrl = "https://downloads.php.net/~windows/qa/php-8.6.0beta1${{ matrix.bin_suffix }}-Win32-vs18-x64.zip"

          Download-File `
            -Url $phpUrl `
            -OutFile "php-bin.zip"


          # ----------------------------------------------------------
          # PHP DEVELOPMENT PACK
          # ----------------------------------------------------------

          $develUrl = "https://downloads.php.net/~windows/qa/php-devel-pack-8.6.0beta1-Win32-vs18-x64.zip"

          Download-File `
            -Url $develUrl `
            -OutFile "php-devel.zip"


          # ----------------------------------------------------------
          # IMAGEMAGICK
          #
          # Official PHP dependency package.
          # PHP currently provides the ImageMagick dependency as VS17.
          # The PHP extension itself is built with the PHP VS18 SDK.
          # ----------------------------------------------------------

          $imageMagickUrl = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-7.1.1-47-vs17-x64.zip"

          Download-File `
            -Url $imageMagickUrl `
            -OutFile "im.zip"


          # ----------------------------------------------------------
          # PHP SDK 2.8.3
          # ----------------------------------------------------------

          $sdkUrl = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-2.8.3.zip"

          Download-File `
            -Url $sdkUrl `
            -OutFile "sdk.zip"


          Write-Host ""
          Write-Host "All dependencies downloaded successfully."


      # ============================================================
      # EXTRACT PHP
      # ============================================================

      - name: Extract PHP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin") {
              Remove-Item "C:\php-bin" -Recurse -Force
          }

          Expand-Archive `
            -Path "php-bin.zip" `
            -DestinationPath "C:\php-bin" `
            -Force

          if (-not (Test-Path "C:\php-bin\php.exe")) {
              Write-Host "ERROR: php.exe was not found."
              Get-ChildItem "C:\php-bin" -Recurse | Select-Object -First 50
              exit 1
          }

          Write-Host "PHP extracted successfully."


      # ============================================================
      # EXTRACT PHP DEVELOPMENT PACK
      # ============================================================

      - name: Extract PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel") {
              Remove-Item "C:\php-devel" -Recurse -Force
          }

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath "C:\php-devel" `
            -Force

          $phpdevDir = Get-ChildItem "C:\php-devel" -Directory |
            Select-Object -First 1

          if (-not $phpdevDir) {
              Write-Host "ERROR: PHP development directory was not found."
              exit 1
          }

          Write-Host "PHP development directory:"
          Write-Host $phpdevDir.FullName


      # ============================================================
      # EXTRACT IMAGEMAGICK
      # ============================================================

      - name: Extract ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\ImageMagick") {
              Remove-Item "C:\ImageMagick" -Recurse -Force
          }

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath "C:\ImageMagick" `
            -Force

          Write-Host "Checking ImageMagick development files..."

          $header = "C:\ImageMagick\include\imagemagick\MagickWand\MagickWand.h"
          $wandLib = "C:\ImageMagick\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $coreLib = "C:\ImageMagick\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $header)) {
              Write-Host "ERROR: ImageMagick header not found:"
              Write-Host $header
              exit 1
          }

          if (-not (Test-Path $wandLib)) {
              Write-Host "ERROR: ImageMagick MagickWand library not found:"
              Write-Host $wandLib
              exit 1
          }

          if (-not (Test-Path $coreLib)) {
              Write-Host "ERROR: ImageMagick MagickCore library not found:"
              Write-Host $coreLib
              exit 1
          }

          Write-Host "ImageMagick development files are OK."


      # ============================================================
      # EXTRACT PHP SDK 2.8.3
      # ============================================================

      - name: Extract PHP SDK 2.8.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-sdk") {
              Remove-Item "C:\php-sdk" -Recurse -Force
          }

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath "C:\" `
            -Force

          $sdkRoot = "C:\php-sdk-binary-tools-php-sdk-2.8.3"

          if (-not (Test-Path $sdkRoot)) {
              Write-Host "ERROR: PHP SDK 2.8.3 directory not found."

              Get-ChildItem "C:\" -Directory |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              exit 1
          }

          Rename-Item `
            -Path $sdkRoot `
            -NewName "php-sdk"

          Write-Host "PHP SDK installed at C:\php-sdk"


      # ============================================================
      # VERIFY PHP SDK
      # ============================================================

      - name: Verify PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdk = "C:\php-sdk"

          $starter = "$sdk\phpsdk-vs18-x64.bat"
          $bison = "$sdk\msys2\usr\bin\bison.exe"
          $re2c = "$sdk\msys2\usr\bin\re2c.exe"

          if (-not (Test-Path $starter)) {
              Write-Host "ERROR: phpsdk-vs18-x64.bat not found."
              exit 1
          }

          if (-not (Test-Path $bison)) {
              Write-Host "ERROR: bison.exe not found."
              exit 1
          }

          if (-not (Test-Path $re2c)) {
              Write-Host "ERROR: re2c.exe not found."
              exit 1
          }

          Write-Host ""
          Write-Host "PHP SDK starter:"
          Write-Host $starter

          Write-Host ""
          Write-Host "Bison:"
          & $bison --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Bison failed."
              exit 1
          }

          Write-Host ""
          Write-Host "re2c:"
          & $re2c --version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: re2c failed."
              exit 1
          }

          Write-Host ""
          Write-Host "PHP SDK 2.8.3 VS18 x64 is ready."


      # ============================================================
      # PREPARE PHP DEVELOPMENT TREE
      # ============================================================

      - name: Prepare PHP development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $phpdevDir = Get-ChildItem "C:\php-devel" -Directory |
            Select-Object -First 1

          if (-not $phpdevDir) {
              Write-Host "ERROR: PHP development directory not found."
              exit 1
          }

          $phpdevPath = $phpdevDir.FullName

          Write-Host "PHP development path:"
          Write-Host $phpdevPath

          $imagickDir = "$phpdevPath\ext\imagick"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $imagickDir | Out-Null

          Write-Host "Copying Imagick source..."

          Copy-Item `
            -Path "C:\imagick-src\*" `
            -Destination $imagickDir `
            -Recurse `
            -Force

          Write-Host "Copying PHP executable..."

          Copy-Item `
            -Path "C:\php-bin\php.exe" `
            -Destination "$phpdevPath\php.exe" `
            -Force

          Write-Host "Copying PHP DLL files..."

          Copy-Item `
            -Path "C:\php-bin\*.dll" `
            -Destination $phpdevPath `
            -Force

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PHP_DEV_PATH=$phpdevPath"

          Write-Host "PHP development environment prepared."


      # ============================================================
      # CREATE BUILD TASK
      # ============================================================

      - name: Create SDK build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildScript = @"
          @echo off
          setlocal

          echo ========================================
          echo PHP SDK VS18 x64 - Imagick
          echo ========================================

          echo PHP_DEV_PATH=%PHP_DEV_PATH%
          echo.

          echo ========================================
          echo Verify build tools
          echo ========================================

          where cl
          if errorlevel 1 (
              echo ERROR: Visual C++ compiler not found.
              exit /b 1
          )

          where link
          if errorlevel 1 (
              echo ERROR: linker not found.
              exit /b 1
          )

          where nmake
          if errorlevel 1 (
              echo ERROR: nmake not found.
              exit /b 1
          )

          where bison
          if errorlevel 1 (
              echo ERROR: bison not found.
              exit /b 1
          )

          where re2c
          if errorlevel 1 (
              echo ERROR: re2c not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHP version
          echo ========================================

          cd /d "%PHP_DEV_PATH%"

          php.exe -v

          if errorlevel 1 (
              echo ERROR: PHP executable failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Enter imagick source
          echo ========================================

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          if not exist "config.w32" (
              echo ERROR: config.w32 not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call phpize.bat

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure imagick
          echo ========================================
          echo.
          echo IMPORTANT:
          echo Using --with-imagick=C:\ImageMagick
          echo.

          set "PATH=C:\ImageMagick\bin;%PATH%"

          call configure.bat --with-imagick=C:\ImageMagick

          if errorlevel 1 (
              echo ERROR: configure failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Verify Imagick was enabled
          echo ========================================

          findstr /i /c:"php_imagick.dll" Makefile

          if errorlevel 1 (
              echo ERROR: php_imagick.dll is NOT present in Makefile.
              echo.
              echo This means Imagick was not enabled by configure.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Build php_imagick.dll
          echo ========================================

          nmake php_imagick.dll

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Search build output
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          if errorlevel 1 (
              echo ERROR: php_imagick.dll was not found after nmake.
              exit /b 1
          )

          echo.
          echo ========================================
          echo BUILD SUCCESS
          echo ========================================

          endlocal
          exit /b 0
          "@

          $buildScriptPath = "C:\build-imagick.bat"

          Set-Content `
            -Path $buildScriptPath `
            -Value $buildScript `
            -Encoding ASCII

          Write-Host "Build task created:"
          Write-Host $buildScriptPath


      # ============================================================
      # BUILD USING OFFICIAL PHP SDK VS18
      # ============================================================

      - name: Build imagick with PHP SDK VS18
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick.bat

          if errorlevel 1 (
              echo ERROR: imagick build failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo imagick build completed successfully
          echo ========================================


      # ============================================================
      # COLLECT DLL
      # ============================================================

      - name: Collect built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "out" | Out-Null

          Write-Host "Searching for php_imagick.dll..."

          $dll = Get-ChildItem `
            -Path "C:\php-devel" `
            -Recurse `
            -Filter "php_imagick.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $dll) {

              Write-Host ""
              Write-Host "ERROR: php_imagick.dll was not produced."
              Write-Host ""

              Write-Host "Searching build directories..."

              Get-ChildItem `
                -Path "C:\php-devel" `
                -Directory `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Name -like "Release*"
                } |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              Write-Host ""
              Write-Host "All DLL files:"

              Get-ChildItem `
                -Path "C:\php-devel" `
                -Recurse `
                -Filter "*.dll" `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              exit 1
          }

          Write-Host ""
          Write-Host "FOUND:"
          Write-Host $dll.FullName
          Write-Host "Size: $($dll.Length) bytes"

          Copy-Item `
            -Path $dll.FullName `
            -Destination "out\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "DLL copied to:"
          Write-Host "out\php_imagick.dll"


      # ============================================================
      # VERIFY DLL
      # ============================================================

      - name: Verify built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "out\php_imagick.dll"

          if (-not (Test-Path $dll)) {
              Write-Host "ERROR: Output DLL does not exist."
              exit 1
          }

          $file = Get-Item $dll

          Write-Host "========================================"
          Write-Host "Built DLL"
          Write-Host "========================================"

          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 10000) {
              Write-Host "ERROR: DLL is suspiciously small."
              exit 1
          }

          Write-Host ""
          Write-Host "DLL verification passed."


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-8.6.0beta1-x64-${{ matrix.ts }}
          path: out\php_imagick.dll
          if-no-files-found: error
