name: Build Imagick for PHP 8.6

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  PHP_SDK_VERSION: "2.8.3"
  IMAGICK_VERSION: "3.8.1"
  IMAGEMAGICK_VERSION: "7.1.1-47"

jobs:

  # ============================================================
  # THREAD SAFE
  # ============================================================

  build-ts:
    name: Build Imagick PHP 8.6 TS x64
    runs-on: windows-2022

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # DOWNLOAD PHP DEVELOPMENT PACK
      # --------------------------------------------------------

      - name: Download PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP development pack:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel.zip")) {
              throw "PHP development pack was not downloaded."
          }

          Write-Host "PHP development pack downloaded."

      # --------------------------------------------------------
      # DOWNLOAD PHP BINARY
      # --------------------------------------------------------

      - name: Download PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP binary:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-bin.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-bin.zip")) {
              throw "PHP binary was not downloaded."
          }

          Write-Host "PHP binary downloaded."

      # --------------------------------------------------------
      # DOWNLOAD IMAGEMAGICK
      # --------------------------------------------------------

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "im.zip" `
            -UseBasicParsing

          if (-not (Test-Path "im.zip")) {
              throw "ImageMagick package was not downloaded."
          }

          Write-Host "ImageMagick downloaded."

      # --------------------------------------------------------
      # DOWNLOAD PHP SDK
      # --------------------------------------------------------

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "sdk.zip")) {
              throw "PHP SDK was not downloaded."
          }

          Write-Host "PHP SDK downloaded."

      # --------------------------------------------------------
      # EXTRACT PHP BINARY
      # --------------------------------------------------------

      - name: Extract PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin") {
              Remove-Item "C:\php-bin" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-bin" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-bin.zip" `
            -DestinationPath "C:\php-bin" `
            -Force

          $php = Get-ChildItem `
            -Path "C:\php-bin" `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $php) {
              throw "php.exe was not found."
          }

          Write-Host "PHP executable:"
          Write-Host $php.FullName

          Copy-Item `
            -Path "$($php.Directory.FullName)\*" `
            -Destination "C:\php-bin" `
            -Recurse `
            -Force

          if (-not (Test-Path "C:\php-bin\php.exe")) {
              throw "Normalized PHP binary was not created."
          }

      # --------------------------------------------------------
      # EXTRACT PHP DEVELOPMENT PACK
      # --------------------------------------------------------

      - name: Extract PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel") {
              Remove-Item "C:\php-devel" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath "C:\php-devel" `
            -Force

          $root = Get-ChildItem `
            -Path "C:\php-devel" `
            -Directory |
            Select-Object -First 1

          if ($root) {
              $items = Get-ChildItem `
                -Path $root.FullName `
                -Force

              Copy-Item `
                -Path "$($root.FullName)\*" `
                -Destination "C:\php-devel" `
                -Recurse `
                -Force
          }

          Write-Host "PHP development path:"
          Write-Host "C:\php-devel"

          if (-not (Test-Path "C:\php-devel\phpize.bat")) {
              throw "phpize.bat was not found."
          }

          if (-not (Test-Path "C:\php-devel\configure.bat")) {
              throw "configure.bat was not found."
          }

          Write-Host "PHP development environment found."

      # --------------------------------------------------------
      # EXTRACT PHP SDK
      # --------------------------------------------------------

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extractRoot = "C:\php-sdk-extract"
          $sdkRoot = "C:\php-sdk"

          if (Test-Path $extractRoot) {
              Remove-Item $extractRoot -Recurse -Force
          }

          if (Test-Path $sdkRoot) {
              Remove-Item $sdkRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath $extractRoot `
            -Force

          Write-Host ""
          Write-Host "Searching PHP SDK..."

          $starter = Get-ChildItem `
            -Path $extractRoot `
            -Recurse `
            -Filter "phpsdk-vs18-x64.bat" |
            Select-Object -First 1

          if (-not $starter) {
              Write-Host ""
              Write-Host "Available PHP SDK starter scripts:"

              Get-ChildItem `
                -Path $extractRoot `
                -Recurse `
                -Filter "phpsdk-*.bat" |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "phpsdk-vs18-x64.bat was not found."
          }

          $sdkActualRoot = $starter.Directory.FullName

          Write-Host ""
          Write-Host "PHP SDK starter:"
          Write-Host $starter.FullName

          New-Item `
            -ItemType Directory `
            -Path $sdkRoot `
            -Force | Out-Null

          Copy-Item `
            -Path "$sdkActualRoot\*" `
            -Destination $sdkRoot `
            -Recurse `
            -Force

          $finalStarter = Join-Path `
            $sdkRoot `
            "phpsdk-vs18-x64.bat"

          if (-not (Test-Path $finalStarter)) {
              throw "PHP SDK was not normalized correctly."
          }

          Write-Host ""
          Write-Host "PHP SDK READY:"
          Write-Host $finalStarter

      # --------------------------------------------------------
      # EXTRACT IMAGEMAGICK DEVELOPMENT FILES
      # --------------------------------------------------------

      - name: Prepare ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found in ImageMagick package."
          }

          Write-Host "Found ImageMagick header:"
          Write-Host $header.FullName

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          $includeSource = $header.Directory.Parent.FullName
          $libSource = $wandLib.Directory.FullName

          $targetInclude = "$final\include\imagemagick"
          $targetLib = "$final\lib\imagemagick"
          $targetBin = "$final\bin"

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetLib `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetBin `
            -Force | Out-Null

          Copy-Item `
            -Path "$includeSource\*" `
            -Destination $targetInclude `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            Copy-Item `
              -Destination $targetLib `
              -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            Copy-Item `
              -Destination $targetBin `
              -Force

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
              throw "Final ImageMagick header is missing."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Final ImageMagick MagickWand library is missing."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Final ImageMagick MagickCore library is missing."
          }

          Write-Host ""
          Write-Host "ImageMagick READY."
          Write-Host $finalHeader
          Write-Host $finalWand
          Write-Host $finalCore

      # --------------------------------------------------------
      # PREPARE IMAGICK SOURCE
      # --------------------------------------------------------

      - name: Prepare Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel\ext\imagick") {
              Remove-Item `
                "C:\php-devel\ext\imagick" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel\ext\imagick" `
            -Force | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip" `
            -OutFile "imagick.zip" `
            -UseBasicParsing

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath "C:\imagick-source" `
            -Force

          $sourceRoot = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Directory |
            Select-Object -First 1

          if (-not $sourceRoot) {
              throw "Imagick source root was not found."
          }

          Copy-Item `
            -Path "$($sourceRoot.FullName)\*" `
            -Destination "C:\php-devel\ext\imagick" `
            -Recurse `
            -Force

          if (-not (Test-Path "C:\php-devel\ext\imagick\config.w32")) {
              throw "Imagick config.w32 was not found."
          }

          if (-not (Test-Path "C:\php-devel\ext\imagick\imagick_class.c")) {
              throw "imagick_class.c was not found."
          }

          Write-Host "Imagick $env:IMAGICK_VERSION source READY."

      # --------------------------------------------------------
      # APPLY ONLY PHP 8.6 FIX
      # --------------------------------------------------------

      - name: Patch zend_is_callable for PHP 8.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\php-devel\ext\imagick\imagick_class.c"

          $old = 'if (!user_callback || !zend_is_callable(user_callback, 0, NULL TSRMLS_CC)) {'

          $new = 'if (!user_callback || !zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)) {'

          $content = Get-Content `
            -Path $file `
            -Raw

          $count = ([regex]::Matches(
            $content,
            [regex]::Escape($old)
          )).Count

          Write-Host "Original PHP 8.5 call occurrences: $count"

          if ($count -ne 1) {
              Write-Host ""
              Write-Host "Searching zend_is_callable occurrences:"
              Select-String `
                -Path $file `
                -Pattern "zend_is_callable" |
                ForEach-Object {
                    Write-Host "$($_.LineNumber): $($_.Line)"
                }

              throw "Expected exactly one target zend_is_callable call."
          }

          $content = $content.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            -Path $file `
            -Raw

          if (-not $verify.Contains($new)) {
              throw "PHP 8.6 zend_is_callable_ex patch was not applied."
          }

          if ($verify.Contains($old)) {
              throw "Old zend_is_callable call still exists."
          }

          Write-Host ""
          Write-Host "PHP 8.6 Imagick patch applied:"
          Write-Host $new

      # --------------------------------------------------------
      # CREATE TS BUILD SCRIPT
      # --------------------------------------------------------

      - name: Create TS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          @echo off
          setlocal EnableExtensions

          echo ========================================
          echo PHP 8.6 Imagick 3.8.1 TS x64
          echo ========================================
          echo.

          set PHP_DEV_PATH=C:\php-devel
          set IMAGEMAGICK_ROOT=C:\ImageMagick

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          echo PHP:
          C:\php-bin\php.exe -v

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call "%PHP_DEV_PATH%\phpize.bat"
          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure
          echo ========================================

          call "%PHP_DEV_PATH%\configure.bat" --with-imagick=shared --with-imagick-dir=C:\ImageMagick
          if errorlevel 1 (
              echo ERROR: configure failed.
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo nmake
          echo ========================================

          nmake /nologo
          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Searching generated DLL
          echo ========================================

          dir /s /b *.dll 2>nul

          if not exist "php_imagick.dll" (
              echo ERROR: php_imagick.dll was not produced in source root.
              exit /b 1
          )

          echo.
          echo TS build completed successfully.
          echo DLL:
          echo %CD%\php_imagick.dll

          endlocal
          exit /b 0
          '@

          Set-Content `
            -Path "C:\build-imagick-ts.bat" `
            -Value $script `
            -Encoding ASCII

          Write-Host "TS build script created."

      # --------------------------------------------------------
      # BUILD TS THROUGH PHP SDK
      # --------------------------------------------------------

      - name: Build TS
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64 TS
          echo ========================================
          echo.

          if not exist "C:\php-sdk\phpsdk-vs18-x64.bat" (
              echo ERROR: PHP SDK starter does not exist.
              dir /s /b "C:\php-sdk\phpsdk-*.bat"
              exit /b 1
          )

          call "C:\php-sdk\phpsdk-vs18-x64.bat" -t "C:\build-imagick-ts.bat"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: TS Imagick build failed
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo TS Imagick build completed
          echo ========================================

      # --------------------------------------------------------
      # COLLECT TS DLL
      # --------------------------------------------------------

      - name: Collect TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "C:\php-devel\ext\imagick\php_imagick.dll"

          if (-not (Test-Path $source)) {
              Write-Host "Searching for generated TS DLL:"
              Get-ChildItem `
                -Path "C:\php-devel\ext\imagick" `
                -Recurse `
                -Filter "php_imagick.dll" |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "TS php_imagick.dll was not produced."
          }

          New-Item `
            -ItemType Directory `
            -Path "dist\ts" `
            -Force | Out-Null

          Copy-Item `
            -Path $source `
            -Destination "dist\ts\php_imagick.dll" `
            -Force

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" |
            Copy-Item `
              -Destination "dist\ts" `
              -Force

          Write-Host "TS DLL collected."

      # ========================================================
      # NTS
      # ========================================================

      - name: Reset source for NTS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceZip = "imagick.zip"

          if (Test-Path "C:\php-devel\ext\imagick") {
              Remove-Item `
                "C:\php-devel\ext\imagick" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel\ext\imagick" `
            -Force | Out-Null

          if (Test-Path "C:\imagick-source") {
              Remove-Item `
                "C:\imagick-source" `
                -Recurse `
                -Force
          }

          Expand-Archive `
            -Path $sourceZip `
            -DestinationPath "C:\imagick-source" `
            -Force

          $sourceRoot = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Directory |
            Select-Object -First 1

          if (-not $sourceRoot) {
              throw "Imagick source root was not found."
          }

          Copy-Item `
            -Path "$($sourceRoot.FullName)\*" `
            -Destination "C:\php-devel\ext\imagick" `
            -Recurse `
            -Force

          Write-Host "Fresh Imagick source restored for NTS."

      # --------------------------------------------------------
      # APPLY PHP 8.6 FIX AGAIN
      # --------------------------------------------------------

      - name: Patch NTS zend_is_callable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\php-devel\ext\imagick\imagick_class.c"

          $old = 'if (!user_callback || !zend_is_callable(user_callback, 0, NULL TSRMLS_CC)) {'

          $new = 'if (!user_callback || !zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)) {'

          $content = Get-Content `
            -Path $file `
            -Raw

          $count = ([regex]::Matches(
            $content,
            [regex]::Escape($old)
          )).Count

          if ($count -ne 1) {
              throw "Expected exactly one target zend_is_callable call in NTS source. Found: $count"
          }

          $content = $content.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            -Path $file `
            -Raw

          if (-not $verify.Contains($new)) {
              throw "NTS PHP 8.6 patch failed."
          }

          if ($verify.Contains($old)) {
              throw "NTS old zend_is_callable call still exists."
          }

          Write-Host "NTS PHP 8.6 patch applied."

      # --------------------------------------------------------
      # CREATE NTS BUILD SCRIPT
      # --------------------------------------------------------

      - name: Create NTS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          @echo off
          setlocal EnableExtensions

          echo ========================================
          echo PHP 8.6 Imagick 3.8.1 NTS x64
          echo ========================================
          echo.

          set PHP_DEV_PATH=C:\php-devel

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call "%PHP_DEV_PATH%\phpize.bat"
          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure NTS
          echo ========================================

          call "%PHP_DEV_PATH%\configure.bat" --with-imagick=shared --with-imagick-dir=C:\ImageMagick --disable-zts
          if errorlevel 1 (
              echo ERROR: configure failed.
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo nmake NTS
          echo ========================================

          nmake /nologo
          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Searching generated DLL
          echo ========================================

          dir /s /b *.dll 2>nul

          if not exist "php_imagick.dll" (
              echo ERROR: php_imagick.dll was not produced in source root.
              exit /b 1
          )

          echo.
          echo NTS build completed successfully.
          echo DLL:
          echo %CD%\php_imagick.dll

          endlocal
          exit /b 0
          '@

          Set-Content `
            -Path "C:\build-imagick-nts.bat" `
            -Value $script `
            -Encoding ASCII

          Write-Host "NTS build script created."

      # --------------------------------------------------------
      # BUILD NTS
      # --------------------------------------------------------

      - name: Build NTS
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64 NTS
          echo ========================================
          echo.

          if not exist "C:\php-sdk\phpsdk-vs18-x64.bat" (
              echo ERROR: PHP SDK starter does not exist.
              dir /s /b "C:\php-sdk\phpsdk-*.bat"
              exit /b 1
          )

          call "C:\php-sdk\phpsdk-vs18-x64.bat" -t "C:\build-imagick-nts.bat"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: NTS Imagick build failed
              echo ========================================
              exit /b 1
          )

          echo.
          echo ========================================
          echo NTS Imagick build completed
          echo ========================================

      # --------------------------------------------------------
      # COLLECT NTS DLL
      # --------------------------------------------------------

      - name: Collect NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "C:\php-devel\ext\imagick\php_imagick.dll"

          if (-not (Test-Path $source)) {
              Write-Host "Searching for generated NTS DLL:"
              Get-ChildItem `
                -Path "C:\php-devel\ext\imagick" `
                -Recurse `
                -Filter "php_imagick.dll" |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "NTS php_imagick.dll was not produced."
          }

          New-Item `
            -ItemType Directory `
            -Path "dist\nts" `
            -Force | Out-Null

          Copy-Item `
            -Path $source `
            -Destination "dist\nts\php_imagick.dll" `
            -Force

          Get-ChildItem `
            -Path "C:\ImageMagick\bin" `
            -Filter "*.dll" |
            Copy-Item `
              -Destination "dist\nts" `
              -Force

          Write-Host "NTS DLL collected."

      # --------------------------------------------------------
      # VERIFY DLLS
      # --------------------------------------------------------

      - name: Verify final DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL BUILD ARTIFACTS"
          Write-Host "========================================"

          $ts = "dist\ts\php_imagick.dll"
          $nts = "dist\nts\php_imagick.dll"

          if (-not (Test-Path $ts)) {
              throw "Final TS DLL missing."
          }

          if (-not (Test-Path $nts)) {
              throw "Final NTS DLL missing."
          }

          Write-Host ""
          Write-Host "TS:"
          Get-Item $ts | Format-List FullName,Length

          Write-Host ""
          Write-Host "NTS:"
          Get-Item $nts | Format-List FullName,Length

          Write-Host ""
          Write-Host "Build SUCCESS."

      # --------------------------------------------------------
      # ZIP TS
      # --------------------------------------------------------

      - name: Package TS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "dist\ts\*" `
            -DestinationPath "php_imagick-$env:IMAGICK_VERSION-8.6-ts-vs18-x64.zip" `
            -Force

      # --------------------------------------------------------
      # ZIP NTS
      # --------------------------------------------------------

      - name: Package NTS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "dist\nts\*" `
            -DestinationPath "php_imagick-$env:IMAGICK_VERSION-8.6-nts-vs18-x64.zip" `
            -Force

      # --------------------------------------------------------
      # UPLOAD
      # --------------------------------------------------------

      - name: Upload TS artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-3.8.1-8.6-ts-vs18-x64
          path: php_imagick-3.8.1-8.6-ts-vs18-x64.zip
          if-no-files-found: error

      - name: Upload NTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-3.8.1-8.6-nts-vs18-x64
          path: php_imagick-3.8.1-8.6-nts-vs18-x64.zip
          if-no-files-found: error
