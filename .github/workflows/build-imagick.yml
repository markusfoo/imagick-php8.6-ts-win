name: Build Imagick for PHP 8.6

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  PHP_SDK_VERSION: "2.8.3"
  IMAGICK_VERSION: "3.8.1"
  IMAGEMAGICK_VERSION: "7.1.1-47"

jobs:

  # ============================================================
  # THREAD SAFE
  # ============================================================

  build-ts:

    name: Build Imagick PHP 8.6 TS x64

    runs-on: windows-2022

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # DOWNLOAD PHP TS DEVELOPMENT PACK
      # --------------------------------------------------------

      - name: Download PHP TS development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP TS development pack:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel-ts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel-ts.zip")) {
              throw "PHP TS development pack was not downloaded."
          }

          Write-Host "PHP TS development pack downloaded."


      # --------------------------------------------------------
      # DOWNLOAD PHP TS BINARY
      # --------------------------------------------------------

      - name: Download PHP TS binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP TS binary:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-ts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-ts.zip")) {
              throw "PHP TS binary was not downloaded."
          }

          Write-Host "PHP TS binary downloaded."


      # --------------------------------------------------------
      # DOWNLOAD IMAGEMAGICK
      # --------------------------------------------------------

      - name: Download ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "im.zip" `
            -UseBasicParsing

          if (-not (Test-Path "im.zip")) {
              throw "ImageMagick package was not downloaded."
          }

          Write-Host "ImageMagick downloaded."


      # --------------------------------------------------------
      # DOWNLOAD PHP SDK
      # --------------------------------------------------------

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "sdk.zip" `
            -UseBasicParsing

          if (-not (Test-Path "sdk.zip")) {
              throw "PHP SDK was not downloaded."
          }

          Write-Host "PHP SDK downloaded."


      # --------------------------------------------------------
      # EXTRACT PHP TS BINARY
      # --------------------------------------------------------

      - name: Extract PHP TS binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-ts") {
              Remove-Item "C:\php-ts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-ts" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-ts.zip" `
            -DestinationPath "C:\php-ts" `
            -Force

          $php = Get-ChildItem `
            -Path "C:\php-ts" `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $php) {
              throw "PHP TS php.exe was not found."
          }

          if ($php.Directory.FullName -ne "C:\php-ts") {
              Copy-Item `
                -Path "$($php.Directory.FullName)\*" `
                -Destination "C:\php-ts" `
                -Recurse `
                -Force
          }

          if (-not (Test-Path "C:\php-ts\php.exe")) {
              throw "PHP TS php.exe was not normalized."
          }

          Write-Host "PHP TS executable:"
          Write-Host "C:\php-ts\php.exe"

          & "C:\php-ts\php.exe" -v


      # --------------------------------------------------------
      # EXTRACT PHP TS DEVELOPMENT PACK
      # --------------------------------------------------------

      - name: Extract PHP TS development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel-ts") {
              Remove-Item "C:\php-devel-ts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel-ts" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel-ts.zip" `
            -DestinationPath "C:\php-devel-ts" `
            -Force

          $phpize = Get-ChildItem `
            -Path "C:\php-devel-ts" `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "PHP TS phpize.bat was not found."
          }

          $root = $phpize.Directory.FullName

          if ($root -ne "C:\php-devel-ts") {
              Copy-Item `
                -Path "$root\*" `
                -Destination "C:\php-devel-ts" `
                -Recurse `
                -Force
          }

          if (-not (Test-Path "C:\php-devel-ts\phpize.bat")) {
              throw "PHP TS phpize.bat was not normalized."
          }

          if (-not (Test-Path "C:\php-devel-ts\configure.bat")) {
              throw "PHP TS configure.bat was not found."
          }

          if (-not (Test-Path "C:\php-devel-ts\php8ts.lib")) {
              throw "PHP TS php8ts.lib was not found."
          }

          Write-Host "PHP TS development environment READY."


      # --------------------------------------------------------
      # EXTRACT PHP SDK
      # --------------------------------------------------------

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extractRoot = "C:\php-sdk-extract"
          $sdkRoot = "C:\php-sdk"

          if (Test-Path $extractRoot) {
              Remove-Item $extractRoot -Recurse -Force
          }

          if (Test-Path $sdkRoot) {
              Remove-Item $sdkRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath $extractRoot `
            -Force

          $starter = Get-ChildItem `
            -Path $extractRoot `
            -Recurse `
            -Filter "phpsdk-vs18-x64.bat" |
            Select-Object -First 1

          if (-not $starter) {
              Write-Host "Available SDK starters:"
              Get-ChildItem `
                -Path $extractRoot `
                -Recurse `
                -Filter "phpsdk-*.bat" |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "phpsdk-vs18-x64.bat was not found."
          }

          $sdkActualRoot = $starter.Directory.FullName

          New-Item `
            -ItemType Directory `
            -Path $sdkRoot `
            -Force | Out-Null

          Copy-Item `
            -Path "$sdkActualRoot\*" `
            -Destination $sdkRoot `
            -Recurse `
            -Force

          $finalStarter = "C:\php-sdk\phpsdk-vs18-x64.bat"

          if (-not (Test-Path $finalStarter)) {
              throw "PHP SDK was not normalized correctly."
          }

          Write-Host "PHP SDK READY:"
          Write-Host $finalStarter


      # --------------------------------------------------------
      # PREPARE IMAGEMAGICK
      # --------------------------------------------------------

      - name: Prepare ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath $raw `
            -Force

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found."
          }

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          $includeSource = $header.Directory.Parent.FullName

          $targetInclude = "$final\include\imagemagick"
          $targetLib = "$final\lib\imagemagick"
          $targetBin = "$final\bin"

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetLib `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetBin `
            -Force | Out-Null

          Copy-Item `
            -Path "$includeSource\*" `
            -Destination $targetInclude `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
                Copy-Item `
                  -Path $_.FullName `
                  -Destination $targetLib `
                  -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
                Copy-Item `
                  -Path $_.FullName `
                  -Destination $targetBin `
                  -Force
            }

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
              throw "Final ImageMagick header is missing."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Final ImageMagick MagickWand library is missing."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Final ImageMagick MagickCore library is missing."
          }

          Write-Host ""
          Write-Host "ImageMagick READY."
          Write-Host $finalHeader
          Write-Host $finalWand
          Write-Host $finalCore


      # --------------------------------------------------------
      # PREPARE IMAGICK SOURCE
      # --------------------------------------------------------

      - name: Prepare Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\imagick-source") {
              Remove-Item `
                "C:\imagick-source" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\imagick-source" `
            -Force | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip" `
            -OutFile "imagick.zip" `
            -UseBasicParsing

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath "C:\imagick-source" `
            -Force

          $sourceRoot = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Directory |
            Select-Object -First 1

          if (-not $sourceRoot) {
              throw "Imagick source root was not found."
          }

          Write-Host "Imagick source:"
          Write-Host $sourceRoot.FullName


      # ========================================================
      # BUILD TS
      # ========================================================

      - name: Prepare TS source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel-ts\ext\imagick") {
              Remove-Item `
                "C:\php-devel-ts\ext\imagick" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel-ts\ext\imagick" `
            -Force | Out-Null

          $sourceRoot = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Directory |
            Select-Object -First 1

          Copy-Item `
            -Path "$($sourceRoot.FullName)\*" `
            -Destination "C:\php-devel-ts\ext\imagick" `
            -Recurse `
            -Force

          if (-not (Test-Path "C:\php-devel-ts\ext\imagick\imagick_class.c")) {
              throw "TS imagick_class.c was not found."
          }

          Write-Host "TS Imagick source READY."


      # --------------------------------------------------------
      # APPLY ONLY PHP 8.6 FIX - TS
      # --------------------------------------------------------

      - name: Patch TS zend_is_callable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\php-devel-ts\ext\imagick\imagick_class.c"

          $old = 'if (!user_callback || !zend_is_callable(user_callback, 0, NULL TSRMLS_CC)) {'
          $new = 'if (!user_callback || !zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)) {'

          $content = Get-Content `
            -Path $file `
            -Raw

          $count = ([regex]::Matches(
            $content,
            [regex]::Escape($old)
          )).Count

          if ($count -ne 1) {
              throw "TS: expected exactly one zend_is_callable target. Found $count."
          }

          $content = $content.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            -Path $file `
            -Raw

          if (-not $verify.Contains($new)) {
              throw "TS PHP 8.6 patch failed."
          }

          if ($verify.Contains($old)) {
              throw "TS old zend_is_callable call still exists."
          }

          Write-Host "TS PHP 8.6 patch applied."


      # --------------------------------------------------------
      # CREATE TS BUILD SCRIPT
      # --------------------------------------------------------

      - name: Create TS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          @echo off
          setlocal EnableExtensions

          echo ========================================
          echo PHP 8.6 Imagick 3.8.1 TS x64
          echo ========================================

          set PHP_DEV_PATH=C:\php-devel-ts
          set PATH=C:\php-ts;%PATH%

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          echo.
          echo PHP:
          C:\php-ts\php.exe -v

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call "%PHP_DEV_PATH%\phpize.bat"

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure TS
          echo ========================================

          call "%PHP_DEV_PATH%\configure.bat" --with-imagick=shared --with-imagick-dir=C:\ImageMagick

          if errorlevel 1 (
              echo ERROR: configure failed.
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo nmake TS
          echo ========================================

          nmake /nologo

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo SEARCHING FOR PHP_IMAGICK.DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          if not exist "php_imagick.dll" (
              echo ERROR: php_imagick.dll was not produced.
              exit /b 1
          )

          echo.
          echo TS BUILD SUCCESS.
          echo DLL:
          echo %CD%\php_imagick.dll

          endlocal
          exit /b 0
          '@

          Set-Content `
            -Path "C:\build-imagick-ts.bat" `
            -Value $script `
            -Encoding ASCII

          Write-Host "TS build script created."


      # --------------------------------------------------------
      # BUILD TS
      # --------------------------------------------------------

      - name: Build TS
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64 TS
          echo ========================================

          if not exist "C:\php-sdk\phpsdk-vs18-x64.bat" (
              echo ERROR: PHP SDK starter does not exist.
              exit /b 1
          )

          call "C:\php-sdk\phpsdk-vs18-x64.bat" -t "C:\build-imagick-ts.bat"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: TS Imagick build failed
              echo ========================================
              exit /b 1
          )

          echo.
          echo TS Imagick build completed.


      # --------------------------------------------------------
      # COLLECT TS DLL
      # --------------------------------------------------------

      - name: Collect TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = Get-ChildItem `
            -Path "C:\php-devel-ts\ext\imagick" `
            -Recurse `
            -Filter "php_imagick.dll" |
            Select-Object -First 1

          if (-not $dll) {
              throw "TS php_imagick.dll was not produced."
          }

          New-Item `
            -ItemType Directory `
            -Path "dist\ts" `
            -Force | Out-Null

          Copy-Item `
            -Path $dll.FullName `
            -Destination "dist\ts\php_imagick.dll" `
            -Force

          Write-Host "TS DLL:"
          Write-Host $dll.FullName


      # ========================================================
      # NTS
      # ========================================================

      # --------------------------------------------------------
      # DOWNLOAD PHP NTS DEVELOPMENT PACK
      # --------------------------------------------------------

      - name: Download PHP NTS development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-$env:PHP_VERSION-nts-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP NTS development pack:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-devel-nts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-devel-nts.zip")) {
              throw "PHP NTS development pack was not downloaded."
          }

          Write-Host "PHP NTS development pack downloaded."


      # --------------------------------------------------------
      # DOWNLOAD PHP NTS BINARY
      # --------------------------------------------------------

      - name: Download PHP NTS binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-nts-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP NTS binary:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "php-nts.zip" `
            -UseBasicParsing

          if (-not (Test-Path "php-nts.zip")) {
              throw "PHP NTS binary was not downloaded."
          }

          Write-Host "PHP NTS binary downloaded."


      # --------------------------------------------------------
      # EXTRACT PHP NTS BINARY
      # --------------------------------------------------------

      - name: Extract PHP NTS binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-nts") {
              Remove-Item "C:\php-nts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-nts" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-nts.zip" `
            -DestinationPath "C:\php-nts" `
            -Force

          $php = Get-ChildItem `
            -Path "C:\php-nts" `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $php) {
              throw "PHP NTS php.exe was not found."
          }

          if ($php.Directory.FullName -ne "C:\php-nts") {
              Copy-Item `
                -Path "$($php.Directory.FullName)\*" `
                -Destination "C:\php-nts" `
                -Recurse `
                -Force
          }

          if (-not (Test-Path "C:\php-nts\php.exe")) {
              throw "PHP NTS php.exe was not normalized."
          }

          Write-Host "PHP NTS executable:"
          Write-Host "C:\php-nts\php.exe"

          & "C:\php-nts\php.exe" -v


      # --------------------------------------------------------
      # EXTRACT PHP NTS DEVELOPMENT PACK
      # --------------------------------------------------------

      - name: Extract PHP NTS development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel-nts") {
              Remove-Item "C:\php-devel-nts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel-nts" `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-devel-nts.zip" `
            -DestinationPath "C:\php-devel-nts" `
            -Force

          $phpize = Get-ChildItem `
            -Path "C:\php-devel-nts" `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "PHP NTS phpize.bat was not found."
          }

          $root = $phpize.Directory.FullName

          if ($root -ne "C:\php-devel-nts") {
              Copy-Item `
                -Path "$root\*" `
                -Destination "C:\php-devel-nts" `
                -Recurse `
                -Force
          }

          if (-not (Test-Path "C:\php-devel-nts\phpize.bat")) {
              throw "PHP NTS phpize.bat was not normalized."
          }

          if (-not (Test-Path "C:\php-devel-nts\configure.bat")) {
              throw "PHP NTS configure.bat was not found."
          }

          if (-not (Test-Path "C:\php-devel-nts\php8.lib")) {
              Write-Host "WARNING: php8.lib was not found at expected path."
          }

          Write-Host "PHP NTS development environment READY."


      # --------------------------------------------------------
      # PREPARE NTS SOURCE
      # --------------------------------------------------------

      - name: Prepare NTS source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel-nts\ext\imagick") {
              Remove-Item `
                "C:\php-devel-nts\ext\imagick" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\php-devel-nts\ext\imagick" `
            -Force | Out-Null

          $sourceRoot = Get-ChildItem `
            -Path "C:\imagick-source" `
            -Directory |
            Select-Object -First 1

          Copy-Item `
            -Path "$($sourceRoot.FullName)\*" `
            -Destination "C:\php-devel-nts\ext\imagick" `
            -Recurse `
            -Force

          if (-not (Test-Path "C:\php-devel-nts\ext\imagick\imagick_class.c")) {
              throw "NTS imagick_class.c was not found."
          }

          Write-Host "NTS Imagick source READY."


      # --------------------------------------------------------
      # APPLY ONLY PHP 8.6 FIX - NTS
      # --------------------------------------------------------

      - name: Patch NTS zend_is_callable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\php-devel-nts\ext\imagick\imagick_class.c"

          $old = 'if (!user_callback || !zend_is_callable(user_callback, 0, NULL TSRMLS_CC)) {'
          $new = 'if (!user_callback || !zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)) {'

          $content = Get-Content `
            -Path $file `
            -Raw

          $count = ([regex]::Matches(
            $content,
            [regex]::Escape($old)
          )).Count

          if ($count -ne 1) {
              throw "NTS: expected exactly one zend_is_callable target. Found $count."
          }

          $content = $content.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8 `
            -NoNewline

          $verify = Get-Content `
            -Path $file `
            -Raw

          if (-not $verify.Contains($new)) {
              throw "NTS PHP 8.6 patch failed."
          }

          if ($verify.Contains($old)) {
              throw "NTS old zend_is_callable call still exists."
          }

          Write-Host "NTS PHP 8.6 patch applied."


      # --------------------------------------------------------
      # CREATE NTS BUILD SCRIPT
      # --------------------------------------------------------

      - name: Create NTS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          @echo off
          setlocal EnableExtensions

          echo ========================================
          echo PHP 8.6 Imagick 3.8.1 NTS x64
          echo ========================================

          set PHP_DEV_PATH=C:\php-devel-nts
          set PATH=C:\php-nts;%PATH%

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          echo.
          echo PHP:
          C:\php-nts\php.exe -v

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call "%PHP_DEV_PATH%\phpize.bat"

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure NTS
          echo ========================================

          call "%PHP_DEV_PATH%\configure.bat" --with-imagick=shared --with-imagick-dir=C:\ImageMagick --disable-zts

          if errorlevel 1 (
              echo ERROR: configure failed.
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo nmake NTS
          echo ========================================

          nmake /nologo

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo SEARCHING FOR PHP_IMAGICK.DLL
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          if not exist "php_imagick.dll" (
              echo ERROR: php_imagick.dll was not produced.
              exit /b 1
          )

          echo.
          echo NTS BUILD SUCCESS.
          echo DLL:
          echo %CD%\php_imagick.dll

          endlocal
          exit /b 0
          '@

          Set-Content `
            -Path "C:\build-imagick-nts.bat" `
            -Value $script `
            -Encoding ASCII

          Write-Host "NTS build script created."


      # --------------------------------------------------------
      # BUILD NTS
      # --------------------------------------------------------

      - name: Build NTS
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64 NTS
          echo ========================================

          if not exist "C:\php-sdk\phpsdk-vs18-x64.bat" (
              echo ERROR: PHP SDK starter does not exist.
              exit /b 1
          )

          call "C:\php-sdk\phpsdk-vs18-x64.bat" -t "C:\build-imagick-nts.bat"

          if errorlevel 1 (
              echo.
              echo ========================================
              echo ERROR: NTS Imagick build failed
              echo ========================================
              exit /b 1
          )

          echo.
          echo NTS Imagick build completed.


      # --------------------------------------------------------
      # COLLECT NTS DLL
      # --------------------------------------------------------

      - name: Collect NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = Get-ChildItem `
            -Path "C:\php-devel-nts\ext\imagick" `
            -Recurse `
            -Filter "php_imagick.dll" |
            Select-Object -First 1

          if (-not $dll) {
              throw "NTS php_imagick.dll was not produced."
          }

          New-Item `
            -ItemType Directory `
            -Path "dist\nts" `
            -Force | Out-Null

          Copy-Item `
            -Path $dll.FullName `
            -Destination "dist\nts\php_imagick.dll" `
            -Force

          Write-Host "NTS DLL:"
          Write-Host $dll.FullName


      # ========================================================
      # FINAL VERIFICATION
      # ========================================================

      - name: Verify final DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL BUILD ARTIFACTS"
          Write-Host "========================================"

          $ts = "dist\ts\php_imagick.dll"
          $nts = "dist\nts\php_imagick.dll"

          if (-not (Test-Path $ts)) {
              throw "Final TS DLL missing."
          }

          if (-not (Test-Path $nts)) {
              throw "Final NTS DLL missing."
          }

          Write-Host ""
          Write-Host "TS:"
          Get-Item $ts |
            Format-List FullName,Length

          Write-Host ""
          Write-Host "NTS:"
          Get-Item $nts |
            Format-List FullName,Length

          Write-Host ""
          Write-Host "Build SUCCESS."


      # --------------------------------------------------------
      # PACKAGE TS
      # --------------------------------------------------------

      - name: Package TS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "dist\ts\php_imagick.dll" `
            -DestinationPath "php_imagick-$env:IMAGICK_VERSION-8.6-ts-vs18-x64.zip" `
            -Force


      # --------------------------------------------------------
      # PACKAGE NTS
      # --------------------------------------------------------

      - name: Package NTS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "dist\nts\php_imagick.dll" `
            -DestinationPath "php_imagick-$env:IMAGICK_VERSION-8.6-nts-vs18-x64.zip" `
            -Force


      # --------------------------------------------------------
      # UPLOAD TS
      # --------------------------------------------------------

      - name: Upload TS artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-3.8.1-8.6-ts-vs18-x64
          path: php_imagick-3.8.1-8.6-ts-vs18-x64.zip
          if-no-files-found: error


      # --------------------------------------------------------
      # UPLOAD NTS
      # --------------------------------------------------------

      - name: Upload NTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-3.8.1-8.6-nts-vs18-x64
          path: php_imagick-3.8.1-8.6-nts-vs18-x64.zip
          if-no-files-found: error
