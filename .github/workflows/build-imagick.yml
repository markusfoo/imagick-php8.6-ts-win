name: Build imagick.dll for PHP 8.6.0beta1 (x64, TS/NTS)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ts: ts, bin_suffix: '', configure_flag: '--enable-snapshot-ts' }
          - { ts: nts, bin_suffix: '-nts', configure_flag: '--disable-zts' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone upstream imagick source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Imagick/imagick.git C:\imagick-src

      - name: Apply zend_is_callable_ex patch
        shell: pwsh
        run: |
          $file = "C:\imagick-src\imagick_class.c"
          (Get-Content $file) -replace 'zend_is_callable\(user_callback, 0, NULL TSRMLS_CC\)', 'zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)' | Set-Content $file
          Write-Host "Patch applied successfully."

      - name: Download dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binUrl = "https://downloads.php.net/~windows/qa/php-8.6.0beta1${{ matrix.bin_suffix }}-Win32-vs18-x64.zip"
          $develUrl = "https://downloads.php.net/~windows/qa/php-devel-pack-8.6.0beta1-Win32-vs18-x64.zip"

          Write-Host "Downloading PHP Binary from: $binUrl"
          Invoke-WebRequest -Uri $binUrl -OutFile php-bin.zip -UseBasicParsing

          Write-Host "Downloading PHP Devel Pack from: $develUrl"
          Invoke-WebRequest -Uri $develUrl -OutFile php-devel.zip -UseBasicParsing

          Write-Host "Downloading ImageMagick dependencies..."
          Invoke-WebRequest -Uri "https://downloads.php.net/~windows/pecl/deps/ImageMagick-7.1.1-47-vs17-x64.zip" -OutFile im.zip -UseBasicParsing

          Write-Host "Downloading PHP SDK binary tools (with retries)..."
          $retries = 3

          for ($i = 1; $i -le $retries; $i++) {
            try {
              Invoke-WebRequest -Uri "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip" -OutFile sdk.zip -UseBasicParsing
              break
            } catch {
              Write-Host "Attempt $i failed. Retrying in 10 seconds..."
              Start-Sleep -Seconds 10
            }
          }

          if (-not (Test-Path "sdk.zip")) {
            Write-Host "ERROR: Failed to download PHP SDK binary tools."
            exit 1
          }

      - name: Extract dependencies
        shell: pwsh
        run: |
          Expand-Archive php-bin.zip -DestinationPath C:\php-bin
          Expand-Archive php-devel.zip -DestinationPath C:\php-devel
          Expand-Archive im.zip -DestinationPath C:\ImageMagick
          Expand-Archive sdk.zip -DestinationPath C:\

          Rename-Item "C:\php-sdk-binary-tools-master" "C:\php-sdk" -ErrorAction SilentlyContinue

      - name: Set up build environment
        shell: pwsh
        run: |
          $phpdevDir = Get-ChildItem "C:\php-devel" -Directory | Select-Object -First 1
          $phpdevPath = $phpdevDir.FullName

          Write-Host "PHP Dev directory: $phpdevPath"

          # Copy imagick source to ext/imagick
          $imagickDir = "$phpdevPath\ext\imagick"
          New-Item -ItemType Directory -Force -Path $imagickDir
          Copy-Item -Recurse -Force "C:\imagick-src\*" $imagickDir

          # Copy PHP binary files to the devel-pack root
          Copy-Item "C:\php-bin\php.exe" "$phpdevPath\" -Force
          Copy-Item "C:\php-bin\*.dll" "$phpdevPath\" -Force

          # Save the path for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "PHP_DEV_PATH=$phpdevPath"

      - name: Build with phpize / configure / nmake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          set PHP_SDK_DIR=C:\php-sdk
          set IMAGICK_DIR=C:\ImageMagick

          REM Search recursively for bison.exe inside php-sdk
          REM It is normally located in msys2\usr\bin
          set BISON_DIR=

          for /r "C:\php-sdk" %%F in (bison.exe) do (
            set BISON_DIR=%%~dpF
            goto :found_bison
          )

          :found_bison

          if "%BISON_DIR%"=="" (
            echo ERROR: bison.exe not found in C:\php-sdk
            exit /b 1
          )

          echo Found bison at: %BISON_DIR%

          REM Add PHP, SDK bin, and bison directories to PATH
          set PATH=%PHP_DEV_PATH%;C:\php-sdk\bin;%BISON_DIR%;%PATH%

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          echo Running phpize...
          call phpize.bat

          echo Running configure...
          call configure.bat --with-imagick=shared --with-imagick-dir=C:\ImageMagick ${{ matrix.configure_flag }}

          echo Running nmake...
          nmake

      - name: Collect built DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out

          $dll = Get-ChildItem -Recurse -Filter "php_imagick.dll" | Select-Object -First 1

          if ($dll) {
            Copy-Item $dll.FullName -Destination out\
            Write-Host "Found DLL: $($dll.FullName)"
          } else {
            Write-Host "ERROR: php_imagick.dll not found"
            Get-ChildItem -Recurse -Filter "*.dll" | ForEach-Object {
              Write-Host $_.FullName
            }
            exit 1
          }

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-8.6.0beta1-x64-${{ matrix.ts }}
          path: out\php_imagick.dll
