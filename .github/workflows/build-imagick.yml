name: Build imagick.dll for PHP 8.6.0beta1 (x64, TS/NTS)

on:
  workflow_dispatch:

env:
  PHP_VERSION: "8.6.0beta1"
  PHP_SDK_VERSION: "2.8.3"
  IMAGEMAGICK_VERSION: "7.1.1-47"

jobs:
  build:
    name: Build ${{ matrix.ts }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - ts: ts
            bin_suffix: ""
            php_dll: "php8ts.dll"
          - ts: nts
            bin_suffix: "-nts"
            php_dll: "php8.dll"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # GET IMAGICK SOURCE
      # ============================================================

      - name: Clone Imagick source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\imagick-src") {
              Remove-Item "C:\imagick-src" -Recurse -Force
          }

          git clone --depth 1 https://github.com/Imagick/imagick.git C:\imagick-src

          if (-not (Test-Path "C:\imagick-src\config.w32")) {
              throw "Imagick source was not downloaded correctly."
          }

          if (-not (Test-Path "C:\imagick-src\imagick_class.c")) {
              throw "imagick_class.c was not found."
          }

          Write-Host "Imagick source downloaded successfully."


      # ============================================================
      # PHP 8.6 PATCH
      # ============================================================

      - name: Apply PHP 8.6 compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "C:\imagick-src\imagick_class.c"

          $content = Get-Content $file -Raw

          $old = "zend_is_callable(user_callback, 0, NULL TSRMLS_CC)"
          $new = "zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)"

          if ($content.Contains($old)) {

              $content = $content.Replace($old, $new)

              Set-Content `
                -Path $file `
                -Value $content `
                -NoNewline `
                -Encoding UTF8

              Write-Host "PHP 8.6 compatibility patch applied."

          }
          elseif ($content.Contains("zend_is_callable_ex(user_callback")) {

              Write-Host "PHP 8.6 compatibility patch already present."

          }
          else {

              throw "Could not find zend_is_callable() call that needs the PHP 8.6 patch."

          }

          Write-Host ""
          Write-Host "Checking patched source..."

          Select-String `
            -Path $file `
            -Pattern "zend_is_callable_ex" `
            -SimpleMatch


      # ============================================================
      # DOWNLOAD HELPER
      # ============================================================

      - name: Create download helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $helper = @'
          function Download-File {
              param(
                  [Parameter(Mandatory=$true)]
                  [string]$Url,

                  [Parameter(Mandatory=$true)]
                  [string]$OutFile,

                  [int]$MaxAttempts = 6
              )

              $ProgressPreference = "SilentlyContinue"

              for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {

                  Write-Host ""
                  Write-Host "Download attempt $attempt/$MaxAttempts"
                  Write-Host $Url

                  try {

                      if (Test-Path $OutFile) {
                          Remove-Item $OutFile -Force
                      }

                      Invoke-WebRequest `
                        -Uri $Url `
                        -OutFile $OutFile `
                        -UseBasicParsing `
                        -TimeoutSec 600 `
                        -ErrorAction Stop

                      if (Test-Path $OutFile) {

                          $size = (Get-Item $OutFile).Length

                          if ($size -gt 0) {
                              Write-Host "Download successful: $OutFile"
                              Write-Host "Size: $size bytes"
                              return
                          }
                      }

                      throw "Downloaded file is empty."

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Download failed:"
                      Write-Host $_.Exception.Message

                      if ($attempt -lt $MaxAttempts) {

                          $delay = 10 * $attempt

                          Write-Host "Retrying in $delay seconds..."
                          Start-Sleep -Seconds $delay

                      }
                  }
              }

              throw "Download failed after $MaxAttempts attempts: $Url"
          }
          '@

          Set-Content `
            -Path "C:\download-helper.ps1" `
            -Value $helper `
            -Encoding UTF8

          Write-Host "Download helper created."


      # ============================================================
      # DOWNLOAD PHP
      # ============================================================

      - name: Download PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          . "C:\download-helper.ps1"

          $suffix = "${{ matrix.bin_suffix }}"

          $url = "https://downloads.php.net/~windows/qa/php-${{ env.PHP_VERSION }}${suffix}-Win32-vs18-x64.zip"

          Download-File `
            -Url $url `
            -OutFile "php-bin.zip"

          Write-Host "PHP binary downloaded."


      # ============================================================
      # DOWNLOAD PHP DEVELOPMENT PACK
      # ============================================================

      - name: Download PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          . "C:\download-helper.ps1"

          $suffix = "${{ matrix.bin_suffix }}"

          $url = "https://downloads.php.net/~windows/qa/php-devel-pack-${{ env.PHP_VERSION }}${suffix}-Win32-vs18-x64.zip"

          Download-File `
            -Url $url `
            -OutFile "php-devel.zip"

          Write-Host "PHP development pack downloaded."


      # ============================================================
      # DOWNLOAD IMAGEMAGICK
      # ============================================================

      - name: Download ImageMagick dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          . "C:\download-helper.ps1"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-${{ env.IMAGEMAGICK_VERSION }}-vs17-x64.zip"

          Download-File `
            -Url $url `
            -OutFile "im.zip"

          Write-Host "ImageMagick dependencies downloaded."


      # ============================================================
      # DOWNLOAD PHP SDK
      # ============================================================

      - name: Download PHP SDK 2.8.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          . "C:\download-helper.ps1"

          # IMPORTANT:
          # Correct URL uses https://, NOT https\://
          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-${{ env.PHP_SDK_VERSION }}.zip"

          Download-File `
            -Url $url `
            -OutFile "sdk.zip"

          Write-Host "PHP SDK 2.8.3 downloaded."


      # ============================================================
      # EXTRACT PHP
      # ============================================================

      - name: Extract PHP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin") {
              Remove-Item "C:\php-bin" -Recurse -Force
          }

          Expand-Archive `
            -Path "php-bin.zip" `
            -DestinationPath "C:\php-bin" `
            -Force

          $phpExe = Get-ChildItem `
            -Path "C:\php-bin" `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $phpExe) {
              throw "php.exe was not found after extracting PHP."
          }

          Write-Host "PHP executable:"
          Write-Host $phpExe.FullName


      # ============================================================
      # EXTRACT PHP DEVELOPMENT PACK
      # ============================================================

      - name: Extract PHP development pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-devel") {
              Remove-Item "C:\php-devel" -Recurse -Force
          }

          Expand-Archive `
            -Path "php-devel.zip" `
            -DestinationPath "C:\php-devel" `
            -Force

          $phpize = Get-ChildItem `
            -Path "C:\php-devel" `
            -Recurse `
            -Filter "phpize.bat" |
            Select-Object -First 1

          if (-not $phpize) {
              throw "phpize.bat was not found in PHP development pack."
          }

          $phpDevPath = $phpize.Directory.Parent.FullName

          Write-Host "PHP development directory:"
          Write-Host $phpDevPath

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PHP_DEV_PATH=$phpDevPath"


      # ============================================================
      # EXTRACT AND NORMALIZE IMAGEMAGICK
      # ============================================================

      - name: Extract ImageMagick
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\ImageMagickRaw") {
              Remove-Item "C:\ImageMagickRaw" -Recurse -Force
          }

          if (Test-Path "C:\ImageMagick") {
              Remove-Item "C:\ImageMagick" -Recurse -Force
          }

          Expand-Archive `
            -Path "im.zip" `
            -DestinationPath "C:\ImageMagickRaw" `
            -Force

          Write-Host ""
          Write-Host "Searching for MagickWand.h..."

          $header = Get-ChildItem `
            -Path "C:\ImageMagickRaw" `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          if (-not $header) {
              throw "MagickWand.h was not found anywhere inside ImageMagick archive."
          }

          Write-Host "Found:"
          Write-Host $header.FullName

          # MagickWand.h should be:
          # ...\MagickWand\MagickWand.h
          #
          # The parent of MagickWand is the ImageMagick include root.

          $magickIncludeRoot = $header.Directory.Parent.FullName

          Write-Host ""
          Write-Host "ImageMagick include root:"
          Write-Host $magickIncludeRoot

          $targetInclude = "C:\ImageMagick\include\imagemagick"
          $targetLib = "C:\ImageMagick\lib\imagemagick"
          $targetBin = "C:\ImageMagick\bin"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $targetInclude | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $targetLib | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $targetBin | Out-Null

          # Copy ImageMagick headers into the layout expected by
          # imagick/config.w32.

          Copy-Item `
            -Path "$magickIncludeRoot\*" `
            -Destination $targetInclude `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Searching for ImageMagick libraries..."

          $wandLib = Get-ChildItem `
            -Path "C:\ImageMagickRaw" `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path "C:\ImageMagickRaw" `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          Write-Host "MagickWand library:"
          Write-Host $wandLib.FullName

          Write-Host "MagickCore library:"
          Write-Host $coreLib.FullName

          # Copy every ImageMagick import/static library into the
          # exact directory expected by config.w32.

          Get-ChildItem `
            -Path "C:\ImageMagickRaw" `
            -Recurse `
            -Filter "*.lib" |
            Copy-Item `
              -Destination $targetLib `
              -Force

          # Copy runtime DLLs as well.
          # This does not affect compilation, but makes the artifact
          # environment easier to inspect/use.

          Get-ChildItem `
            -Path "C:\ImageMagickRaw" `
            -Recurse `
            -Filter "*.dll" |
            Copy-Item `
              -Destination $targetBin `
              -Force

          $finalHeader = "C:\ImageMagick\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "C:\ImageMagick\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "C:\ImageMagick\lib\imagemagick\CORE_RL_MagickCore_.lib"

          Write-Host ""
          Write-Host "Verifying normalized ImageMagick layout..."

          if (-not (Test-Path $finalHeader)) {
              throw "Normalized MagickWand.h was not created."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Normalized MagickWand library was not created."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Normalized MagickCore library was not created."
          }

          Write-Host ""
          Write-Host "ImageMagick development files are READY."
          Write-Host ""
          Write-Host "Header:"
          Write-Host $finalHeader
          Write-Host ""
          Write-Host "MagickWand:"
          Write-Host $finalWand
          Write-Host ""
          Write-Host "MagickCore:"
          Write-Host $finalCore


      # ============================================================
      # EXTRACT PHP SDK
      # ============================================================

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-sdk") {
              Remove-Item "C:\php-sdk" -Recurse -Force
          }

          Expand-Archive `
            -Path "sdk.zip" `
            -DestinationPath "C:\" `
            -Force

          $sdkRoot = "C:\php-sdk-binary-tools-php-sdk-${{ env.PHP_SDK_VERSION }}"

          if (-not (Test-Path $sdkRoot)) {
              throw "PHP SDK directory was not found: $sdkRoot"
          }

          Rename-Item `
            -Path $sdkRoot `
            -NewName "php-sdk"

          Write-Host "PHP SDK installed at C:\php-sdk"


      # ============================================================
      # VERIFY PHP SDK
      # ============================================================

      - name: Verify PHP SDK VS18 tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdk = "C:\php-sdk"

          $starter = "$sdk\phpsdk-vs18-x64.bat"
          $bison = "$sdk\msys2\usr\bin\bison.exe"
          $re2c = "$sdk\msys2\usr\bin\re2c.exe"

          Write-Host "Checking PHP SDK..."

          if (-not (Test-Path $starter)) {
              throw "phpsdk-vs18-x64.bat not found."
          }

          if (-not (Test-Path $bison)) {
              throw "bison.exe not found in PHP SDK."
          }

          if (-not (Test-Path $re2c)) {
              throw "re2c.exe not found in PHP SDK."
          }

          Write-Host ""
          Write-Host "PHP SDK starter:"
          Write-Host $starter

          Write-Host ""
          Write-Host "Bison:"
          & $bison --version

          if ($LASTEXITCODE -ne 0) {
              throw "Bison failed."
          }

          Write-Host ""
          Write-Host "re2c:"
          & $re2c --version

          if ($LASTEXITCODE -ne 0) {
              throw "re2c failed."
          }

          Write-Host ""
          Write-Host "PHP SDK 2.8.3 VS18 x64 is READY."


      # ============================================================
      # PREPARE PHP DEVELOPMENT ENVIRONMENT
      # ============================================================

      - name: Prepare PHP development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $phpdevPath = $env:PHP_DEV_PATH

          if (-not (Test-Path $phpdevPath)) {
              throw "PHP development path does not exist: $phpdevPath"
          }

          $imagickDir = "$phpdevPath\ext\imagick"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $imagickDir | Out-Null

          Write-Host "Copying Imagick source..."

          Copy-Item `
            -Path "C:\imagick-src\*" `
            -Destination $imagickDir `
            -Recurse `
            -Force

          Write-Host "Copying PHP executable..."

          $phpExe = Get-ChildItem `
            -Path "C:\php-bin" `
            -Recurse `
            -Filter "php.exe" |
            Select-Object -First 1

          if (-not $phpExe) {
              throw "PHP executable was not found."
          }

          Copy-Item `
            -Path $phpExe.FullName `
            -Destination "$phpdevPath\php.exe" `
            -Force

          Write-Host "Copying PHP runtime DLLs..."

          Get-ChildItem `
            -Path "C:\php-bin" `
            -Recurse `
            -Filter "*.dll" |
            Copy-Item `
              -Destination $phpdevPath `
              -Force

          Write-Host ""
          Write-Host "PHP development environment READY."
          Write-Host "PHP_DEV_PATH=$phpdevPath"


      # ============================================================
      # CREATE BUILD SCRIPT
      # ============================================================

      - name: Create SDK build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildScript = @"
          @echo off
          setlocal

          echo ========================================
          echo PHP SDK VS18 x64
          echo ========================================

          echo PHP_DEV_PATH=%PHP_DEV_PATH%
          echo.

          echo ========================================
          echo Verify build tools
          echo ========================================

          where cl
          if errorlevel 1 (
              echo ERROR: Visual C++ compiler not found.
              exit /b 1
          )

          where nmake
          if errorlevel 1 (
              echo ERROR: nmake not found.
              exit /b 1
          )

          where bison
          if errorlevel 1 (
              echo ERROR: bison not found.
              exit /b 1
          )

          where re2c
          if errorlevel 1 (
              echo ERROR: re2c not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo PHP version
          echo ========================================

          cd /d "%PHP_DEV_PATH%"

          php.exe -v

          if errorlevel 1 (
              echo ERROR: PHP executable failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Enter imagick source
          echo ========================================

          cd /d "%PHP_DEV_PATH%\ext\imagick"

          if not exist "config.w32" (
              echo ERROR: config.w32 not found.
              exit /b 1
          )

          echo.
          echo ========================================
          echo phpize
          echo ========================================

          call phpize.bat

          if errorlevel 1 (
              echo ERROR: phpize failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo configure
          echo ========================================

          call configure.bat --with-imagick=shared --with-imagick-dir=C:\ImageMagick

          if errorlevel 1 (
              echo ERROR: configure failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo nmake
          echo ========================================

          nmake

          if errorlevel 1 (
              echo ERROR: nmake failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Search build output
          echo ========================================

          dir /s /b php_imagick.dll 2>nul

          echo.
          echo ========================================
          echo BUILD SUCCESS
          echo ========================================

          endlocal
          exit /b 0
          "@

          Set-Content `
            -Path "C:\build-imagick.bat" `
            -Value $buildScript `
            -Encoding ASCII

          Write-Host "Build script created."


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build imagick with PHP SDK VS18
        shell: cmd
        run: |
          echo ========================================
          echo Starting PHP SDK VS18 x64
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick.bat

          if errorlevel 1 (
              echo ERROR: Imagick build failed.
              exit /b 1
          )

          echo.
          echo ========================================
          echo Imagick build completed
          echo ========================================


      # ============================================================
      # COLLECT DLL
      # ============================================================

      - name: Collect built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "out" | Out-Null

          Write-Host "Searching for php_imagick.dll..."

          $dll = Get-ChildItem `
            -Path $env:PHP_DEV_PATH `
            -Recurse `
            -Filter "php_imagick.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $dll) {

              Write-Host ""
              Write-Host "ERROR: php_imagick.dll was not produced."

              Write-Host ""
              Write-Host "Searching for all DLL files..."

              Get-ChildItem `
                -Path $env:PHP_DEV_PATH `
                -Recurse `
                -Filter "*.dll" `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              Write-Host ""
              Write-Host "Searching build directories..."

              Get-ChildItem `
                -Path "$env:PHP_DEV_PATH\ext\imagick" `
                -Recurse `
                -Directory `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              exit 1
          }

          Write-Host ""
          Write-Host "FOUND php_imagick.dll:"
          Write-Host $dll.FullName

          Copy-Item `
            -Path $dll.FullName `
            -Destination "out\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "DLL copied to:"
          Write-Host "out\php_imagick.dll"


      # ============================================================
      # VERIFY DLL
      # ============================================================

      - name: Verify built DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "out\php_imagick.dll"

          if (-not (Test-Path $dll)) {
              throw "Output DLL does not exist."
          }

          $file = Get-Item $dll

          Write-Host "========================================"
          Write-Host "Built DLL"
          Write-Host "========================================"

          Write-Host "File:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"

          if ($file.Length -lt 10000) {
              throw "DLL is suspiciously small."
          }

          Write-Host ""
          Write-Host "DLL verification passed."


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: php_imagick-8.6.0beta1-x64-${{ matrix.ts }}
          path: out/php_imagick.dll
          if-no-files-found: error
