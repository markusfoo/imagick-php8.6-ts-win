name: Build Imagick for PHP 8.6.0beta1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6.0beta1"
  IMAGICK_VERSION: "3.8.1"
  IMAGEMAGICK_VERSION: "7.1.1-47"
  PHP_SDK_VERSION: "2.7.1"

jobs:
  build-imagick:
    name: Build Imagick 3.8.1 for PHP 8.6.0beta1
    runs-on: windows-2025

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DOWNLOAD PHP SOURCE
      # ============================================================

      - name: Download PHP 8.6.0beta1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/qa/php-$env:PHP_VERSION-src.zip"

          Write-Host "Downloading PHP source:"
          Write-Host $url

          $maxRetries = 10

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "php-src.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 120

                  if ((Get-Item "php-src.zip").Length -lt 1000000) {
                      throw "Downloaded PHP source archive is unexpectedly small."
                  }

                  Write-Host "PHP source downloaded."
                  break
              }
              catch {
                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Write-Host "Download attempt $attempt failed."
                  Write-Host "Retrying..."
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

      # ============================================================
      # DOWNLOAD IMAGICK SOURCE
      # ============================================================

      - name: Download Imagick 3.8.1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/Imagick/imagick/archive/refs/tags/$env:IMAGICK_VERSION.zip"

          Write-Host "Downloading Imagick:"
          Write-Host $url

          $maxRetries = 10

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "imagick.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 120

                  if ((Get-Item "imagick.zip").Length -lt 100000) {
                      throw "Downloaded Imagick archive is unexpectedly small."
                  }

                  Write-Host "Imagick source downloaded."
                  break
              }
              catch {
                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Write-Host "Download attempt $attempt failed."
                  Write-Host "Retrying..."
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

      # ============================================================
      # DOWNLOAD IMAGEMAGICK DEVELOPMENT PACKAGE
      # ============================================================

      - name: Download ImageMagick development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip"

          Write-Host "Downloading ImageMagick:"
          Write-Host $url

          $maxRetries = 10

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "imagemagick.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 120

                  if ((Get-Item "imagemagick.zip").Length -lt 1000000) {
                      throw "Downloaded ImageMagick archive is unexpectedly small."
                  }

                  Write-Host "ImageMagick downloaded."
                  break
              }
              catch {
                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Write-Host "Download attempt $attempt failed."
                  Write-Host "Retrying..."
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

      # ============================================================
      # DOWNLOAD PHP SDK
      # ============================================================

      - name: Download PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/php/php-sdk-binary-tools/archive/refs/tags/php-sdk-$env:PHP_SDK_VERSION.zip"

          Write-Host "Downloading PHP SDK:"
          Write-Host $url

          $maxRetries = 10

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile "php-sdk.zip" `
                    -UseBasicParsing `
                    -TimeoutSec 120

                  if ((Get-Item "php-sdk.zip").Length -lt 100000) {
                      throw "Downloaded PHP SDK archive is unexpectedly small."
                  }

                  Write-Host "PHP SDK downloaded."
                  break
              }
              catch {
                  if ($attempt -eq $maxRetries) {
                      throw
                  }

                  Write-Host "Download attempt $attempt failed."
                  Write-Host "Retrying..."
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }

      # ============================================================
      # EXTRACT PHP SDK
      # ============================================================

      - name: Extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extractRoot = "C:\php-sdk-extract"
          $sdkRoot = "C:\php-sdk"

          if (Test-Path $extractRoot) {
              Remove-Item $extractRoot -Recurse -Force
          }

          if (Test-Path $sdkRoot) {
              Remove-Item $sdkRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-sdk.zip" `
            -DestinationPath $extractRoot `
            -Force

          $sdkDirectory = Get-ChildItem `
            -Path $extractRoot `
            -Directory |
            Select-Object -First 1

          if (-not $sdkDirectory) {
              throw "PHP SDK root directory was not found."
          }

          Move-Item `
            -Path $sdkDirectory.FullName `
            -Destination $sdkRoot `
            -Force

          $starter = Join-Path $sdkRoot "phpsdk-vs18-x64.bat"

          if (-not (Test-Path $starter)) {
              Write-Host "PHP SDK contents:"
              Get-ChildItem $sdkRoot -Recurse -Depth 2 |
                Select-Object FullName

              throw "phpsdk-vs18-x64.bat was not found."
          }

          Write-Host ""
          Write-Host "PHP SDK READY:"
          Write-Host $starter

      # ============================================================
      # EXTRACT IMAGEMAGICK
      # ============================================================

      - name: Prepare ImageMagick development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw) {
              Remove-Item $raw -Recurse -Force
          }

          if (Test-Path $final) {
              Remove-Item $final -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $raw `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagemagick.zip" `
            -DestinationPath $raw `
            -Force

          Write-Host ""
          Write-Host "Searching ImageMagick headers..."

          $header = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "MagickWand.h" |
            Select-Object -First 1

          if (-not $header) {
              Write-Host "ImageMagick archive contents:"
              Get-ChildItem $raw -Recurse |
                Select-Object -First 200 FullName

              throw "MagickWand.h was not found."
          }

          Write-Host "Found header:"
          Write-Host $header.FullName

          $wandLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickWand_.lib" |
            Select-Object -First 1

          $coreLib = Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "CORE_RL_MagickCore_.lib" |
            Select-Object -First 1

          if (-not $wandLib) {
              throw "CORE_RL_MagickWand_.lib was not found."
          }

          if (-not $coreLib) {
              throw "CORE_RL_MagickCore_.lib was not found."
          }

          $includeRoot = $header.Directory.Parent.FullName
          $libRoot = $wandLib.Directory.FullName

          $targetInclude = "$final\include\imagemagick"
          $targetLib = "$final\lib\imagemagick"
          $targetBin = "$final\bin"

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetLib `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $targetBin `
            -Force | Out-Null

          Copy-Item `
            -Path "$includeRoot\*" `
            -Destination $targetInclude `
            -Recurse `
            -Force

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.lib" |
            ForEach-Object {
                Copy-Item `
                  -Path $_.FullName `
                  -Destination $targetLib `
                  -Force
            }

          Get-ChildItem `
            -Path $raw `
            -Recurse `
            -Filter "*.dll" |
            ForEach-Object {
                Copy-Item `
                  -Path $_.FullName `
                  -Destination $targetBin `
                  -Force
            }

          $finalHeader = "$final\include\imagemagick\MagickWand\MagickWand.h"
          $finalWand = "$final\lib\imagemagick\CORE_RL_MagickWand_.lib"
          $finalCore = "$final\lib\imagemagick\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) {
              throw "Final ImageMagick header is missing."
          }

          if (-not (Test-Path $finalWand)) {
              throw "Final ImageMagick MagickWand library is missing."
          }

          if (-not (Test-Path $finalCore)) {
              throw "Final ImageMagick MagickCore library is missing."
          }

          Write-Host ""
          Write-Host "ImageMagick READY."
          Write-Host "Header:"
          Write-Host $finalHeader
          Write-Host "MagickWand:"
          Write-Host $finalWand
          Write-Host "MagickCore:"
          Write-Host $finalCore

      # ============================================================
      # EXTRACT PHP SOURCE
      # ============================================================

      - name: Prepare PHP source trees
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extractRoot = "C:\php-source-extract"
          $buildRoot = "C:\php-build"

          if (Test-Path $extractRoot) {
              Remove-Item $extractRoot -Recurse -Force
          }

          if (Test-Path $buildRoot) {
              Remove-Item $buildRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractRoot `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path "php-src.zip" `
            -DestinationPath $extractRoot `
            -Force

          $phpRoot = Get-ChildItem `
            -Path $extractRoot `
            -Directory |
            Select-Object -First 1

          if (-not $phpRoot) {
              throw "PHP source root was not found."
          }

          $tsRoot = "$buildRoot\php-src-ts"
          $ntsRoot = "$buildRoot\php-src-nts"

          Copy-Item `
            -Path $phpRoot.FullName `
            -Destination $tsRoot `
            -Recurse `
            -Force

          Copy-Item `
            -Path $phpRoot.FullName `
            -Destination $ntsRoot `
            -Recurse `
            -Force

          Write-Host "PHP TS source:"
          Write-Host $tsRoot

          Write-Host "PHP NTS source:"
          Write-Host $ntsRoot

      # ============================================================
      # EXTRACT IMAGICK INTO BOTH PHP SOURCE TREES
      # ============================================================

      - name: Add Imagick 3.8.1 to PHP source trees
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extractRoot = "C:\imagick-source-extract"

          if (Test-Path $extractRoot) {
              Remove-Item $extractRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path "imagick.zip" `
            -DestinationPath $extractRoot `
            -Force

          $imagickRoot = Get-ChildItem `
            -Path $extractRoot `
            -Directory |
            Select-Object -First 1

          if (-not $imagickRoot) {
              throw "Imagick source root was not found."
          }

          $tsExt = "C:\php-build\php-src-ts\ext\imagick"
          $ntsExt = "C:\php-build\php-src-nts\ext\imagick"

          New-Item `
            -ItemType Directory `
            -Path $tsExt `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $ntsExt `
            -Force | Out-Null

          Copy-Item `
            -Path "$($imagickRoot.FullName)\*" `
            -Destination $tsExt `
            -Recurse `
            -Force

          Copy-Item `
            -Path "$($imagickRoot.FullName)\*" `
            -Destination $ntsExt `
            -Recurse `
            -Force

          Write-Host "Imagick source installed into:"
          Write-Host $tsExt
          Write-Host $ntsExt

      # ============================================================
      # APPLY THE ONLY PHP 8.6 FIX
      # ============================================================

      - name: Patch zend_is_callable for PHP 8.6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $old = "zend_is_callable(user_callback, 0, NULL TSRMLS_CC)"
          $new = "zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)"

          $files = @(
              "C:\php-build\php-src-ts\ext\imagick\imagick_class.c",
              "C:\php-build\php-src-nts\ext\imagick\imagick_class.c"
          )

          foreach ($file in $files) {
              if (-not (Test-Path $file)) {
                  throw "imagick_class.c not found: $file"
              }

              $content = Get-Content `
                -Path $file `
                -Raw

              $count = ([regex]::Matches(
                  $content,
                  [regex]::Escape($old)
              )).Count

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $file
              Write-Host "Occurrences of old API: $count"

              if ($count -ne 1) {
                  throw "Expected exactly one occurrence of zend_is_callable in $file, found $count."
              }

              $content = $content.Replace($old, $new)

              Set-Content `
                -Path $file `
                -Value $content `
                -NoNewline

              $verify = Get-Content `
                -Path $file `
                -Raw

              if (-not $verify.Contains($new)) {
                  throw "PHP 8.6 zend_is_callable_ex patch was not applied."
              }

              if ($verify.Contains($old)) {
                  throw "Old zend_is_callable call still exists."
              }

              Write-Host "Patch applied successfully."
          }

      # ============================================================
      # CREATE TS BUILD SCRIPT
      # ============================================================

      - name: Create TS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          @echo off
          setlocal

          echo ========================================
          echo PHP 8.6.0beta1 Imagick 3.8.1
          echo THREAD SAFE x64
          echo ========================================

          cd /d C:\php-build\php-src-ts

          echo.
          echo ========================================
          echo PHP SDK environment
          echo ========================================

          where cl
          if errorlevel 1 exit /b 1

          where nmake
          if errorlevel 1 exit /b 1

          where bison
          if errorlevel 1 exit /b 1

          where re2c
          if errorlevel 1 exit /b 1

          echo.
          echo ========================================
          echo Buildconf
          echo ========================================

          call buildconf --force
          if errorlevel 1 (
              echo ERROR: buildconf failed
              exit /b 1
          )

          echo.
          echo ========================================
          echo Configure TS
          echo ========================================

          call configure --disable-all --enable-cli --with-php-build=C:\ImageMagick --with-imagick=shared
          if errorlevel 1 (
              echo ERROR: configure failed
              exit /b 1
          )

          echo.
          echo ========================================
          echo Build php_imagick.dll TS
          echo ========================================

          nmake php_imagick.dll
          if errorlevel 1 (
              echo ERROR: nmake failed
              exit /b 1
          )

          if not exist "x64\Release_TS\php_imagick.dll" (
              echo ERROR: TS DLL was not produced
              echo Searching for DLL:
              dir /s /b php_imagick.dll 2^>nul
              exit /b 1
          )

          echo.
          echo TS DLL successfully produced:
          echo x64\Release_TS\php_imagick.dll

          endlocal
          exit /b 0
          '@

          Set-Content `
            -Path "C:\build-imagick-ts.bat" `
            -Value $script `
            -Encoding ASCII

      # ============================================================
      # BUILD TS
      # ============================================================

      - name: Build Imagick TS x64
        shell: cmd
        run: |
          echo ========================================
          echo Starting TS build
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-ts.bat

          if errorlevel 1 (
              echo.
              echo ========================================
              echo TS BUILD FAILED
              echo ========================================
              exit /b 1
          )

      # ============================================================
      # CREATE NTS BUILD SCRIPT
      # ============================================================

      - name: Create NTS build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          @echo off
          setlocal

          echo ========================================
          echo PHP 8.6.0beta1 Imagick 3.8.1
          echo NON THREAD SAFE x64
          echo ========================================

          cd /d C:\php-build\php-src-nts

          echo.
          echo ========================================
          echo PHP SDK environment
          echo ========================================

          where cl
          if errorlevel 1 exit /b 1

          where nmake
          if errorlevel 1 exit /b 1

          where bison
          if errorlevel 1 exit /b 1

          where re2c
          if errorlevel 1 exit /b 1

          echo.
          echo ========================================
          echo Buildconf
          echo ========================================

          call buildconf --force
          if errorlevel 1 (
              echo ERROR: buildconf failed
              exit /b 1
          )

          echo.
          echo ========================================
          echo Configure NTS
          echo ========================================

          call configure --disable-all --disable-zts --enable-cli --with-php-build=C:\ImageMagick --with-imagick=shared
          if errorlevel 1 (
              echo ERROR: configure failed
              exit /b 1
          )

          echo.
          echo ========================================
          echo Build php_imagick.dll NTS
          echo ========================================

          nmake php_imagick.dll
          if errorlevel 1 (
              echo ERROR: nmake failed
              exit /b 1
          )

          if not exist "x64\Release\php_imagick.dll" (
              echo ERROR: NTS DLL was not produced
              echo Searching for DLL:
              dir /s /b php_imagick.dll 2^>nul
              exit /b 1
          )

          echo.
          echo NTS DLL successfully produced:
          echo x64\Release\php_imagick.dll

          endlocal
          exit /b 0
          '@

          Set-Content `
            -Path "C:\build-imagick-nts.bat" `
            -Value $script `
            -Encoding ASCII

      # ============================================================
      # BUILD NTS
      # ============================================================

      - name: Build Imagick NTS x64
        shell: cmd
        run: |
          echo ========================================
          echo Starting NTS build
          echo ========================================

          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-nts.bat

          if errorlevel 1 (
              echo.
              echo ========================================
              echo NTS BUILD FAILED
              echo ========================================
              exit /b 1
          )

      # ============================================================
      # VERIFY PATCHED SOURCE
      # ============================================================

      - name: Verify PHP 8.6 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $new = "zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)"
          $old = "zend_is_callable(user_callback, 0, NULL TSRMLS_CC)"

          $files = @(
              "C:\php-build\php-src-ts\ext\imagick\imagick_class.c",
              "C:\php-build\php-src-nts\ext\imagick\imagick_class.c"
          )

          foreach ($file in $files) {
              $content = Get-Content `
                -Path $file `
                -Raw

              if (-not $content.Contains($new)) {
                  throw "Patched API not found in $file"
              }

              if ($content.Contains($old)) {
                  throw "Old API still exists in $file"
              }

              Write-Host "Verified PHP 8.6 patch:"
              Write-Host $file
          }

      # ============================================================
      # VERIFY DLLS
      # ============================================================

      - name: Verify produced DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "C:\php-build\php-src-ts\x64\Release_TS\php_imagick.dll"
          $nts = "C:\php-build\php-src-nts\x64\Release\php_imagick.dll"

          if (-not (Test-Path $ts)) {
              throw "TS php_imagick.dll was not produced."
          }

          if (-not (Test-Path $nts)) {
              throw "NTS php_imagick.dll was not produced."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "TS DLL"
          Write-Host "========================================"
          Get-Item $ts |
            Select-Object FullName, Length, LastWriteTime

          Write-Host ""
          Write-Host "========================================"
          Write-Host "NTS DLL"
          Write-Host "========================================"
          Get-Item $nts |
            Select-Object FullName, Length, LastWriteTime

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare DLL artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifact = "imagick-3.8.1-php-8.6.0beta1-vs18-x64"

          if (Test-Path $artifact) {
              Remove-Item $artifact -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$artifact\ts" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$artifact\nts" `
            -Force | Out-Null

          Copy-Item `
            "C:\php-build\php-src-ts\x64\Release_TS\php_imagick.dll" `
            "$artifact\ts\php_imagick.dll" `
            -Force

          Copy-Item `
            "C:\php-build\php-src-nts\x64\Release\php_imagick.dll" `
            "$artifact\nts\php_imagick.dll" `
            -Force

          Write-Host ""
          Write-Host "Final artifacts:"
          Get-ChildItem `
            -Path $artifact `
            -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # UPLOAD ONLY THE TWO DLLS
      # ============================================================

      - name: Upload Imagick DLLs
        uses: actions/upload-artifact@v4
        with:
          name: imagick-3.8.1-php-8.6.0beta1-vs18-x64
          path: imagick-3.8.1-php-8.6.0beta1-vs18-x64
          if-no-files-found: error
